<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My plan · IUFIT</title>
<meta name="description" content="Your IUFIT trainer plan status, trial and renewal">
<link rel="stylesheet" href="billing.css?v=v107">
</head>
<body>
<div class="wrap">
<div style="display:flex;justify-content:space-between;align-items:center">
  <a class="logo" href="https://iufit.com">IU<span>FIT</span></a>
  <span id="langtog" style="font-size:12px;font-weight:800;color:var(--muted);cursor:pointer"></span>
</div>
<div class="nav"><a id="n-pr" href="pricing.html"></a><a id="n-bl" href="billing.html"></a><a class="on" id="n-mp" href="my-plan.html"></a></div>

<h1 id="h-title"></h1>
<p class="sub" id="acctLine"></p>
<div id="reminder"></div>
<div class="card" id="statusCard"></div>
<div id="actions" style="margin-top:14px"></div>

<div class="how" style="margin-top:18px">
  <h2 id="kw-t"></h2>
  <ol><li id="kw-1"></li><li id="kw-2"></li><li id="kw-3"></li></ol>
</div>

<div id="foot"></div>
</div>

<script src="billing-common.js?v=v108"></script>
<script>
var B=window.IUFIT_BILLING;
function T(id,k){var el=document.getElementById(id);if(el)el.innerHTML=B.t(k);}
function tp(k,map){var s=B.t(k);for(var x in map)s=s.replace('{'+x+'}',map[x]);return s;}
function thDate(ymd){if(!ymd)return '';var p=ymd.split('-');return B.LANG==='en'?(p[2]+'/'+p[1]+'/'+p[0]):(p[2]+'/'+p[1]+'/'+(+p[0]+543));}
document.getElementById('langtog').textContent=(B.LANG==='en'?'ไทย':'EN');
document.getElementById('langtog').onclick=function(){B.setLang(B.LANG==='en'?'th':'en');};
T('n-pr','nav_pricing');T('n-bl','nav_billing');T('n-mp','nav_myplan');
T('h-title','myplan_title');T('kw-t','know_title');T('kw-1','know1');T('kw-2','know2');T('kw-3','know3');

function render(){
  var lbl=B.accountLabel();
  document.getElementById('acctLine').textContent=lbl?(B.t('acct_prefix')+lbl):B.t('acct_hint');
  var planKey=B.currentPlanKey(),p=B.getPlan(planKey);
  var trial=B.trialActive(),tdl=B.trialDaysLeft();
  var paid=B.paidActive(),exp=B.planExpiry(),edl=B.daysUntil(exp);
  var expired=B.trialExpired();

  var rb='';
  if(trial){var tier=B.reminderTier(tdl);if(tier){var cls=(tdl<=3)?'urgent':(tdl<=7)?'warn':'info';rb='<div class="bn '+cls+'"><b>'+B.t(tdl<=3?'rem_trial_soon':'rem_trial')+'</b>'+tp('rem_trial_m',{d:tdl})+'</div>';}}
  else if(expired){rb='<div class="bn urgent"><b>'+B.t('rem_exp_t')+'</b>'+B.t('rem_exp_m')+'</div>';}
  else if(paid&&edl!=null&&edl<=10){var pcls=(edl<=3)?'urgent':'warn';rb='<div class="bn '+pcls+'"><b>'+B.t('rem_paid_t')+'</b>'+tp('rem_paid_m',{d:edl,date:thDate(exp)})+'</div>';}
  document.getElementById('reminder').innerHTML=rb;

  var h='';
  var planName=trial?B.t('trial_name'):(paid?(p?p.name:'Trainer'):(expired?B.t('free_name'):(p&&p.k!=='free'?p.name:B.t('free_name'))));
  h+='<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px"><div><div class="psub" style="margin:0">'+B.t('cur_label')+'</div><div class="pname" style="font-size:21px">'+planName+'</div>';
  if(trial)h+='<div class="save" style="color:var(--blue)">'+tp('trial_left',{d:tdl})+'</div>';
  else if(paid&&exp)h+='<div class="psub" style="margin-top:3px">'+tp('expires_on',{date:thDate(exp)})+(edl!=null?tp('days_more',{d:edl}):'')+'</div>';
  else if(expired)h+='<div class="save" style="color:var(--red)">'+B.t('one_client')+'</div>';
  h+='</div>';
  var pb=trial?'#eaf3ff':(paid?'#eafaf0':'#f1f4f9'),pf=trial?'#0a84ff':(paid?'#18b26b':'#7a8aa6');
  h+='<span style="background:'+pb+';color:'+pf+';font-size:11px;font-weight:800;padding:5px 12px;border-radius:20px;white-space:nowrap">'+B.t(trial?'pill_trial':(paid?'pill_active':'pill_free'))+'</span></div>';
  if(p&&p.k!=='free'){h+='<div class="feats" style="margin-top:12px;border-top:1px solid var(--line);padding-top:11px">';B.planFeats(p).slice(0,4).forEach(function(f){h+='✓ '+f+'<br>';});h+='</div>';}
  document.getElementById('statusCard').innerHTML=h;

  var a='';
  if(B.IS_STORE){a='<div class="bn info"><b>'+B.t('act_store_t')+'</b>'+B.t('act_store_m')+'</div><a class="btn line" href="'+B.LINE_URL+'" target="_blank" rel="noopener">'+B.t('line_btn')+'</a>';}
  else if(trial){a='<a class="btn pri" href="billing.html?plan=pro&cycle=mo&lang='+B.LANG+'">'+B.t('act_sub_keep')+'</a><a class="btn ghost" style="margin-top:8px" href="pricing.html?lang='+B.LANG+'">'+B.t('act_see_all')+'</a>';}
  else if(paid){a='<a class="btn pri" href="billing.html?plan='+planKey+'&cycle=mo&lang='+B.LANG+'">'+B.t('act_renew')+'</a><a class="btn ghost" style="margin-top:8px" href="pricing.html?lang='+B.LANG+'">'+B.t('act_change')+'</a>';}
  else{a='<a class="btn green" href="billing.html?plan=pro&cycle=mo&lang='+B.LANG+'">'+B.t('act_upgrade')+'</a><a class="btn ghost" style="margin-top:8px" href="pricing.html?lang='+B.LANG+'">'+B.t('act_see_all')+'</a>';}
  document.getElementById('actions').innerHTML=a;
}
render();
try{var _f=document.getElementById("foot");if(_f)_f.innerHTML=B.footerHtml();}catch(e){}
</script>
</body>
</html>
