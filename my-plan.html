<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My AI credits · IUFIT</title>
<meta name="description" content="Your IUFIT AI credit balance linked to LINE OA / e-mail">
<link rel="stylesheet" href="billing.css?v=v109">
</head>
<body>
<div class="wrap">
<div style="display:flex;justify-content:space-between;align-items:center">
  <a class="logo" href="https://iufit.com">IU<span>FIT</span></a>
  <span id="langtog" style="font-size:12px;font-weight:800;color:var(--muted);cursor:pointer"></span>
</div>
<div class="nav"><a id="n-pr" href="pricing.html"></a><a id="n-bl" href="billing.html"></a><a class="on" id="n-mp" href="my-plan.html"></a></div>

<h1 id="h-title"></h1>
<p class="sub" id="acctLine"></p>
<div class="card" id="statusCard"></div>
<div id="actions" style="margin-top:14px"></div>
<div id="foot"></div>
</div>

<script src="billing-common.js?v=v118"></script>
<script>
var B=window.IUFIT_BILLING;
function T(id,k){var el=document.getElementById(id);if(el)el.innerHTML=B.t(k);}
document.getElementById('langtog').textContent=(B.LANG==='en'?'ไทย':'EN');
document.getElementById('langtog').onclick=function(){B.setLang(B.LANG==='en'?'th':'en');};
T('n-pr','nav_pricing');T('n-bl','nav_billing');T('n-mp','nav_myplan');
T('h-title','wal_title');

function render(){
  var lbl=B.accountLabel();
  var uid=B.walletUid();
  document.getElementById('acctLine').textContent=lbl?(B.t('acct_prefix')+lbl):(uid?'':B.t('wal_no_acct'));
  var card=document.getElementById('statusCard');
  if(!uid){
    card.innerHTML='<div class="bn warn" style="margin:0"><b>'+B.t(lbl?'wal_locked':'wal_no_acct')+'</b></div>';
    document.getElementById('actions').innerHTML=
      '<a class="btn pri" href="billing.html?lang='+B.LANG+'">'+B.t('nav_billing')+'</a>'+
      '<a class="btn ghost" style="margin-top:8px" href="pricing.html?lang='+B.LANG+'">'+B.t('nav_pricing')+'</a>';
    return;
  }
  card.innerHTML='<div class="psub" style="margin:0">'+B.t('wal_loading')+'</div>';
  B.fetchWallet(function(w){
    var h='';
    if(w&&w.ok){
      h+='<div class="psub" style="margin:0">'+B.t('wal_title')+'</div>';
      h+='<div class="pname" style="font-size:22px;margin-top:6px">'+w.scan+' <span style="font-size:13px;font-weight:700;color:var(--muted)">'+B.t('cr_scan')+'</span></div>';
      h+='<div class="pname" style="font-size:22px;margin-top:4px">'+w.analyze+' <span style="font-size:13px;font-weight:700;color:var(--muted)">'+B.t('cr_analyze')+'</span></div>';
    }else if(w&&w.locked){
      h+='<div class="bn warn" style="margin:0"><b>'+B.t('wal_locked')+'</b></div>';
    }else{
      h+='<div class="bn info" style="margin:0"><b>'+B.t('wal_unavailable')+'</b></div>';
    }
    card.innerHTML=h;
  });
  document.getElementById('actions').innerHTML=
    '<a class="btn pri" href="billing.html?lang='+B.LANG+'">'+B.t('nav_billing')+'</a>'+
    '<a class="btn ghost" style="margin-top:8px" href="pricing.html?lang='+B.LANG+'">'+B.t('nav_pricing')+'</a>';
}
render();
document.getElementById('foot').innerHTML=B.footerHtml();
</script>
</body>
</html>
