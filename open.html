<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>เปิด IUFIT</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Noto Sans Thai',sans-serif;background:#F6F9FF;color:#10233F;display:flex;min-height:100vh;align-items:center;justify-content:center;padding:22px}
.card{max-width:400px;width:100%;background:#fff;border:1px solid #DDE7F5;border-radius:20px;box-shadow:0 14px 34px rgba(7,30,74,.07);padding:28px 22px;text-align:center}
.logo{font-style:italic;font-weight:850;font-size:30px;color:#0a1f4d;margin-bottom:6px}
.logo span{color:#1150C8}
p{color:#6B7890;font-size:14px;line-height:1.6;margin:4px 0 18px}
.btn{display:block;width:100%;text-decoration:none;font-weight:850;border-radius:13px;padding:14px;font-size:15px;margin-top:10px;border:none;cursor:pointer;font-family:inherit}
.btn.pri{background:#1150C8;color:#fff}
.btn.ghost{background:#eef2f7;color:#1150C8}
.btn.dark{background:#0b2a5b;color:#fff}
.hint{font-size:12px;color:#8492ad;margin-top:14px;line-height:1.6}
.steps{text-align:left;font-size:13px;color:#33475f;line-height:1.7;margin:8px 0 0}
.steps b{color:#1150C8}
</style>
</head>
<body>
<div class="card">
  <div class="logo">IU<span>FIT</span></div>
  <p id="msg">กำลังเปิด IUFIT…</p>
  <div id="btns"></div>
  <div class="hint" id="hint"></div>
</div>
<script>
/* ===== ตั้งค่า ===== */
var APP_BASE='https://iufit.com';
var ANDROID_PKG='com.iufit.twa';
var PLAY_URL='https://play.google.com/store/apps/details?id=com.iufit.twa';   /* Play Store — Android intent เปิดแอปที่ติดตั้งก่อน · ไม่มีค่อยไปสโตร์ */
/* ================= */
var ua=navigator.userAgent||'';
var isLine=/Line\//i.test(ua);
var isAndroid=/Android/i.test(ua);
var isIOS=/iPhone|iPad|iPod/i.test(ua)||(/Macintosh/.test(ua)&&'ontouchend' in document);
var isStandalone=(window.navigator.standalone===true)||(window.matchMedia&&matchMedia('(display-mode: standalone)').matches);
var escaped=/openExternalBrowser=1/i.test(location.search)||/[?&]extb=1/i.test(location.search);
/* ส่งต่อพารามิเตอร์จาก LINE (เช่น ?add=menu) เข้าแอป — ตัดแค่แฟล็กเด้งเบราว์เซอร์ */
var _qs=new URLSearchParams(location.search||'');
_qs.delete('openExternalBrowser'); _qs.delete('extb');
/* ⭐ 2569-09-01 · `next=billing` → เปิดหน้าซื้อเครดิตหลังเด้งออก LINE (allowlist เท่านั้น) */
var _next=_qs.get('next')||'';
_qs.delete('next');
var _plan=_qs.get('plan')||'credit_m';
var _lang=_qs.get('lang')||'th';
var _qstr=_qs.toString();
var APP_URL=APP_BASE+(_qstr?('?'+_qstr):'');
var APP_PATH='iufit.com'+(_qstr?('?'+_qstr):'');
var BILLING_URL=APP_BASE+'/billing.html?plan='+encodeURIComponent(_plan)+'&lang='+encodeURIComponent(_lang==='en'?'en':'th');
var DEST_URL=(_next==='billing')?BILLING_URL:APP_URL;
var DEST_PATH=(_next==='billing')?('iufit.com/billing.html?plan='+encodeURIComponent(_plan)+'&lang='+encodeURIComponent(_lang==='en'?'en':'th')):APP_PATH;
var msg=document.getElementById('msg'),btns=document.getElementById('btns'),hint=document.getElementById('hint');
function b(cls,txt,href,onclick){var a=document.createElement('a');a.className='btn '+cls;a.innerHTML=txt;if(href)a.href=href;if(onclick)a.onclick=onclick;btns.appendChild(a);return a;}

/* ขั้นที่ 1: ถ้าเปิดใน in-app browser ของ LINE -> บังคับเด้งออกเบราว์เซอร์จริงก่อน */
if(isLine && !escaped){
  msg.textContent='กำลังเปิดในเบราว์เซอร์…';
  var self=location.origin+location.pathname+(location.search?location.search+'&':'?')+'openExternalBrowser=1';
  setTimeout(function(){location.href=self;},120);
  b('pri','แตะเพื่อเปิด IUFIT',self);
  hint.innerHTML='ถ้าไม่เด้งออกเอง แตะปุ่มด้านบน หรือแตะเมนูมุมขวาบน แล้วเลือก <b>เปิดในเบราว์เซอร์อื่น</b>';
}
/* ขั้นที่ 2: อยู่ในเบราว์เซอร์จริงแล้ว -> เปิดแอปตามระบบ */
else if(isAndroid){
  var fallback=PLAY_URL||DEST_URL;
  var intent='intent://'+DEST_PATH+'#Intent;scheme=https;package='+ANDROID_PKG+';S.browser_fallback_url='+encodeURIComponent(fallback)+';end';
  msg.textContent=(_next==='billing')?'กำลังเปิดหน้าซื้อเครดิต…':'กำลังเปิดแอป IUFIT…';
  setTimeout(function(){try{location.href=intent;}catch(e){location.href=fallback;}},250);
  b('pri',(_next==='billing')?'เปิดหน้าซื้อเครดิต':'เปิดแอป IUFIT',null,function(){location.href=intent;return false;});
  if(PLAY_URL)b('dark','ดาวน์โหลดจาก Play Store',PLAY_URL);
  b('ghost','เปิดบนเว็บแทน',DEST_URL);
  hint.innerHTML='ถ้ายังไม่เปิด แตะปุ่มด้านบน (ต้องติดตั้งแอป IUFIT ไว้ก่อน)';
}
else if(isIOS){
  if(isStandalone){ location.href=DEST_URL; }
  else {
    msg.innerHTML=(_next==='billing')?'เปิดหน้าซื้อเครดิต':'เปิด IUFIT บน iPhone/iPad';
    b('pri',(_next==='billing')?'เปิดหน้าซื้อเครดิตเลย':'เปิด IUFIT เลย',DEST_URL);
    hint.innerHTML='<div class="steps">📱 <b>อยากให้เปิดเต็มจอเหมือนแอป?</b> iOS ทำผ่านการเพิ่มไอคอนลงหน้าจอ (ทำครั้งเดียว):<br>1. แตะปุ่ม <b>แชร์</b> ด้านล่าง Safari<br>2. เลือก <b>เพิ่มลงในหน้าจอโฮม</b><br>3. ครั้งต่อไปเปิดจาก <b>ไอคอน IUFIT</b> บนหน้าจอ = เต็มจอเหมือนแอป<br><br><span style="color:#b06">หมายเหตุ: iOS ไม่อนุญาตให้ลิงก์เปิด PWA ที่ติดตั้งแล้วโดยตรง จึงต้องเปิดจากไอคอนหน้าจอ</span></div>';
  }
}
else{
  msg.textContent=(_next==='billing')?'กำลังเปิดหน้าซื้อเครดิต…':'กำลังเปิด IUFIT…';
  setTimeout(function(){location.href=DEST_URL;},200);
  b('pri',(_next==='billing')?'เปิดหน้าซื้อเครดิต':'เปิด IUFIT',DEST_URL);
}
</script>
</body>
</html>
