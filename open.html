<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>เปิด IUFIT</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Noto Sans Thai',sans-serif;background:#F6F9FF;color:#10233F;display:flex;min-height:100vh;align-items:center;justify-content:center;padding:22px}
.card{max-width:400px;width:100%;background:#fff;border:1px solid #DDE7F5;border-radius:20px;box-shadow:0 14px 34px rgba(7,30,74,.07);padding:28px 22px;text-align:center}
.logo{font-style:italic;font-weight:850;font-size:30px;color:#0a1f4d;margin-bottom:6px}
.logo span{color:#0A84FF}
p{color:#6B7890;font-size:14px;line-height:1.6;margin:4px 0 18px}
.btn{display:block;width:100%;text-decoration:none;font-weight:850;border-radius:13px;padding:14px;font-size:15px;margin-top:10px;border:none;cursor:pointer;font-family:inherit}
.btn.pri{background:#0A84FF;color:#fff}
.btn.ghost{background:#eef2f7;color:#0A84FF}
.btn.dark{background:#0b2a5b;color:#fff}
.hint{font-size:12px;color:#8492ad;margin-top:14px;line-height:1.6}
</style>
</head>
<body>
<div class="card">
  <div class="logo">IU<span>FIT</span></div>
  <p id="msg">กำลังเปิด IUFIT…</p>
  <div id="btns"></div>
  <div class="hint" id="hint"></div>
</div>
<script>
/* ===== ตั้งค่า ===== */
var APP_URL='https://iufit.com';                 // เว็บ/PWA
var ANDROID_PKG='com.iufit.twa';                 // package ของ TWA
var PLAY_URL='';                                 // <-- ใส่ลิงก์ Play Store เมื่อแอปขึ้นสโตร์แล้ว (เว้นว่าง = ยังไม่ขึ้น)
/* ================= */
var ua=navigator.userAgent||'';
var isAndroid=/Android/i.test(ua);
var isIOS=/iPhone|iPad|iPod/i.test(ua);
var msg=document.getElementById('msg'),btns=document.getElementById('btns'),hint=document.getElementById('hint');
function b(cls,txt,href,onclick){var a=document.createElement('a');a.className='btn '+cls;a.textContent=txt;if(href)a.href=href;if(onclick)a.onclick=onclick;btns.appendChild(a);return a;}

if(isAndroid){
  // มีแอป → เปิดแอป (intent) · ไม่มี → Play Store (ถ้าตั้งค่าแล้ว) มิฉะนั้น → เว็บ
  var fallback=PLAY_URL||APP_URL;
  var intent='intent://iufit.com/#Intent;scheme=https;package='+ANDROID_PKG+';S.browser_fallback_url='+encodeURIComponent(fallback)+';end';
  msg.textContent='กำลังเปิดแอป IUFIT…';
  setTimeout(function(){try{location.href=intent;}catch(e){location.href=fallback;}},250);
  b('pri','เปิดแอป IUFIT',null,function(){location.href=intent;return false;});
  if(PLAY_URL)b('dark','ดาวน์โหลดจาก Play Store',PLAY_URL);
  b('ghost','เปิดบนเว็บแทน',APP_URL);
  hint.innerHTML='ถ้ายังไม่เปิด แตะปุ่มด้านบน · ถ้าเปิดในเบราว์เซอร์ของ LINE ให้เลือก “เปิดในเบราว์เซอร์อื่น” ก่อน';
}else if(isIOS){
  msg.textContent='เปิด IUFIT บน iPhone/iPad';
  b('pri','เปิด IUFIT',APP_URL);
  hint.innerHTML='iOS ใช้ผ่านเว็บ (PWA) — เปิดใน Safari แล้วกด แชร์ → “เพิ่มไปยังหน้าจอโฮม” เพื่อใช้เหมือนแอป';
}else{
  // desktop / อื่น ๆ
  msg.textContent='กำลังเปิด IUFIT…';
  setTimeout(function(){location.href=APP_URL;},400);
  b('pri','เปิด IUFIT',APP_URL);
}
</script>
</body>
</html>
