<script src="billing-common.js?v=v123"></script>
<script>
var B=window.IUFIT_BILLING;
/* ⭐ 2569-09-01 · ใน LINE WebView localStorage คนละที่กับแอป ⇒ ต้องเด้งเบราว์เซอร์จริงก่อนอ่านบัญชี */
var _BILLING_LINE_ESCAPE=false;
(function(){
  var escaped=/openExternalBrowser=1/i.test(location.search)||/[?&]extb=1/i.test(location.search);
  if(B.isInLineWebView() && !escaped){
    _BILLING_LINE_ESCAPE=true;
    var dest=B.billingExternalUrl(B.qs('plan')||'credit_m', B.LANG);
    document.body.innerHTML='<div class="wrap" style="padding:28px 18px;text-align:center"><h1 style="font-size:18px;color:#0a1f4d">'+B.t('cr_need_browser_t')+'</h1><p style="color:#6B7890;line-height:1.55">'+B.t('cr_need_browser_m')+'</p><p style="margin-top:16px"><a class="btn pri" style="display:inline-block;background:#1150C8;color:#fff;text-decoration:none;font-weight:800;border-radius:13px;padding:14px 18px" href="'+dest+'">'+B.t('cr_need_browser_t')+'</a></p></div>';
    setTimeout(function(){location.href=dest;},180);
  }
})();
if(!_BILLING_LINE_ESCAPE){
/* 🔴 2569-08-02 · XSS สะท้อน — `?plan=` เคยไหลดิบ ๆ ลง `innerHTML` ที่ `showResult()`
   ⇒ `planKeyOf()` ยอมรับเฉพาะรหัสที่อยู่ใน `CREDIT_PACKS` · นอกนั้นตกเป็นแพ็กกลาง */
var YR=false, PLAN=B.planKeyOf(B.qs('plan'),'credit_m'), PM='card';
/* ⭐ 2569-08-26 · หน้านี้ขายเฉพาะเครดิต AI — แพ็กโค้ชถูกถอดตามคำสั่งเจ้าของ */
var KIND='credit';
if(!B.isCredit(PLAN))PLAN=B.CREDIT_PACKS[1].k;
function T(id,k){var el=document.getElementById(id);if(el)el.innerHTML=B.t(k);}
document.getElementById('langtog').textContent=(B.LANG==='en'?'ไทย':'EN');
document.getElementById('langtog').onclick=function(){B.setLang(B.LANG==='en'?'th':'en');};
T('n-pr','nav_pricing');T('n-bl','nav_billing');T('n-mp','nav_myplan');

function pickPlan(k){PLAN=k;stopPpPoll();window.__ppWait=false;renderPlanPick();renderSummary();renderPay();}
function renderPlanPick(){
  var el=document.getElementById('planPick');
  var ch='';
  B.CREDIT_PACKS.forEach(function(c){
    var on=(PLAN===c.k);
    ch+='<button onclick="pickPlan(\''+c.k+'\')" style="width:100%;text-align:left;border:1.5px solid '+(on?'var(--blue)':'var(--line-strong)')+';background:'+(on?'#eef4ff':'#fff')+';border-radius:12px;padding:12px 14px;margin-bottom:8px;cursor:pointer;font-family:inherit;display:flex;justify-content:space-between;align-items:center">'
      +'<span><b style="color:var(--navy);font-size:14.5px">'+B.t('cr_title')+' '+c.name+'</b><br>'
      +'<span style="font-size:11.5px;color:var(--muted)">'+B.t('cr_scan')+' '+c.scan+' '+B.t('cr_unit')+' · '+B.t('cr_analyze')+' '+c.analyze+' '+B.t('cr_unit')+'</span></span>'
      +'<span style="font-weight:850;color:var(--blue);white-space:nowrap">฿'+B.fmt(c.price)+'</span></button>';
  });
  el.innerHTML=ch;
}
function renderSummary(){
  var c=B.getCredit(PLAN);if(!c)return;
  document.getElementById('summary').innerHTML=
    '<div class="sumrow"><span>'+B.t('cr_title')+' '+c.name+' · '+B.t('cr_once')+'</span><span>฿'+B.fmt(c.price)+'</span></div>'
    +'<div class="sumrow"><span class="psub" style="margin:0">'+B.t('cr_scan')+'</span><span class="psub" style="margin:0">'+c.scan+' '+B.t('cr_unit')+'</span></div>'
    +'<div class="sumrow"><span class="psub" style="margin:0">'+B.t('cr_analyze')+'</span><span class="psub" style="margin:0">'+c.analyze+' '+B.t('cr_unit')+'</span></div>'
    +'<div class="sumrow total"><span>'+B.t('order_total')+'</span><span>฿'+B.fmt(c.price)+'</span></div>';
}
function renderWallet(){
  var body=document.getElementById('walletBody'); if(!body)return;
  var lbl=B.accountLabel();
  var uid=B.walletUid();
  body.textContent=B.t('wal_loading');
  if(!lbl&&!uid){body.textContent=B.t('wal_no_acct');return;}
  B.fetchWallet(function(w){
    var lines=[];
    if(lbl)lines.push(B.t('acct_prefix')+lbl);
    if(w&&w.ok){
      lines.push(B.t('wal_scan')+': '+B.creditShow(w.scan,w.unlimited)+(w.unlimited?'':' '+B.t('cr_unit')));
      lines.push(B.t('wal_analyze')+': '+B.creditShow(w.analyze,w.unlimited)+(w.unlimited?'':' '+B.t('cr_unit')));
    }else if(w&&w.locked){
      lines.push(B.t('wal_locked'));
    }else{
      lines.push(B.t('wal_unavailable'));
    }
    body.innerHTML=lines.map(function(x){return '<div>'+B.esc(x)+'</div>';}).join('');
  });
}
function renderPay(){
  if(window.__ppWait)return;
  var body=document.getElementById('payBody');
  var soon=!B.OMISE_READY, h='';
  var amt='฿'+B.fmt(B.getCredit(PLAN).price);
  var ppOn=B.omisePpOpen();
  if(PM==='pp'&&!ppOn)PM='card';
  /* เครดิตต้องเป็นบัญชีอีเมลที่ยืนยันแล้ว — ตรงกับแอป (`emailId` หรือ `fbuid` แบบ email:) */
  var crBlocked=!B.isEmailVerifiedForCredits(B.appState());
  if(crBlocked)h+='<div class="bn warn" style="margin:0 0 10px"><b>'+B.t('cr_need_email_t')+'</b>'+B.t('cr_need_email_m')+'</div>';
  var yrLocked=crBlocked;
  if(soon&&PM==='card')h+='<div class="bn warn" style="margin:0 0 10px"><b>'+B.t('omise_soon_t')+'</b>'+B.t('omise_soon_m')+'</div>';
  h+='<div class="pm"><button id="pm-card" class="'+(PM==='card'?'on':'')+'" onclick="setPM(\'card\')">'+B.t('pm_card')+'</button>';
  if(ppOn){
    h+='<button id="pm-pp" class="'+(PM==='pp'?'on':'')+'" onclick="setPM(\'pp\')">'+B.t('pm_pp')+'</button></div>';
  }else{
    h+='<button id="pm-pp" disabled aria-disabled="true" style="opacity:.45;cursor:not-allowed">'+B.t('pm_pp')+' · '+B.t('pm_pp_soon')+'</button></div>';
  }
  var dis=yrLocked?' disabled':'', fOp=yrLocked?';opacity:.5':'';
  h+='<div id="cardForm" class="'+(PM==='card'?'':'hide')+'" style="pointer-events:'+(yrLocked?'none':'auto')+fOp+'"><div class="field"><label>'+B.t('card_name')+'</label><input id="card-name"'+dis+' placeholder="'+B.t('card_name_ph')+'"></div><div class="field"><label>'+B.t('card_num')+'</label><input id="card-num"'+dis+' inputmode="numeric" placeholder="0000 0000 0000 0000"></div><div style="display:flex;gap:10px"><div class="field" style="flex:1"><label>'+B.t('card_exp')+'</label><input id="card-exp"'+dis+' placeholder="MM/YY"></div><div class="field" style="flex:1"><label>'+B.t('card_cvv')+'</label><input id="card-cvv"'+dis+' inputmode="numeric" placeholder="123"></div></div></div>';
  if(PM==='pp')h+='<p class="note" id="ppHint" style="margin:0 0 10px">'+B.t('pp_hint')+'</p>';
  h+='<label style="display:flex;gap:9px;align-items:flex-start;margin:12px 0;font-size:12px;line-height:1.5;cursor:'+(yrLocked?'not-allowed':'pointer')+';color:var(--navy)'+fOp+'"><input type="checkbox" id="agree"'+dis+' onchange="var b=document.getElementById(\'payBtn\');if(b&&!window.__yrLocked){b.disabled=!this.checked;b.style.opacity=this.checked?1:.5;}" style="margin-top:2px;flex:none"><span>'+B.t('consent_refund')+' — <a class="blue" href="refund.html?lang='+B.LANG+'" target="_blank" rel="noopener">'+B.t('nav_refund')+'</a></span></label>';
  h+='<button id="payBtn" class="btn pri" disabled style="opacity:.5" onclick="payNow()">'+(PM==='pp'?B.t('pp_btn'):B.t('pay_btn'))+' '+amt+'</button>';
  h+='<p class="note" style="margin-top:10px">'+(PM==='pp'?B.t('secure_note_pp'):B.t('secure_note'))+'</p>';
  h+='<div style="margin-top:14px;padding:12px 14px;background:#f6f9ff;border:1px solid var(--line);border-radius:12px"><b style="font-size:12.5px;color:var(--navy);display:block;margin-bottom:7px">'+B.t('contact_title')+'</b>'+B.contactRowsHtml()+'</div>';
  body.innerHTML=h;
  window.__yrLocked=yrLocked;
}
function setPM(m){
  stopPpPoll();
  window.__ppWait=false;
  PM=(m==='pp'&&B.omisePpOpen())?'pp':'card';
  renderPay();
}
/* ⭐ 2569-07-30 · ถอด `reserveLocal()` ออก — ปุ่ม "จองราคานี้ไว้ในเครื่อง"
   มันแค่เขียน localStorage แล้วเด้ง alert · ไม่ได้จองอะไรจริง ไม่มีผลผูกพันฝั่งเรา
   ⇒ ทำให้ผู้ใช้เข้าใจผิดว่าล็อกราคาไว้แล้ว · ตอนนี้มีช่องทางจ่ายจริงแล้วจึงไม่ต้องมี */
function loadOmise(cb){if(window.Omise){cb();return;}var s=document.createElement('script');s.src='https://cdn.omise.co/omise.js';s.onload=cb;s.onerror=function(){setPaying(false);alert('Omise load failed');};document.head.appendChild(s);}
/* 🔴 2569-07-31 · กันกดจ่ายซ้ำ — **ชั้นที่ 1 จาก 2**
   ═══════════════════════════════════════════════════════════════════════════
   createToken + สร้าง charge ใช้เวลาหลายวินาที · ปุ่มเดิมกดรัวได้ตลอดช่วงนั้น
   ⇒ สอง charge สอง 3DS · เคสแย่สุดผู้ใช้ยืนยันทั้งคู่ = ถูกตัดเงินสองรอบ

   ⚠️ ชั้นนี้เป็นแค่ UX — ใครก็ยิง `/charge` ตรงข้ามหน้าเว็บได้
      **ด่านจริงอยู่ที่ worker** (ล็อก `pending:<account>|<plan>|<cycle>` ใน KV)
      ห้ามถอดชั้นไหนออกโดยคิดว่าซ้ำซ้อน — คนละหน้าที่กัน (เทียบด่านรายปี 3 ชั้น) */
var PAYING=false;
function setPaying(on){
  PAYING=on;
  var b=document.getElementById('payBtn'); if(!b)return;
  if(on){ if(!b.getAttribute('data-lbl'))b.setAttribute('data-lbl',b.textContent); b.textContent=B.t('pay_processing'); }
  else { var l=b.getAttribute('data-lbl'); if(l)b.textContent=l; }
  b.disabled=on;
  b.style.opacity=on?.6:1;
}
function omiseQrUrl(u){
  if(typeof u!=='string')return '';
  if(u.indexOf('https://')!==0)return '';
  if(/[\s<>"']/.test(u))return '';
  return u;
}
function copyPpRef(){
  var el=document.getElementById('ppRefVal');
  var v=el?el.textContent:'';
  if(!v)return;
  function ok(){alert(B.t('pp_copy_ok'));}
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(v).then(ok).catch(function(){try{window.prompt(B.t('pp_ref'),v);}catch(e){}});
  }else{
    try{window.prompt(B.t('pp_ref'),v);}catch(e){}
  }
}
function backFromPp(){
  stopPpPoll();
  window.__ppWait=false;
  PM='pp';
  renderPay();
}
var ppPollOn=false, ppPollTimer;
function stopPpPoll(){
  ppPollOn=false;
  if(ppPollTimer){clearTimeout(ppPollTimer);ppPollTimer=null;}
}
function pollPp(ref){
  var tries=0, MAX=60; // 60 × 5 วิ = 5 นาที — สแกนแอปธนาคารใช้เวลานานกว่า 3DS
  var note=document.getElementById('ppPollNote');
  stopPpPoll();
  ppPollOn=true;
  (function tick(){
    if(!ppPollOn)return;
    tries++;
    fetch(B.CHARGE_ENDPOINT+'/status?ref='+encodeURIComponent(ref))
      .then(function(r){return r.json();})
      .then(function(j){
        if(!ppPollOn)return;
        if(j.state==='paid'){location.href='billing.html?lang='+B.LANG+'&result=success';return;}
        if(j.state==='failed'){location.href='billing.html?lang='+B.LANG+'&result=failed';return;}
        if(note)note.textContent=B.t(j.charged===true?'pay_charged_m':'pp_poll');
        if(tries>=MAX){if(note)note.textContent=B.t('pp_expire');return;}
        ppPollTimer=setTimeout(tick,5000);
      })
      .catch(function(){
        if(!ppPollOn)return;
        if(tries<MAX)ppPollTimer=setTimeout(tick,5000);
        else if(note)note.textContent=B.t('pp_expire');
      });
  })();
}
function showOmisePp(j){
  window.__ppWait=true;
  var c=B.getCredit(PLAN);
  var amt=c?c.price:0;
  var qr=omiseQrUrl(j&&j.qr);
  var ref=(j&&j.ref)?String(j.ref):'';
  var body=document.getElementById('payBody');
  var h='<div class="pp-wait"><b>'+B.t('pp_wait_t')+'</b>'
    +'<p class="note">'+B.t('pp_wait_m')+'</p>'
    +'<p class="note pp-direct">'+B.t('pp_direct_note')+'</p>'
    +(qr?('<img class="pp-qr" src="'+qr+'" alt="PromptPay QR" width="240" height="240">'):('<p class="note">'+B.t('res_pending_m')+'</p>'))
    +'<div class="pp-amt">฿'+B.fmt(amt)+'</div>'
    +(ref?('<div class="pp-ref-row"><span>'+B.t('pp_ref')+'</span><code id="ppRefVal">'+B.esc(ref)+'</code>'
    +'<button type="button" class="btn ghost" onclick="copyPpRef()">'+B.t('pp_copy')+'</button></div>'):'')
    +'<p class="note" id="ppPollNote">'+B.t('pp_poll')+'</p>'
    +'<p class="note">'+B.t('pp_expire')+'</p>'
    +'<a class="btn line" href="'+B.LINE_URL+'" target="_blank" rel="noopener">'+B.t('pp_line_after')+'</a>'
    +'<button type="button" class="btn ghost" style="margin-top:8px" onclick="backFromPp()">'+B.t('pp_back')+'</button></div>';
  if(body)body.innerHTML=h;
  setPaying(false);
  if(ref)pollPp(ref);
}
function applyChargeResp(j){
  if(j&&(j.error==='credit_needs_email_uid'||j.error==='bad_account')){
    setPaying(false);
    alert(B.t('cr_bad_uid_t')+'\n\n'+B.t('cr_bad_uid_m'));
    try{window.open(B.billingExternalUrl(PLAN,B.LANG),'_blank');}catch(x){}
    return;
  }
  if(j&&j.error==='duplicate_pending'){setPaying(false);alert(B.t('pay_dup_t')+'\n\n'+B.t('pay_dup_m'));return;}
  if(j&&j.error==='duplicate_recent'){setPaying(false);alert(B.t('pay_recent_t')+'\n\n'+B.t('pay_recent_m'));return;}
  if(j&&j.error==='rate_limited'){setPaying(false);alert(B.t('pay_rate_t')+'\n\n'+B.t('pay_rate_m'));return;}
  /* PromptPay · ต้องอยู่หน้า QR จนกว่าจะโอน · ห้ามพาไป result=pending ซึ่งซ่อน QR */
  if(j&&j.qr){showOmisePp(j);return;}
  if(j&&j.authorize_uri){location.href=j.authorize_uri;return;}
  var _ref=(j&&j.ref)?('&ref='+encodeURIComponent(j.ref)):'';
  var _st=(j&&j.status)?String(j.status):'';
  var _res=(_st==='successful')?'success'
    :(_st==='pending')?'pending'
    :(j&&j.error)?'failed'
    :(_st==='failed'||_st==='expired'||_st==='reversed')?'failed'
    :'unknown';
  location.href='billing.html?lang='+B.LANG+'&result='+_res+((_res==='pending'||_res==='unknown')?_ref:'');
}
/* payNow() · บัตร = Omise token + POST /charge · พร้อมเพย์ = worker สร้าง QR Omise แล้ว webhook เติมเครดิต */
function payNow(){
  if(PAYING)return;
  if(B.isInLineWebView()){
    alert(B.t('cr_need_browser_t')+'\n\n'+B.t('cr_need_browser_m'));
    try{location.href=B.billingExternalUrl(PLAN,B.LANG);}catch(x){}
    return;
  }
  B.resolveCreditWalletUid(function(acct){
    if(!acct||!B.isCanonEmailUid(acct)){
      alert(B.t('cr_need_email_t')+'\n\n'+B.t('cr_need_email_m'));
      try{window.open('open.html?next=billing&plan='+encodeURIComponent(PLAN)+'&lang='+encodeURIComponent(B.LANG),'_blank');}catch(x){}
      return;
    }
    payNowWithAccount(acct);
  });
}
function payNowWithAccount(acct){
  var ag=document.getElementById('agree');if(ag&&!ag.checked){alert(B.t('consent_req'));return;}
  if(PM==='pp'){
    if(!B.omisePpOpen()){alert(B.t('pm_pp_soon'));return;}
    if(!B.OMISE_READY){try{window.open(B.LINE_URL,'_blank');}catch(x){}return;}
    setPaying(true);
    fetch(B.CHARGE_ENDPOINT+'/charge',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({source:'promptpay',plan:PLAN,cycle:'once',account:acct})})
      .then(function(r){return r.json();}).then(applyChargeResp)
      .catch(function(){location.href='billing.html?lang='+B.LANG+'&result=unknown';});
    return;
  }
  if(!B.OMISE_READY){try{window.open(B.LINE_URL,'_blank');}catch(x){}return;}
  setPaying(true);
  loadOmise(function(){
    try{Omise.setPublicKey(B.OMISE_PUBLIC_KEY);}catch(e){}
    var exp=(document.getElementById('card-exp').value||'').split('/');
    Omise.createToken('card',{name:document.getElementById('card-name').value,number:(document.getElementById('card-num').value||'').replace(/\s/g,''),expiration_month:(exp[0]||'').trim(),expiration_year:('20'+(exp[1]||'').trim()).slice(-4),security_code:document.getElementById('card-cvv').value},function(status,resp){
      if(status!==200){setPaying(false);alert(resp.message||'card error');return;}
      fetch(B.CHARGE_ENDPOINT+'/charge',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:resp.id,plan:PLAN,cycle:'once',account:acct})})
        .then(function(r){return r.json();}).then(applyChargeResp)
        .catch(function(){location.href='billing.html?lang='+B.LANG+'&result=unknown';});
    });
  });
}
function showResult(kind){
  var el=document.getElementById('resultPanel');el.classList.remove('hide');
  /* `return` = ธนาคารพาผู้ใช้กลับมาหลังทำ 3DS เสร็จ
     🔴 **ไม่ได้แปลว่าจ่ายสำเร็จ** — ผลจริงมาทาง webhook ของ Omise เท่านั้น
        ผู้ใช้ปิดแท็บกลางทางได้ · แก้ URL เองได้ ⇒ หน้านี้บอกได้แค่ "กำลังตรวจสอบ"
        ใช้หน้าตาเดียวกับ pending โดยตั้งใจ */
  /* 🔴 `unknown` = "ยิงคำขอออกไปแล้วแต่ไม่รู้ผลเลย" — คนละเรื่องกับ `failed` โดยสิ้นเชิง
     ใช้หน้าตาแบบ pending (ไม่ใช่กากบาทแดง) เพราะกากบาทแดงคือคำสั่งกลาย ๆ ว่า "จ่ายใหม่"
     และหน้านี้จะ **ไม่มีปุ่มลองใหม่** ให้กด (ดูด้านล่าง) ด้วยเหตุผลเดียวกัน */
  var map={success:{cls:'success',ic:'✓'},pending:{cls:'pending',ic:'⏳'},'return':{cls:'pending',ic:'⏳'},unknown:{cls:'pending',ic:'⚠️'},failed:{cls:'failed',ic:'✕'}}[kind];if(!map)return;
  if(kind==='return')kind='pending';
  /* เครดิตกับแพ็กเป็นคนละสินค้า ⇒ ข้อความสำเร็จต้องต่างกัน
     (ซื้อเครดิตแล้วขึ้นว่า "แพ็กเปิดใช้งานแล้ว" = บอกสิ่งที่ไม่จริงกับลูกค้าที่เพิ่งจ่ายเงิน) */
  var msg=(kind==='success')?B.t('cr_success_m'):B.t('res_'+kind+'_m');
  el.innerHTML='<div class="result '+map.cls+'"><div class="ic">'+map.ic+'</div><h2>'+B.t('res_'+kind+'_t')+'</h2><p class="sub">'+msg+'</p>'
    +'<a class="btn pri" style="max-width:320px;margin:10px auto 0" href="my-plan.html?lang='+B.esc(B.LANG)+'">'+B.t('go_myplan')+'</a>'
    +(kind==='failed'?'<a class="btn ghost" style="max-width:320px;margin:8px auto 0" href="billing.html?plan='+B.esc(encodeURIComponent(PLAN))+'&lang='+B.esc(B.LANG)+'">'+B.t('retry')+'</a>':'')
    +(kind!=='success'?'<a class="btn line" style="max-width:320px;margin:8px auto 0" href="'+B.LINE_URL+'" target="_blank" rel="noopener">'+B.t('line_help')+'</a>':'')+'</div>';
}
/* แถบเตือนโหมดทดสอบ — ขึ้นเสมอไม่ว่าจะอยู่หน้าไหนของ flow (checkout / ผลลัพธ์ / store guard) */
(function(){
  if(!B.OMISE_TEST_MODE)return;
  var el=document.getElementById('testBanner');if(!el)return;
  el.className='';
  el.style.cssText='background:#fef8ed;border:2px solid #f5d98a;border-radius:12px;padding:11px 14px;margin:0 0 14px;font-size:13px;line-height:1.55;color:#8b5d0d';
  el.innerHTML='<b style="display:block;margin-bottom:2px">'+B.t('testmode_t')+'</b>'+B.t('testmode_m');
})();
/* วนถามผลจริงหลังกลับจากหน้า 3DS
   ─────────────────────────────────────────────────────────────────────────
   เมื่อบังคับ 3DS ผลการจ่ายเงินไม่ได้อยู่ในมือเบราว์เซอร์เลย — มาทาง webhook อย่างเดียว
   ถ้าไม่ถามกลับ ลูกค้าจะเห็น "รอการยืนยัน" ค้างตลอดไปแม้จ่ายสำเร็จแล้ว

   ⚠️ ถามได้อย่างเดียว **ห้ามให้หน้านี้ตัดสินสิทธิ์** — มันแค่แสดงสิ่งที่ฝั่ง server สรุปไว้
   ⚠️ มีเพดานเวลา 60 วิ แล้วบอกทางออก ไม่ปล่อยให้หมุนไม่รู้จบ */
/* 🔴 2569-08-02 · แยก "ยังไม่รู้ผล" ออกจาก "เงินถูกตัดแล้วแต่ยังเปิดสิทธิ์ไม่ได้"
   ─────────────────────────────────────────────────────────────────────────
   worker คืน `state:'pending'` ทั้งสองเคส (ถูกแล้ว — ทั้งคู่แปลว่า "ยังไม่จบ")
   แต่แนบ `charged:true` มาด้วยเมื่อเงินออกจากบัตรไปแล้วจริง (`paid:true` + `delivered:false`)
   ⇒ เมื่อรู้ว่าเงินออกไปแล้ว **ต้องเปลี่ยนคำพูดทันทีตั้งแต่รอบวนแรก** ไม่ใช่รอครบ 60 วิ
      แล้วขึ้น "ผลยังไม่กลับมา" ซึ่งลูกค้าอ่านว่า "จ่ายไม่ผ่าน" แล้วไปกดจ่ายซ้ำ
   ⚠️ `chargedSeen` เป็นทางเดียว (false → true เท่านั้น) โดยตั้งใจ — ถ้ารอบถัดไปตอบมา
      ไม่ครบ/ล้มเหลว เราต้องไม่ถอนคำพูดที่ว่า "เงินถูกตัดแล้ว" กลับไปเป็น "ยังไม่รู้ผล" */
function pollStatus(ref){
  var box=document.getElementById('resultPanel'); if(!box)return;
  var tries=0, MAX=20, chargedSeen=false; // 20 × 3 วิ = 60 วิ
  var note=document.createElement('p');
  note.style.cssText='font-size:12.5px;color:var(--muted);margin:10px auto 0;max-width:320px';
  note.textContent=B.t('pay_checking');
  var card=box.querySelector('.result'); if(card)card.appendChild(note);
  /* เขียนหัวข้อ/คำอธิบายของการ์ดใหม่ให้ตรงความจริง — ใช้ textContent ล้วน ไม่แตะ innerHTML
     (ค่าที่เอามาเขียนเป็นคำแปลของเราเอง แต่กติกาของหน้านี้คือไม่เปิดทาง XSS เพิ่มแม้แต่ทางเดียว) */
  function sayCharged(){
    if(chargedSeen)return; chargedSeen=true;
    if(card){
      var h=card.querySelector('h2'); if(h)h.textContent=B.t('pay_charged_t');
      var s=card.querySelector('.sub'); if(s)s.textContent=B.t('pay_charged_m');
    }
    note.textContent=B.t('pay_charged_m');
  }
  function giveUpNote(){ note.textContent=B.t(chargedSeen?'pay_slow_paid':'pay_slow'); }
  (function tick(){
    tries++;
    fetch(B.CHARGE_ENDPOINT+'/status?ref='+encodeURIComponent(ref))
      .then(function(r){return r.json();})
      .then(function(j){
        if(j.state==='paid'){location.href='billing.html?lang='+B.LANG+'&result=success';return;}
        /* `charged:true` + `failed` เกิดพร้อมกันไม่ได้ (worker ตอบ failed เฉพาะตอน
           `status==='failed'` ซึ่งแปลว่าไม่มีเงินออก) ⇒ ลำดับนี้ปลอดภัย */
        if(j.state==='failed'){location.href='billing.html?lang='+B.LANG+'&result=failed';return;}
        if(j.charged===true)sayCharged();
        if(tries>=MAX){giveUpNote();return;}
        setTimeout(tick,3000);
      })
      .catch(function(){ if(tries<MAX)setTimeout(tick,3000); else giveUpNote(); });
  })();
}
(function(){
  var res=B.qs('result');
  if(res){
    showResult(res);
    if(res==='return'||res==='pending'||res==='unknown'){var rf=B.qs('ref'); if(rf)pollStatus(rf);}
    return;
  }
  if(B.IS_STORE){document.getElementById('storeGuard').classList.remove('hide');T('sg-h','billing_title');T('sg-t','store_guard_t');T('sg-m','store_guard_m');document.getElementById('sg-line').innerHTML=B.t('line_btn');return;}
  B.initCreditIdentity(function(){
    document.getElementById('checkout').classList.remove('hide');
    T('co-h','billing_title');T('pm-h','pay_method');T('lbl-pick','cr_pick');T('co-note','secure_note');T('wal-h','wal_title');
    var lbl=B.accountLabel();
    document.getElementById('acctLine').textContent=lbl?(B.t('acct_prefix')+lbl+B.t('acct_bind')):B.t('acct_login');
    renderWallet();
    renderPlanPick();renderSummary();renderPay();
    B.loadMerchantPay(function(){if(!window.__ppWait && !PAYING)renderPay();});
  });
})();
try{var _f=document.getElementById('foot');if(_f)_f.innerHTML=B.footerHtml();}catch(e){}
} /* !_BILLING_LINE_ESCAPE */
</script>
