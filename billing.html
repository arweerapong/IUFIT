<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Subscribe · IUFIT</title>
<meta name="description" content="Subscribe to an IUFIT coach plan — choose plan, cycle and pay via Omise">
<link rel="stylesheet" href="billing.css?v=v108">
</head>
<body>
<div class="wrap">
<div style="display:flex;justify-content:space-between;align-items:center">
  <a class="logo" href="https://iufit.com">IU<span>FIT</span></a>
  <span id="langtog" style="font-size:12px;font-weight:800;color:var(--muted);cursor:pointer"></span>
</div>
<div class="nav"><a id="n-pr" href="pricing.html"></a><a class="on" id="n-bl" href="billing.html"></a><a id="n-mp" href="my-plan.html"></a></div>

<!-- 🔴 แถบเตือนโหมดทดสอบ — เติมจากสคริปต์ท้ายไฟล์
     มีไว้เพื่อให้ "ปล่อยขึ้นจริงทั้งที่ยังเป็นคีย์ test" เห็นได้ทันทีตั้งแต่วินาทีแรก
     ไม่ใช่ไปรู้ตอนสิ้นเดือนว่าไม่มีเงินเข้าเลยสักบาท -->
<div id="testBanner" class="hide"></div>

<div id="resultPanel" class="hide"></div>

<div id="storeGuard" class="hide">
  <h1 id="sg-h"></h1>
  <div class="bn info"><b id="sg-t"></b><span id="sg-m"></span></div>
  <a class="btn line" id="sg-line" href="https://line.me/R/ti/p/@987qyznd" target="_blank" rel="noopener"></a>
</div>

<div id="checkout" class="hide">
  <h1 id="co-h"></h1>
  <p class="sub" id="acctLine"></p>
  <!-- สลับระหว่างแพ็กโค้ช (รายเดือน) กับเครดิต AI (ซื้อครั้งเดียว) — คนละชนิดสินค้า -->
  <div class="toggle" style="margin-bottom:12px">
    <button id="k-plan" class="on" onclick="setKind('plan')"></button>
    <button id="k-credit" onclick="setKind('credit')"></button>
  </div>

  <div class="card" style="margin-bottom:14px">
    <div class="toggle" id="cycleToggle" style="margin-bottom:14px">
      <button id="t-mo" class="on" onclick="setCycle(false)"></button>
      <button id="t-yr" onclick="setCycle(true)"></button>
    </div>
    <!-- การ์ดแจ้งว่ารายปียังไม่เปิด — เนื้อหาเติมจาก renderPay() เพราะต้องขึ้น/ลงตามรอบที่เลือก -->
    <div id="yrNotice" class="bn warn hide" style="margin:0 0 12px"></div>
    <label style="font-size:12.5px;font-weight:700;color:var(--navy);display:block;margin-bottom:6px" id="lbl-pick"></label>
    <div id="planPick"></div>
    <div id="summary" style="margin-top:14px"></div>
  </div>
  <div class="card" id="payCard">
    <b style="font-size:15px;color:var(--navy)" id="pm-h"></b>
    <div id="payBody"></div>
  </div>
  <p class="note" id="co-note"></p>
</div>

<div id="foot"></div>
</div>

<script src="billing-common.js?v=v115"></script>
<script>
var B=window.IUFIT_BILLING;
/* 🔴 2569-08-02 · XSS สะท้อน — `?plan=` เคยไหลดิบ ๆ ลง `innerHTML` ที่ `showResult()`
   `billing.html?result=failed&plan="><img src=x onerror=…` = รัน JS บน origin ของแอป
   ซึ่งเก็บ `_fbrt` (refresh token) ⇒ ยึดบัญชีถาวร บนหน้าที่ผู้ใช้กำลังกรอกเลขบัตร
   ⇒ `planKeyOf()` ยอมรับเฉพาะรหัสที่อยู่ใน `PLANS`/`CREDIT_PACKS` · นอกนั้นตกเป็น 'pro'
   (ชั้นที่สองคือ `B.esc()` ที่จุดต่อสตริง — ดู `showResult`) */
var YR=(B.qs('cycle')==='yr'), PLAN=B.planKeyOf(B.qs('plan'),'pro'), PM='card';
function T(id,k){var el=document.getElementById(id);if(el)el.innerHTML=B.t(k);}
document.getElementById('langtog').textContent=(B.LANG==='en'?'ไทย':'EN');
document.getElementById('langtog').onclick=function(){B.setLang(B.LANG==='en'?'th':'en');};
T('n-pr','nav_pricing');T('n-bl','nav_billing');T('n-mp','nav_myplan');

/* รายปี **ดูราคาได้ตามปกติ** — ด่านกันจ่ายอยู่ที่ `renderPay()` และ `payNow()` แทน
   (เจ้าของตัดสิน 2569-07-30: ให้เห็นราคารายปีเพื่อวางแผนได้ แค่ยังกดจ่ายไม่ได้) */
function setCycle(yr){YR=yr;document.getElementById('t-mo').className=yr?'':'on';document.getElementById('t-yr').className=yr?'on':'';renderPlanPick();renderSummary();renderPay();}
/* KIND = ชนิดสินค้าที่กำลังซื้อ · 'plan' = แพ็กโค้ชรายเดือน · 'credit' = เครดิต AI ซื้อครั้งเดียว
   แยกกันเพราะคิดเงินคนละแบบ: แพ็กมีรอบบิลและวันหมดอายุ · เครดิตเป็นของสะสมไม่มีรอบ */
var KIND='plan';
function setKind(k){
  KIND=k;
  if(k==='credit'){ if(!B.isCredit(PLAN))PLAN=B.CREDIT_PACKS[1].k; }
  else { if(B.isCredit(PLAN))PLAN='pro'; }
  document.getElementById('k-plan').className=(k==='plan')?'on':'';
  document.getElementById('k-credit').className=(k==='credit')?'on':'';
  /* เครดิตไม่มีรายเดือน/รายปี ⇒ ซ่อนตัวสลับรอบไปเลย ไม่ให้เข้าใจผิดว่าเป็นสมาชิกรายเดือน */
  document.getElementById('cycleToggle').style.display=(k==='credit')?'none':'';
  T('lbl-pick',k==='credit'?'cr_pick':'pick_plan');
  renderPlanPick();renderSummary();renderPay();
}
function pickPlan(k){PLAN=k;renderPlanPick();renderSummary();renderPay();}
function renderPlanPick(){
  var el=document.getElementById('planPick');
  if(KIND==='credit'){
    var ch='';
    B.CREDIT_PACKS.forEach(function(c){
      var on=(PLAN===c.k);
      ch+='<button onclick="pickPlan(\''+c.k+'\')" style="width:100%;text-align:left;border:1.5px solid '+(on?'var(--blue)':'var(--line-strong)')+';background:'+(on?'#eef4ff':'#fff')+';border-radius:12px;padding:12px 14px;margin-bottom:8px;cursor:pointer;font-family:inherit;display:flex;justify-content:space-between;align-items:center">'
        +'<span><b style="color:var(--navy);font-size:14.5px">'+B.t('cr_title')+' '+c.name+'</b><br>'
        +'<span style="font-size:11.5px;color:var(--muted)">'+B.t('cr_scan')+' '+c.scan+' '+B.t('cr_unit')+' · '+B.t('cr_analyze')+' '+c.analyze+' '+B.t('cr_unit')+'</span></span>'
        +'<span style="font-weight:850;color:var(--blue);white-space:nowrap">฿'+B.fmt(c.price)+'</span></button>';
    });
    el.innerHTML=ch;return;
  }
  var h='';
  B.PLANS.forEach(function(p){
    if(p.k==='free'||p.contact)return;
    var on=(PLAN===p.k),pr=YR?p.yr:p.mo,un=YR?B.t('per_yr'):B.t('per_mo');
    h+='<button onclick="pickPlan(\''+p.k+'\')" style="width:100%;text-align:left;border:1.5px solid '+(on?'var(--blue)':'var(--line-strong)')+';background:'+(on?'#eef4ff':'#fff')+';border-radius:12px;padding:12px 14px;margin-bottom:8px;cursor:pointer;font-family:inherit;display:flex;justify-content:space-between;align-items:center">'
      +'<span><b style="color:var(--navy);font-size:14.5px">'+p.name+'</b>'+(p.badge?' <span class="badge" style="margin:0;vertical-align:middle">'+B.planBadge(p)+'</span>':'')+'<br><span style="font-size:11.5px;color:var(--muted)">'+p.clients+B.t('clients_unit')+'</span></span>'
      +'<span style="font-weight:850;color:var(--blue);white-space:nowrap">฿'+B.fmt(pr)+'<span style="font-size:11px;color:var(--muted)"> '+un+'</span></span></button>';
  });
  el.innerHTML=h;
}
function renderSummary(){
  if(KIND==='credit'){
    var c=B.getCredit(PLAN);if(!c)return;
    document.getElementById('summary').innerHTML=
      '<div class="sumrow"><span>'+B.t('cr_title')+' '+c.name+' · '+B.t('cr_once')+'</span><span>฿'+B.fmt(c.price)+'</span></div>'
      +'<div class="sumrow"><span class="psub" style="margin:0">'+B.t('cr_scan')+'</span><span class="psub" style="margin:0">'+c.scan+' '+B.t('cr_unit')+'</span></div>'
      +'<div class="sumrow"><span class="psub" style="margin:0">'+B.t('cr_analyze')+'</span><span class="psub" style="margin:0">'+c.analyze+' '+B.t('cr_unit')+'</span></div>'
      +'<div class="sumrow total"><span>'+B.t('order_total')+'</span><span>฿'+B.fmt(c.price)+'</span></div>';
    return;
  }
  var p=B.getPlan(PLAN);if(!p)return;
  var pr=YR?p.yr:p.mo,un=YR?B.t('per_yr'):B.t('per_mo'),was=YR?p.yrWas:p.moWas;
  var h='<div class="sumrow"><span>'+p.name+' '+un+'</span><span>'+(was?'<span style="color:var(--muted);text-decoration:line-through;margin-right:6px">฿'+B.fmt(was)+'</span>':'')+'฿'+B.fmt(pr)+'</span></div>';
  if(YR)h+='<div class="sumrow"><span class="psub" style="margin:0">'+B.t('equiv')+'</span><span class="psub" style="margin:0">฿'+B.fmt(Math.round(pr/12))+B.t('per_mo')+'</span></div>';
  h+='<div class="sumrow total"><span>'+B.t('order_total')+'</span><span>฿'+B.fmt(pr)+'</span></div>';
  document.getElementById('summary').innerHTML=h;
}
function renderPay(){
  var body=document.getElementById('payBody');
  var isCr=(KIND==='credit');
  var soon=!B.OMISE_READY, h='';
  var amt='฿'+B.fmt(isCr?B.getCredit(PLAN).price:(YR?B.getPlan(PLAN).yr:B.getPlan(PLAN).mo));
  /* เครดิตต้องเป็นบัญชีอีเมลที่ยืนยันแล้ว — `iufit-gym` ผูกกระเป๋ากับ uid รูป `email:…`
     บอกตั้งแต่ตรงนี้ ไม่ปล่อยให้กรอกบัตรจนจบแล้วค่อยเด้ง error */
  var crBlocked=isCr && (B.accountKey().indexOf('email:')!==0);
  if(crBlocked)h+='<div class="bn warn" style="margin:0 0 10px"><b>'+B.t('cr_need_email_t')+'</b>'+B.t('cr_need_email_m')+'</div>';
  /* 🔴 รายปียังไม่เปิดชำระ (เพดาน Omise 3,000 บ./รายการ · ราคารายปี 3,990–7,990 เกินทุกตัว)
     ดูราคาได้ แต่ **กรอกบัตรไม่ได้และกดจ่ายไม่ได้** — บอกเหตุผลและวันที่เปิดให้ชัด
     ไม่ปล่อยให้กรอกบัตรจนจบแล้วค่อยเด้ง error ตอนกดจ่าย (เสียเวลาผู้ใช้และดูเหมือนระบบพัง) */
  /* 🔴 2569-08-01 · แพ็กโค้ชยังไม่เปิดขาย (ฟรีถึง 31 ธ.ค. 2569) — **เครดิต AI ยังซื้อได้**
     `!isCr` คือหัวใจของบรรทัดนี้: ปิดเฉพาะแพ็ก ไม่ปิดเครดิต เพราะเป็นคนละสินค้า
     ⚠️ ต้องขึ้นข้อความว่า "ยังไม่ต้องจ่าย" ไม่ใช่ปล่อยปุ่มเทา ๆ เงียบ ๆ
        ปุ่มที่กดไม่ได้โดยไม่บอกเหตุผล ผู้ใช้จะอ่านว่าระบบพัง แล้วเลิกใช้ทั้งที่ของฟรีอยู่ */
  var planLocked=(!isCr && !B.PLANS_OPEN);
  var yrLocked=(YR&&!B.YEARLY_OPEN&&!isCr)||crBlocked||planLocked;
  if(planLocked)h+='<div class="bn ok" style="margin:0 0 10px"><b>'+B.t('pl_free_t')+'</b>'+B.t('pl_free_m')+'</div>';
  if(soon)h+='<div class="bn warn" style="margin:0 0 10px"><b>'+B.t('omise_soon_t')+'</b>'+B.t('omise_soon_m')+'</div>';
  /* 🔴 2569-07-30 · PromptPay ถูก "ปิดไว้ชั่วคราว" — ยังไม่รองรับจริง
     payNow() ด้านล่างสร้างได้เฉพาะ card token (Omise.createToken('card',...)) และอ่านค่าจากฟอร์มบัตร
     ถ้าเปิดให้เลือก PromptPay ได้ ผู้ใช้จะกดจ่ายแล้วไปอ่านฟอร์มบัตรที่ซ่อนอยู่ (ค่าว่าง) → ขึ้น alert 'card error'
     การรองรับจริงต้องใช้ Omise source (type:'promptpay') + ฝั่ง CHARGE_ENDPOINT ต้องสร้าง charge จาก source
     และคืน QR ให้สแกน ⇒ **เปิดคืนได้เฉพาะเมื่อ backend รองรับแล้วเท่านั้น** */
  h+='<div class="pm"><button id="pm-card" class="on" onclick="setPM(\'card\')">'+B.t('pm_card')+'</button>'
    +'<button id="pm-pp" disabled aria-disabled="true" style="opacity:.45;cursor:not-allowed">'+B.t('pm_pp')+' · '+B.t('pm_pp_soon')+'</button></div>';
  var dis=yrLocked?' disabled':'', fOp=yrLocked?';opacity:.5':'';
  h+='<div id="cardForm" class="'+(PM==='card'?'':'hide')+'" style="pointer-events:'+(yrLocked?'none':'auto')+fOp+'"><div class="field"><label>'+B.t('card_name')+'</label><input id="card-name"'+dis+' placeholder="'+B.t('card_name_ph')+'"></div><div class="field"><label>'+B.t('card_num')+'</label><input id="card-num"'+dis+' inputmode="numeric" placeholder="0000 0000 0000 0000"></div><div style="display:flex;gap:10px"><div class="field" style="flex:1"><label>'+B.t('card_exp')+'</label><input id="card-exp"'+dis+' placeholder="MM/YY"></div><div class="field" style="flex:1"><label>'+B.t('card_cvv')+'</label><input id="card-cvv"'+dis+' inputmode="numeric" placeholder="123"></div></div></div>';
  /* ⚠️ ช่องติ๊กต้องปลดล็อกปุ่มจ่ายไม่ได้เมื่อรายปีถูกล็อก — ไม่งั้นติ๊กแล้วกดจ่ายได้ทั้งที่ห้ามไว้ */
  h+='<label style="display:flex;gap:9px;align-items:flex-start;margin:12px 0;font-size:12px;line-height:1.5;cursor:'+(yrLocked?'not-allowed':'pointer')+';color:var(--navy)'+fOp+'"><input type="checkbox" id="agree"'+dis+' onchange="var b=document.getElementById(\'payBtn\');if(b&&!window.__yrLocked){b.disabled=!this.checked;b.style.opacity=this.checked?1:.5;}" style="margin-top:2px;flex:none"><span>'+B.t('consent_refund')+' — <a class="blue" href="refund.html?lang='+B.LANG+'" target="_blank" rel="noopener">'+B.t('nav_refund')+'</a></span></label>';
  /* รายปีล็อกไว้ ⇒ ปุ่มจ่ายกดไม่ได้ตั้งแต่ต้น (ช่องติ๊กยอมรับก็ปลดไม่ได้)
     ⭐ 2569-07-30 · ตัดปุ่ม "จองราคานี้ไว้ในเครื่อง" และ "สมัครทาง LINE" ออกตามที่เจ้าของสั่ง
        เหลือทางเดียวคือชำระผ่าน Omise — สองปุ่มนั้นมีไว้ตอนยังไม่มีช่องทางจ่ายจริง */
  /* ตอนแพ็กถูกล็อก ปุ่มไม่ควรเขียนว่า "ชำระเงิน ฿399" — ยอดนั้นยังไม่ต้องจ่าย
     ข้อความบนปุ่มคือสิ่งที่ผู้ใช้อ่านก่อนอย่างอื่น ต้องตรงกับความจริง */
  h+='<button id="payBtn" class="btn pri" disabled style="opacity:.5" onclick="payNow()">'
    +(planLocked?B.t('pl_free_btn'):B.t('pay_btn')+' '+amt)+'</button>';
  if(planLocked)h+='<p class="note" style="margin-top:10px">'+B.t('pl_free_cr')+'</p>';
  h+='<p class="note" style="margin-top:10px">'+B.t('secure_note')+'</p>';
  h+='<div style="margin-top:14px;padding:12px 14px;background:#f6f9ff;border:1px solid var(--line);border-radius:12px"><b style="font-size:12.5px;color:var(--navy);display:block;margin-bottom:7px">'+B.t('contact_title')+'</b>'+B.contactRowsHtml()+'</div>';
  body.innerHTML=h;
  window.__yrLocked=yrLocked; // ให้ handler ของช่องติ๊กอ่านได้ (inline onchange อยู่นอกสโคปนี้)
  /* การ์ดแจ้งเหนือรายการแพ็ก — ขึ้น/ลงตามรอบที่เลือก */
  var nb=document.getElementById('yrNotice');
  var showYrNotice=(YR&&!B.YEARLY_OPEN&&KIND!=='credit');
  if(nb){nb.className=showYrNotice?'bn warn':'bn warn hide';
    nb.innerHTML='<b>'+B.t('yr_soon_t')+'</b><span>'+B.t('yr_soon_m')+'</span>';}
}
/* กันไว้อีกชั้น: payNow() รองรับเฉพาะบัตร ⇒ ไม่ยอมให้ PM กลายเป็นค่าอื่นแม้ถูกเรียกจากที่อื่น */
function setPM(){PM='card';renderPay();}
/* ⭐ 2569-07-30 · ถอด `reserveLocal()` ออก — ปุ่ม "จองราคานี้ไว้ในเครื่อง"
   มันแค่เขียน localStorage แล้วเด้ง alert · ไม่ได้จองอะไรจริง ไม่มีผลผูกพันฝั่งเรา
   ⇒ ทำให้ผู้ใช้เข้าใจผิดว่าล็อกราคาไว้แล้ว · ตอนนี้มีช่องทางจ่ายจริงแล้วจึงไม่ต้องมี */
function loadOmise(cb){if(window.Omise){cb();return;}var s=document.createElement('script');s.src='https://cdn.omise.co/omise.js';s.onload=cb;s.onerror=function(){setPaying(false);alert('Omise load failed');};document.head.appendChild(s);}
/* 🔴 2569-07-31 · กันกดจ่ายซ้ำ — **ชั้นที่ 1 จาก 2**
   ═══════════════════════════════════════════════════════════════════════════
   createToken + สร้าง charge ใช้เวลาหลายวินาที · ปุ่มเดิมกดรัวได้ตลอดช่วงนั้น
   ⇒ สอง charge สอง 3DS · เคสแย่สุดผู้ใช้ยืนยันทั้งคู่ = ถูกตัดเงินสองรอบ

   ⚠️ ชั้นนี้เป็นแค่ UX — ใครก็ยิง `/charge` ตรงข้ามหน้าเว็บได้
      **ด่านจริงอยู่ที่ worker** (ล็อก `pending:<account>|<plan>|<cycle>` ใน KV)
      ห้ามถอดชั้นไหนออกโดยคิดว่าซ้ำซ้อน — คนละหน้าที่กัน (เทียบด่านรายปี 3 ชั้น) */
var PAYING=false;
function setPaying(on){
  PAYING=on;
  var b=document.getElementById('payBtn'); if(!b)return;
  if(on){ if(!b.getAttribute('data-lbl'))b.setAttribute('data-lbl',b.textContent); b.textContent=B.t('pay_processing'); }
  else { var l=b.getAttribute('data-lbl'); if(l)b.textContent=l; }
  b.disabled=on;
  b.style.opacity=on?.6:1;
}
/* payNow() รองรับ **บัตรเท่านั้น** — Omise.createToken('card',...) + POST {token} ไป CHARGE_ENDPOINT/charge
   ถ้าจะเพิ่ม PromptPay ต้องเพิ่ม branch สร้าง source (type:'promptpay') และ backend ต้องคืน QR/สถานะรอชำระด้วย */
function payNow(){
  /* กันการกดซ้อนตั้งแต่บรรทัดแรก — ครอบคลุมกรณีปุ่มถูกปลด disabled จาก devtools ด้วย */
  if(PAYING)return;
  /* 🔴 ด่านสุดท้ายฝั่งเบราว์เซอร์ — ต่อให้มีคนปลด disabled ใน devtools ก็ต้องไม่หลุด
     (ด่านจริงอยู่ที่ worker ซึ่งปฏิเสธยอด > 3,000 อยู่แล้ว · ชั้นนี้กันไม่ให้ยิงไปตั้งแต่ต้น) */
  var isCr=(KIND==='credit');
  /* 🔴 แพ็กโค้ชยังไม่เปิดขาย — ชั้นที่ 2 จาก 3 (ชั้น 3 คือ worker ปฏิเสธ kind!=='credit') */
  if(!isCr&&!B.PLANS_OPEN){alert(B.t('pl_free_t')+'\n'+B.t('pl_free_m'));return;}
  if(!isCr&&YR&&!B.YEARLY_OPEN){alert(B.t('yr_soon_t')+'\n'+B.t('yr_soon_m'));return;}
  /* เครดิตเติมเข้ากระเป๋าที่ผูกกับอีเมล ⇒ บัญชี LINE ล้วนจ่ายแล้วเติมไม่เข้า
     (worker ปฏิเสธซ้ำด้วย `credit_needs_email` — ชั้นนี้ให้ผู้ใช้รู้เหตุผลก่อน) */
  if(isCr&&B.accountKey().indexOf('email:')!==0){alert(B.t('cr_need_email_t')+'\n\n'+B.t('cr_need_email_m'));return;}
  /* 🔴 2569-07-30 · เจอจากการทดสอบจริง — ห้ามรับเงินถ้าไม่รู้ว่าเป็นของใคร
     `accountKey()` คืนค่าว่างเมื่อยังไม่เคยล็อกอินในแอป (เช่นกดลิงก์นี้จาก Rich Menu ตรง ๆ)
     ปล่อยไว้ = จ่ายเงินสำเร็จแต่เปิดแพ็กให้ใครไม่ได้ และตามหาเจ้าของย้อนหลังไม่ได้
     (worker ปฏิเสธซ้ำอีกชั้นด้วย `no_account` — ชั้นนี้มีไว้ให้ผู้ใช้รู้เหตุผลก่อนกรอกบัตร) */
  if(!B.accountKey()){alert(B.t('need_login_t')+'\n\n'+B.t('need_login_m'));try{window.open('open.html','_blank');}catch(x){}return;}
  var ag=document.getElementById('agree');if(ag&&!ag.checked){alert(B.t('consent_req'));return;}
  if(!B.OMISE_READY){try{window.open(B.LINE_URL,'_blank');}catch(x){}return;}
  /* ล็อกปุ่มทันทีที่ผ่านด่านทั้งหมด — ก่อนงานที่กินเวลาชิ้นแรก (โหลด omise.js) */
  setPaying(true);
  loadOmise(function(){
    try{Omise.setPublicKey(B.OMISE_PUBLIC_KEY);}catch(e){}
    var exp=(document.getElementById('card-exp').value||'').split('/');
    Omise.createToken('card',{name:document.getElementById('card-name').value,number:(document.getElementById('card-num').value||'').replace(/\s/g,''),expiration_month:(exp[0]||'').trim(),expiration_year:('20'+(exp[1]||'').trim()).slice(-4),security_code:document.getElementById('card-cvv').value},function(status,resp){
      /* บัตรผิดรูป = ยังไม่มีอะไรถูกส่งไปเลย ⇒ ปลดปุ่มให้แก้แล้วลองใหม่ได้ทันที */
      if(status!==200){setPaying(false);alert(resp.message||'card error');return;}
      fetch(B.CHARGE_ENDPOINT+'/charge',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:resp.id,plan:PLAN,cycle:isCr?'once':(YR?'yr':'mo'),account:B.accountKey()})})
        .then(function(r){return r.json();}).then(function(j){
          /* 🔴 ด่านฝั่ง server บอกว่า "ไม่สร้างรายการให้" — ไม่มีการตัดเงินเกิดขึ้น
             ⇒ **ห้ามพาไปหน้า "ชำระเงินไม่สำเร็จ"** เพราะจะทำให้ผู้ใช้เข้าใจว่าบัตรมีปัญหา
                แล้วไปลองบัตรใบอื่น ทั้งที่เหตุผลจริงคือ "รายการก่อนหน้ายังค้างอยู่" */
          if(j&&j.error==='duplicate_pending'){setPaying(false);alert(B.t('pay_dup_t')+'\n\n'+B.t('pay_dup_m'));return;}
          /* 🔴 2569-08-02 · รายการเดิม **สำเร็จไปแล้ว** เมื่อไม่กี่วินาทีก่อน (กด Back แล้วกดจ่ายซ้ำ)
             ต้องบอกว่า "ได้ของแล้ว" ไม่ใช่ "กำลังดำเนินการ" และห้ามพาไปหน้าชำระไม่สำเร็จเด็ดขาด
             — ไม่งั้นคนที่จ่ายสำเร็จแล้วจะไปลองบัตรใบอื่นและถูกตัดเงินจริงรอบสอง */
          if(j&&j.error==='duplicate_recent'){setPaying(false);alert(B.t('pay_recent_t')+'\n\n'+B.t('pay_recent_m'));return;}
          if(j&&j.error==='rate_limited'){setPaying(false);alert(B.t('pay_rate_t')+'\n\n'+B.t('pay_rate_m'));return;}
          /* 🔴 3-D Secure — บรรทัดนี้คือหัวใจ ห้ามลบ
             บัญชีเราถูกบังคับ 3DS ทุกรายการ ⇒ charge ตอบ `pending` + `authorize_uri`
             (หน้ายืนยัน OTP/แอปธนาคาร) · ถ้าไม่พาผู้ใช้ไปที่นั่น charge จะค้างแล้วหมดอายุ
             ⇒ **ไม่มีรายการไหนสำเร็จเลยสักรายการ** ทั้งที่ลูกค้าเข้าใจว่าจ่ายแล้ว

             ⚠️ ต้อง redirect ทั้งหน้า ห้าม window.open — ธนาคารหลายแห่งบล็อก 3DS ใน popup/iframe */
          if(j&&j.authorize_uri){location.href=j.authorize_uri;return;}
          /* 🔴 2569-08-02 · ต้องหอบ `ref` ไปด้วยเมื่อผลยังไม่จบ
             worker ตอบ `pending` ในเคส "ตัดเงินได้แล้วแต่เขียนสิทธิ์ไม่ลง" ด้วย (ไม่ใช่แค่ 3DS)
             เดิมเส้นนี้ทิ้ง `ref` ⇒ หน้าผลลัพธ์ไม่มีอะไรให้วนถาม ⇒ ค้างที่ "รอการยืนยัน"
             ตลอดกาล ทั้งที่ฝั่ง worker แค่รอให้มีใครมากระตุ้นให้ลองส่งมอบใหม่ */
          var _ref=(j&&j.ref)?('&ref='+encodeURIComponent(j.ref)):'';
          location.href='billing.html?lang='+B.LANG+'&result='+(j.status==='successful'?'success':(j.status==='pending'?'pending'+_ref:'failed'));})
        .catch(function(){location.href='billing.html?lang='+B.LANG+'&result=failed';});
    });
  });
}
function showResult(kind){
  var el=document.getElementById('resultPanel');el.classList.remove('hide');
  /* `return` = ธนาคารพาผู้ใช้กลับมาหลังทำ 3DS เสร็จ
     🔴 **ไม่ได้แปลว่าจ่ายสำเร็จ** — ผลจริงมาทาง webhook ของ Omise เท่านั้น
        ผู้ใช้ปิดแท็บกลางทางได้ · แก้ URL เองได้ ⇒ หน้านี้บอกได้แค่ "กำลังตรวจสอบ"
        ใช้หน้าตาเดียวกับ pending โดยตั้งใจ */
  var map={success:{cls:'success',ic:'✓'},pending:{cls:'pending',ic:'⏳'},'return':{cls:'pending',ic:'⏳'},failed:{cls:'failed',ic:'✕'}}[kind];if(!map)return;
  if(kind==='return')kind='pending';
  /* เครดิตกับแพ็กเป็นคนละสินค้า ⇒ ข้อความสำเร็จต้องต่างกัน
     (ซื้อเครดิตแล้วขึ้นว่า "แพ็กเปิดใช้งานแล้ว" = บอกสิ่งที่ไม่จริงกับลูกค้าที่เพิ่งจ่ายเงิน) */
  var msg=(kind==='success'&&B.isCredit(PLAN))?B.t('cr_success_m'):B.t('res_'+kind+'_m');
  el.innerHTML='<div class="result '+map.cls+'"><div class="ic">'+map.ic+'</div><h2>'+B.t('res_'+kind+'_t')+'</h2><p class="sub">'+msg+'</p>'
    +'<a class="btn pri" style="max-width:320px;margin:10px auto 0" href="my-plan.html?lang='+B.esc(B.LANG)+'">'+B.t('go_myplan')+'</a>'
    +(kind==='failed'?'<a class="btn ghost" style="max-width:320px;margin:8px auto 0" href="billing.html?plan='+B.esc(encodeURIComponent(PLAN))+'&cycle='+(YR?'yr':'mo')+'&lang='+B.esc(B.LANG)+'">'+B.t('retry')+'</a>':'')
    +(kind!=='success'?'<a class="btn line" style="max-width:320px;margin:8px auto 0" href="'+B.LINE_URL+'" target="_blank" rel="noopener">'+B.t('line_help')+'</a>':'')+'</div>';
}
/* แถบเตือนโหมดทดสอบ — ขึ้นเสมอไม่ว่าจะอยู่หน้าไหนของ flow (checkout / ผลลัพธ์ / store guard) */
(function(){
  if(!B.OMISE_TEST_MODE)return;
  var el=document.getElementById('testBanner');if(!el)return;
  el.className='';
  el.style.cssText='background:#fef8ed;border:2px solid #f5d98a;border-radius:12px;padding:11px 14px;margin:0 0 14px;font-size:13px;line-height:1.55;color:#8b5d0d';
  el.innerHTML='<b style="display:block;margin-bottom:2px">'+B.t('testmode_t')+'</b>'+B.t('testmode_m');
})();
/* วนถามผลจริงหลังกลับจากหน้า 3DS
   ─────────────────────────────────────────────────────────────────────────
   เมื่อบังคับ 3DS ผลการจ่ายเงินไม่ได้อยู่ในมือเบราว์เซอร์เลย — มาทาง webhook อย่างเดียว
   ถ้าไม่ถามกลับ ลูกค้าจะเห็น "รอการยืนยัน" ค้างตลอดไปแม้จ่ายสำเร็จแล้ว

   ⚠️ ถามได้อย่างเดียว **ห้ามให้หน้านี้ตัดสินสิทธิ์** — มันแค่แสดงสิ่งที่ฝั่ง server สรุปไว้
   ⚠️ มีเพดานเวลา 60 วิ แล้วบอกทางออก ไม่ปล่อยให้หมุนไม่รู้จบ */
/* 🔴 2569-08-02 · แยก "ยังไม่รู้ผล" ออกจาก "เงินถูกตัดแล้วแต่ยังเปิดสิทธิ์ไม่ได้"
   ─────────────────────────────────────────────────────────────────────────
   worker คืน `state:'pending'` ทั้งสองเคส (ถูกแล้ว — ทั้งคู่แปลว่า "ยังไม่จบ")
   แต่แนบ `charged:true` มาด้วยเมื่อเงินออกจากบัตรไปแล้วจริง (`paid:true` + `delivered:false`)
   ⇒ เมื่อรู้ว่าเงินออกไปแล้ว **ต้องเปลี่ยนคำพูดทันทีตั้งแต่รอบวนแรก** ไม่ใช่รอครบ 60 วิ
      แล้วขึ้น "ผลยังไม่กลับมา" ซึ่งลูกค้าอ่านว่า "จ่ายไม่ผ่าน" แล้วไปกดจ่ายซ้ำ
   ⚠️ `chargedSeen` เป็นทางเดียว (false → true เท่านั้น) โดยตั้งใจ — ถ้ารอบถัดไปตอบมา
      ไม่ครบ/ล้มเหลว เราต้องไม่ถอนคำพูดที่ว่า "เงินถูกตัดแล้ว" กลับไปเป็น "ยังไม่รู้ผล" */
function pollStatus(ref){
  var box=document.getElementById('resultPanel'); if(!box)return;
  var tries=0, MAX=20, chargedSeen=false; // 20 × 3 วิ = 60 วิ
  var note=document.createElement('p');
  note.style.cssText='font-size:12.5px;color:var(--muted);margin:10px auto 0;max-width:320px';
  note.textContent=B.t('pay_checking');
  var card=box.querySelector('.result'); if(card)card.appendChild(note);
  /* เขียนหัวข้อ/คำอธิบายของการ์ดใหม่ให้ตรงความจริง — ใช้ textContent ล้วน ไม่แตะ innerHTML
     (ค่าที่เอามาเขียนเป็นคำแปลของเราเอง แต่กติกาของหน้านี้คือไม่เปิดทาง XSS เพิ่มแม้แต่ทางเดียว) */
  function sayCharged(){
    if(chargedSeen)return; chargedSeen=true;
    if(card){
      var h=card.querySelector('h2'); if(h)h.textContent=B.t('pay_charged_t');
      var s=card.querySelector('.sub'); if(s)s.textContent=B.t('pay_charged_m');
    }
    note.textContent=B.t('pay_charged_m');
  }
  function giveUpNote(){ note.textContent=B.t(chargedSeen?'pay_slow_paid':'pay_slow'); }
  (function tick(){
    tries++;
    fetch(B.CHARGE_ENDPOINT+'/status?ref='+encodeURIComponent(ref))
      .then(function(r){return r.json();})
      .then(function(j){
        if(j.state==='paid'){location.href='billing.html?lang='+B.LANG+'&result=success';return;}
        /* `charged:true` + `failed` เกิดพร้อมกันไม่ได้ (worker ตอบ failed เฉพาะตอน
           `status==='failed'` ซึ่งแปลว่าไม่มีเงินออก) ⇒ ลำดับนี้ปลอดภัย */
        if(j.state==='failed'){location.href='billing.html?lang='+B.LANG+'&result=failed';return;}
        if(j.charged===true)sayCharged();
        if(tries>=MAX){giveUpNote();return;}
        setTimeout(tick,3000);
      })
      .catch(function(){ if(tries<MAX)setTimeout(tick,3000); else giveUpNote(); });
  })();
}
(function(){
  var res=B.qs('result');
  if(res){
    showResult(res);
    /* `return`  = เพิ่งกลับจากธนาคาร ⇒ ยังไม่รู้ผล ต้องถาม
       `pending` = 🔴 2569-08-02 · **ก็ยังไม่รู้ผลเหมือนกัน** — และเป็นเคสที่ worker ตอบ
                   `pending` เพราะ "เงินเข้าแล้วแต่เขียนสิทธิ์ไม่ลง" ได้ด้วย
                   เดิมเส้นนี้ไม่วนถามเลย ⇒ ลูกค้าค้างอยู่ที่ "รอการยืนยันการชำระ" ตลอดกาล
                   ทั้งที่การถามหนึ่งครั้ง = การลองเปิดสิทธิ์ใหม่หนึ่งครั้งฝั่ง worker
       ที่เหลือ (`success` / `failed`) เป็นผลสรุปแล้ว ไม่ต้องถาม */
    if(res==='return'||res==='pending'){var rf=B.qs('ref'); if(rf)pollStatus(rf);}
    return;
  }
  if(B.IS_STORE){document.getElementById('storeGuard').classList.remove('hide');T('sg-h','billing_title');T('sg-t','store_guard_t');T('sg-m','store_guard_m');document.getElementById('sg-line').innerHTML=B.t('line_btn');return;}
  document.getElementById('checkout').classList.remove('hide');
  T('co-h','billing_title');T('pm-h','pay_method');T('lbl-pick','pick_plan');T('t-mo','monthly');T('t-yr','yearly');T('co-note','secure_note');
  T('k-plan','cr_tab_plan');T('k-credit','cr_tab_credit');
  /* เปิดหน้ามาที่แท็บเครดิตได้ถ้า URL ระบุแพ็กเครดิตมา (เช่นลิงก์จากในแอป) */
  if(B.isCredit(PLAN))setKind('credit');
  var lbl=B.accountLabel();
  document.getElementById('acctLine').textContent=lbl?(B.t('acct_prefix')+lbl+B.t('acct_bind')):B.t('acct_login');
  document.getElementById('t-mo').className=YR?'':'on';document.getElementById('t-yr').className=YR?'on':'';
  /* ปุ่มสลับรายปีคงข้อความเดิม ("รายปี · ประหยัด 2 เดือน") — เจ้าของสั่งไม่ให้แตะ
     การแจ้งว่ายังไม่เปิดไปอยู่ที่การ์ดเหนือรายการแพ็ก + ปุ่มชำระเงินที่กดไม่ได้แทน */
  renderPlanPick();renderSummary();renderPay();
})();
try{var _f=document.getElementById('foot');if(_f)_f.innerHTML=B.footerHtml();}catch(e){}
</script>
