<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Subscribe · IUFIT</title>
<meta name="description" content="Subscribe to an IUFIT trainer plan — choose plan, cycle and pay via Omise">
<link rel="stylesheet" href="billing.css">
</head>
<body>
<div class="wrap">
<div style="display:flex;justify-content:space-between;align-items:center">
  <a class="logo" href="https://iufit.com">IU<span>FIT</span></a>
  <span id="langtog" style="font-size:12px;font-weight:800;color:var(--muted);cursor:pointer"></span>
</div>
<div class="nav"><a id="n-pr" href="pricing.html"></a><a class="on" id="n-bl" href="billing.html"></a><a id="n-mp" href="my-plan.html"></a></div>

<div id="resultPanel" class="hide"></div>

<div id="storeGuard" class="hide">
  <h1 id="sg-h"></h1>
  <div class="bn info"><b id="sg-t"></b><span id="sg-m"></span></div>
  <a class="btn line" id="sg-line" href="https://line.me/R/ti/p/@987qyznd" target="_blank" rel="noopener"></a>
</div>

<div id="checkout" class="hide">
  <h1 id="co-h"></h1>
  <p class="sub" id="acctLine"></p>
  <div class="card" style="margin-bottom:14px">
    <div class="toggle" style="margin-bottom:14px">
      <button id="t-mo" class="on" onclick="setCycle(false)"></button>
      <button id="t-yr" onclick="setCycle(true)"></button>
    </div>
    <label style="font-size:12.5px;font-weight:700;color:var(--navy);display:block;margin-bottom:6px" id="lbl-pick"></label>
    <div id="planPick"></div>
    <div id="summary" style="margin-top:14px"></div>
  </div>
  <div class="card" id="payCard">
    <b style="font-size:15px;color:var(--navy)" id="pm-h"></b>
    <div id="payBody"></div>
  </div>
  <p class="note" id="co-note"></p>
</div>

<div id="foot"></div>
</div>

<script src="billing-common.js"></script>
<script>
var B=window.IUFIT_BILLING;
var YR=(B.qs('cycle')==='yr'), PLAN=B.qs('plan')||'pro', PM='card';
function T(id,k){var el=document.getElementById(id);if(el)el.innerHTML=B.t(k);}
document.getElementById('langtog').textContent=(B.LANG==='en'?'ไทย':'EN');
document.getElementById('langtog').onclick=function(){B.setLang(B.LANG==='en'?'th':'en');};
T('n-pr','nav_pricing');T('n-bl','nav_billing');T('n-mp','nav_myplan');

function setCycle(yr){YR=yr;document.getElementById('t-mo').className=yr?'':'on';document.getElementById('t-yr').className=yr?'on':'';renderPlanPick();renderSummary();renderPay();}
function pickPlan(k){PLAN=k;renderPlanPick();renderSummary();renderPay();}
function renderPlanPick(){
  var el=document.getElementById('planPick'),h='';
  B.PLANS.forEach(function(p){
    if(p.k==='free'||p.contact)return;
    var on=(PLAN===p.k),pr=YR?p.yr:p.mo,un=YR?B.t('per_yr'):B.t('per_mo');
    h+='<button onclick="pickPlan(\''+p.k+'\')" style="width:100%;text-align:left;border:1.5px solid '+(on?'var(--blue)':'var(--line)')+';background:'+(on?'#eef4ff':'#fff')+';border-radius:12px;padding:12px 14px;margin-bottom:8px;cursor:pointer;font-family:inherit;display:flex;justify-content:space-between;align-items:center">'
      +'<span><b style="color:var(--navy);font-size:14.5px">'+p.name+'</b>'+(p.badge?' <span class="badge" style="margin:0;vertical-align:middle">'+B.planBadge(p)+'</span>':'')+'<br><span style="font-size:11.5px;color:var(--muted)">'+p.clients+B.t('clients_unit')+'</span></span>'
      +'<span style="font-weight:850;color:var(--blue);white-space:nowrap">฿'+B.fmt(pr)+'<span style="font-size:11px;color:var(--muted)"> '+un+'</span></span></button>';
  });
  el.innerHTML=h;
}
function renderSummary(){
  var p=B.getPlan(PLAN);if(!p)return;
  var pr=YR?p.yr:p.mo,un=YR?B.t('per_yr'):B.t('per_mo'),was=YR?p.yrWas:p.moWas;
  var h='<div class="sumrow"><span>'+p.name+' '+un+'</span><span>'+(was?'<span style="color:#9aa6bf;text-decoration:line-through;margin-right:6px">฿'+B.fmt(was)+'</span>':'')+'฿'+B.fmt(pr)+'</span></div>';
  if(YR)h+='<div class="sumrow"><span class="psub" style="margin:0">'+B.t('equiv')+'</span><span class="psub" style="margin:0">฿'+B.fmt(Math.round(pr/12))+B.t('per_mo')+'</span></div>';
  h+='<div class="sumrow total"><span>'+B.t('order_total')+'</span><span>฿'+B.fmt(pr)+'</span></div>';
  document.getElementById('summary').innerHTML=h;
}
function renderPay(){
  var body=document.getElementById('payBody');
  var soon=!B.OMISE_READY, amt='฿'+B.fmt(YR?B.getPlan(PLAN).yr:B.getPlan(PLAN).mo), h='';
  if(soon)h+='<div class="bn warn" style="margin:0 0 10px"><b>'+B.t('omise_soon_t')+'</b>'+B.t('omise_soon_m')+'</div>';
  h+='<div class="pm"><button id="pm-card" class="'+(PM==='card'?'on':'')+'" onclick="setPM(\'card\')">'+B.t('pm_card')+'</button><button id="pm-pp" class="'+(PM==='promptpay'?'on':'')+'" onclick="setPM(\'promptpay\')">'+B.t('pm_pp')+'</button></div>';
  h+='<div id="cardForm" class="'+(PM==='card'?'':'hide')+'"><div class="field"><label>'+B.t('card_name')+'</label><input id="card-name" placeholder="'+B.t('card_name_ph')+'"></div><div class="field"><label>'+B.t('card_num')+'</label><input id="card-num" inputmode="numeric" placeholder="0000 0000 0000 0000"></div><div style="display:flex;gap:10px"><div class="field" style="flex:1"><label>'+B.t('card_exp')+'</label><input id="card-exp" placeholder="MM/YY"></div><div class="field" style="flex:1"><label>'+B.t('card_cvv')+'</label><input id="card-cvv" inputmode="numeric" placeholder="123"></div></div></div>';
  h+='<label style="display:flex;gap:9px;align-items:flex-start;margin:12px 0;font-size:12px;line-height:1.5;cursor:pointer;color:var(--navy)"><input type="checkbox" id="agree" onchange="var b=document.getElementById(\'payBtn\');if(b){b.disabled=!this.checked;b.style.opacity=this.checked?1:.5;}" style="margin-top:2px;flex:none"><span>'+B.t('consent_refund')+' — <a class="blue" href="refund.html?lang='+B.LANG+'" target="_blank" rel="noopener">'+B.t('nav_refund')+'</a></span></label>';
  h+='<button id="payBtn" class="btn pri" disabled style="opacity:.5" onclick="payNow()">'+B.t('pay_btn')+' '+amt+'</button>';
  if(soon)h+='<a class="btn line" style="margin-top:8px" href="'+B.LINE_URL+'" target="_blank" rel="noopener">'+B.t('book_line')+'</a><button class="btn ghost" style="margin-top:8px" onclick="reserveLocal()">'+B.t('reserve_local')+'</button>';
  h+='<p class="note" style="margin-top:10px">'+B.t('secure_note')+'</p>';
  body.innerHTML=h;
}
function setPM(m){PM=m;renderPay();}
function reserveLocal(){
  try{localStorage.setItem('iufit_reserve',JSON.stringify({plan:PLAN,cycle:YR?'yr':'mo',ts:Date.now()}));}catch(e){}
  alert(B.getPlan(PLAN).name+' ('+(YR?B.t('per_yr'):B.t('per_mo'))+') ✓');
}
function loadOmise(cb){if(window.Omise){cb();return;}var s=document.createElement('script');s.src='https://cdn.omise.co/omise.js';s.onload=cb;s.onerror=function(){alert('Omise load failed');};document.head.appendChild(s);}
function payNow(){
  var ag=document.getElementById('agree');if(ag&&!ag.checked){alert(B.t('consent_req'));return;}
  if(!B.OMISE_READY){try{window.open(B.LINE_URL,'_blank');}catch(x){}return;}
  loadOmise(function(){
    try{Omise.setPublicKey(B.OMISE_PUBLIC_KEY);}catch(e){}
    var p=B.getPlan(PLAN),amt=(YR?p.yr:p.mo)*100,exp=(document.getElementById('card-exp').value||'').split('/');
    Omise.createToken('card',{name:document.getElementById('card-name').value,number:(document.getElementById('card-num').value||'').replace(/\s/g,''),expiration_month:(exp[0]||'').trim(),expiration_year:('20'+(exp[1]||'').trim()).slice(-4),security_code:document.getElementById('card-cvv').value},function(status,resp){
      if(status!==200){alert(resp.message||'card error');return;}
      fetch(B.CHARGE_ENDPOINT+'/charge',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:resp.id,plan:PLAN,cycle:YR?'yr':'mo',account:B.accountKey()})})
        .then(function(r){return r.json();}).then(function(j){location.href='billing.html?lang='+B.LANG+'&result='+(j.status==='successful'?'success':(j.status==='pending'?'pending':'failed'));})
        .catch(function(){location.href='billing.html?lang='+B.LANG+'&result=failed';});
    });
  });
}
function showResult(kind){
  var el=document.getElementById('resultPanel');el.classList.remove('hide');
  var map={success:{cls:'success',ic:'✓'},pending:{cls:'pending',ic:'⏳'},failed:{cls:'failed',ic:'✕'}}[kind];if(!map)return;
  el.innerHTML='<div class="result '+map.cls+'"><div class="ic">'+map.ic+'</div><h2>'+B.t('res_'+kind+'_t')+'</h2><p class="sub">'+B.t('res_'+kind+'_m')+'</p>'
    +'<a class="btn pri" style="max-width:320px;margin:10px auto 0" href="my-plan.html?lang='+B.LANG+'">'+B.t('go_myplan')+'</a>'
    +(kind==='failed'?'<a class="btn ghost" style="max-width:320px;margin:8px auto 0" href="billing.html?plan='+PLAN+'&cycle='+(YR?'yr':'mo')+'&lang='+B.LANG+'">'+B.t('retry')+'</a>':'')
    +(kind!=='success'?'<a class="btn line" style="max-width:320px;margin:8px auto 0" href="'+B.LINE_URL+'" target="_blank" rel="noopener">'+B.t('line_help')+'</a>':'')+'</div>';
}
(function(){
  var res=B.qs('result');
  if(res){showResult(res);return;}
  if(B.IS_STORE){document.getElementById('storeGuard').classList.remove('hide');T('sg-h','billing_title');T('sg-t','store_guard_t');T('sg-m','store_guard_m');document.getElementById('sg-line').innerHTML=B.t('line_btn');return;}
  document.getElementById('checkout').classList.remove('hide');
  T('co-h','billing_title');T('pm-h','pay_method');T('lbl-pick','pick_plan');T('t-mo','monthly');T('t-yr','yearly');T('co-note','secure_note');
  var lbl=B.accountLabel();
  document.getElementById('acctLine').textContent=lbl?(B.t('acct_prefix')+lbl+B.t('acct_bind')):B.t('acct_login');
  document.getElementById('t-mo').className=YR?'':'on';document.getElementById('t-yr').className=YR?'on':'';
  renderPlanPick();renderSummary();renderPay();
})();
try{var _f=document.getElementById('foot');if(_f)_f.innerHTML=B.footerHtml();}catch(e){}
</script>
</body>
</html>
