name: Deploy IUFIT to GitHub Pages

# ทุกครั้งที่ push โฟลเดอร์ IUFIT-app-deploy → deploy ทั้งโฟลเดอร์อัตโนมัติ (atomic ไม่มีตกไฟล์)
on:
  push:
    branches: [main, master]
    paths:
      - 'IUFIT-app-deploy/**'
  workflow_dispatch:      # กดรันเองได้จากแท็บ Actions

permissions:
  contents: read
  pages: write
  id-token: write

# กัน deploy ชนกัน: คิวล่าสุดชนะ
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload IUFIT-app-deploy (มี CNAME อยู่แล้ว)
        uses: actions/upload-pages-artifact@v3
        with:
          path: IUFIT-app-deploy

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
