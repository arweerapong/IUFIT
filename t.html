<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>โปรไฟล์เทรนเนอร์ · IUFIT</title>
<meta property="og:title" content="โปรไฟล์เทรนเนอร์ · IUFIT">
<meta property="og:description" content="ดูโปรไฟล์เทรนเนอร์และเริ่มเทรนผ่านแอป IUFIT">
<style>
:root{--navy:#071E4A;--blue:#0A84FF;--green:#18b26b;--bg:#F6F9FF;--card:#fff;--line:#DDE7F5;--muted:#6B7890;--ink:#10233F;--line-green:#06c755}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Noto Sans Thai','Sarabun',sans-serif;background:var(--bg);color:var(--ink);line-height:1.6}
.wrap{max-width:520px;margin:0 auto;padding:22px 16px 60px}
.logo{font-style:italic;font-weight:850;font-size:22px;color:#0a1f4d;text-decoration:none;display:block;text-align:center;margin-bottom:14px}
.logo span{color:var(--blue)}
.hero{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:0 12px 34px rgba(7,30,74,.06);padding:26px 22px;text-align:center}
.ava{width:118px;height:118px;border-radius:50%;object-fit:cover;margin:0 auto 12px;display:block;border:4px solid #eaf2ff;background:linear-gradient(135deg,#0A84FF,#065fce)}
.ava-ph{width:118px;height:118px;border-radius:50%;margin:0 auto 12px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#0A84FF,#065fce);color:#fff;font-size:44px;font-weight:850}
.name{font-size:24px;font-weight:850;color:var(--navy);margin:0}
.role{font-size:13px;color:var(--muted);margin:3px 0 0}
.chips{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin:13px 0 0}
.chip{background:#eef4ff;color:#0a5bd0;font-size:12px;font-weight:700;border-radius:999px;padding:5px 13px}
.yrs{display:inline-block;background:#e5f7ee;color:#0f7c48;font-size:12px;font-weight:800;border-radius:999px;padding:5px 13px;margin-top:11px}
.bio{font-size:14px;color:var(--ink);line-height:1.7;margin:15px 2px 0;text-align:left;white-space:pre-wrap}
.btn{display:block;width:100%;text-align:center;text-decoration:none;font-weight:850;border-radius:13px;padding:14px;font-size:15px;margin-top:11px;border:none;cursor:pointer;font-family:inherit}
.btn.pri{background:var(--blue);color:#fff}
.btn.ghost{background:#eef2f7;color:var(--blue)}
.btn.line{background:var(--line-green);color:#fff}
.note{color:var(--muted);font-size:12px;line-height:1.6;margin-top:16px;text-align:center}
.foot{color:var(--muted);font-size:12px;margin-top:20px;text-align:center}
.loading,.err{text-align:center;padding:50px 16px;color:var(--muted)}
a.blue{color:var(--blue);font-weight:700}
.how{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px 18px;margin-top:14px}
.how b{color:var(--navy);font-size:13.5px}
.how ol{margin:7px 0 0;padding-left:20px}
.how li{font-size:12.5px;margin:4px 0;color:var(--ink)}
.meta{margin:15px 0 0;text-align:left;border-top:1px solid var(--line);padding-top:6px}
.mrow{display:flex;gap:8px;padding:7px 0;border-bottom:1px solid #f2f5fa;font-size:13px}
.mrow:last-child{border-bottom:none}
.mk{color:var(--muted);width:84px;flex:none}
.mv{color:var(--ink);flex:1}
.pfwrap{display:flex;gap:8px;overflow-x:auto;margin:14px 0 2px;padding-bottom:3px}
.pf{width:132px;height:164px;object-fit:cover;border-radius:13px;flex:none;border:1px solid var(--line)}
</style>
</head>
<body>
<div class="wrap">
<a class="logo" href="https://iufit.com">IU<span>FIT</span></a>
<div id="app"><div class="loading">กำลังโหลดโปรไฟล์…</div></div>
<p class="foot">© 2026 IUFIT · <a class="blue" href="https://iufit.com">iufit.com</a></p>
</div>
<script>
var FB='https://iufit-9dea7-default-rtdb.asia-southeast1.firebasedatabase.app';
function qs(n){var m=new RegExp('[?&]'+n+'=([^&]+)').exec(location.search);return m?decodeURIComponent(m[1]):'';}
function esc(s){return (''+(s||'')).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
var code=(qs('c')||'').toUpperCase().replace(/[^A-Z0-9\-]/g,'');
var app=document.getElementById('app');
function arr(v){ return Object.prototype.toString.call(v)==='[object Array]'?v:[]; }
function render(d){
  var name=d.nm||d.from||'เทรนเนอร์';
  var joinURL='https://iufit.com?join='+encodeURIComponent(code);
  var ava=d.ph?('<img class="ava" src="'+esc(d.ph)+'" alt="">'):('<div class="ava-ph">'+esc((name||'?').slice(0,1))+'</div>');
  var specs=arr(d.specs).length?arr(d.specs):(d.ex||'').split(/[,\/·]/).map(function(x){return x.trim();}).filter(Boolean);
  var chips=specs.map(function(x){return '<span class="chip">'+esc(x)+'</span>';}).join('');
  // แถวรายละเอียด (marketplace) — แสดงเฉพาะที่มีข้อมูล
  var meta='';
  if(arr(d.prov).length) meta+='<div class="mrow"><span class="mk">📍 พื้นที่</span><span class="mv">'+esc(arr(d.prov).join(', '))+'</span></div>';
  if(arr(d.fmt).length)  meta+='<div class="mrow"><span class="mk">🏃 รูปแบบ</span><span class="mv">'+esc(arr(d.fmt).join(', '))+'</span></div>';
  if(d.certs)            meta+='<div class="mrow"><span class="mk">🎓 ใบเซอร์</span><span class="mv">'+esc(d.certs)+'</span></div>';
  if(+d.price>0)         meta+='<div class="mrow"><span class="mk">💰 ราคา</span><span class="mv" style="font-weight:800;color:var(--navy)">฿'+esc(+d.price)+' / ครั้ง</span></div>';
  // ผลงาน (result cards / before-after)
  var port=arr(d.portfolio).map(function(p){var s=(p&&p.img)||p;return s?'<img class="pf" src="'+esc(s)+'" alt="">':'';}).join('');
  var h=''
   +'<div class="hero">'
   + ava
   +'<h1 class="name">'+esc(name)+'</h1>'
   +'<div class="role">เทรนเนอร์ / โค้ชออนไลน์ บน IUFIT</div>'
   +(chips?('<div class="chips">'+chips+'</div>'):'')
   +(d.yr?('<div class="yrs">ประสบการณ์ '+esc(d.yr)+' ปี</div>'):'')
   +(d.bio?('<div class="bio">'+esc(d.bio)+'</div>'):'')
   +(meta?('<div class="meta">'+meta+'</div>'):'')
   +(port?('<div class="pfwrap">'+port+'</div>'):'')
   +'<a class="btn pri" href="'+joinURL+'">เริ่มเทรนกับโค้ชนี้</a>'
   +(d.ct?('<a class="btn line" href="'+ctURL(d.ct)+'" target="_blank" rel="noopener">ติดต่อโค้ช · '+esc(d.ct)+'</a>'):'')
   +'<a class="btn ghost" href="https://iufit.com">เปิด / ดาวน์โหลดแอป IUFIT</a>'
   // ── FUTURE (Phase 2): ส่วนจอง+ชำระเงินบนเว็บใส่ตรงนี้ได้เลย (Omise QR / booking) ──
   // +'<a class="btn pri" href="/book.html?c='+code+'">จองคอร์ส & ชำระเงิน</a>'
   +'</div>'
   +'<div class="how"><b>เริ่มยังไง</b><ol>'
   +'<li>กด “เริ่มเทรนกับโค้ชนี้” — เปิดแอป IUFIT</li>'
   +'<li>ยืนยันเข้าร่วมเป็นลูกเทรน (ใช้ฟรี)</li>'
   +'<li>รับตารางอาหาร/ฝึก และส่งการบ้านให้โค้ชได้เลย</li>'
   +'</ol></div>';
  app.innerHTML=h;
  try{document.title=name+' · IUFIT';}catch(e){}
}
function ctURL(c){c=(''+c).trim();if(/^https?:\/\//i.test(c))return c;if(/^@?[\w.\-]+$/.test(c)&&/^@/.test(c))return 'https://line.me/R/ti/p/'+encodeURIComponent(c);if(/^0\d{8,9}$/.test(c))return 'tel:'+c;return 'https://iufit.com';}
if(!code){app.innerHTML='<div class="err">ลิงก์ไม่ถูกต้อง<br><a class="blue" href="https://iufit.com">ไปหน้าแรก IUFIT</a></div>';}
else{
  fetch(FB+'/pub/coach/'+code+'.json').then(function(r){return r.json();}).then(function(d){
    if(!d||typeof d!=='object'){app.innerHTML='<div class="err">ไม่พบโปรไฟล์นี้ หรือโค้ชยังไม่ได้เปิดหน้าสาธารณะ<br><br><a class="blue" href="https://iufit.com">ไปหน้าแรก IUFIT</a></div>';return;}
    render(d);
  }).catch(function(){app.innerHTML='<div class="err">โหลดโปรไฟล์ไม่สำเร็จ ลองใหม่อีกครั้ง</div>';});
}
</script>
</body>
</html>
