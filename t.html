<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>โปรไฟล์เทรนเนอร์ · IUFIT</title>
<meta property="og:title" content="โปรไฟล์เทรนเนอร์ · IUFIT">
<meta property="og:description" content="ดูโปรไฟล์เทรนเนอร์และเริ่มเทรนผ่านแอป IUFIT">
<style>
:root{--navy:#12305f;--blue:#0A84FF;--blue2:#065fce;--green:#12A868;--warn:#E8940E;--bg:#EAF2FF;--card:#fff;--line:#DDE7F5;--muted:#6B7890;--ink:#10233F;--line-green:#06c755;--soft:#eef4ff}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Noto Sans Thai','Sarabun',sans-serif;background:var(--bg);color:var(--ink);line-height:1.6}
.wrap{max-width:520px;margin:0 auto;padding:20px 15px 60px}
.logo{font-style:italic;font-weight:850;font-size:22px;color:#0a1f4d;text-decoration:none;display:block;text-align:center;margin-bottom:14px}
.logo span{color:var(--blue)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:0 10px 30px rgba(7,30,74,.05);padding:18px 18px;margin-top:13px}
.hero{text-align:center;padding:24px 20px}
.ava,.ava-ph{width:104px;height:104px;border-radius:26px;margin:0 auto 13px;display:block}
.ava{object-fit:cover;border:1px solid var(--line)}
.ava-ph{display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;font-size:40px;font-weight:850}
.name{font-size:23px;font-weight:850;color:var(--navy);margin:0}
.role{font-size:12.5px;color:var(--muted);margin:4px 0 0}
.rating{font-size:13px;color:var(--green);font-weight:700;margin-top:8px;display:flex;align-items:center;justify-content:center;gap:5px}
.rating .rc{color:var(--muted);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin:13px 0 0}
.chip{background:var(--soft);color:#0a5bd0;font-size:12px;font-weight:700;border-radius:999px;padding:5px 13px}
.yrs{display:inline-block;background:#e5f7ee;color:var(--green);font-size:11.5px;font-weight:800;border-radius:999px;padding:5px 13px;margin-top:11px}
.sect{font-size:12.5px;font-weight:800;color:var(--navy);margin:0 0 6px;display:flex;align-items:center;gap:6px}
.bio{font-size:13.5px;color:var(--ink);line-height:1.7;white-space:pre-wrap}
.mrow{display:flex;gap:9px;padding:9px 0;border-bottom:1px solid #f2f5fa;font-size:13px;align-items:flex-start}
.mrow:last-child{border-bottom:none}
.mk{color:var(--muted);width:96px;flex:none;display:flex;align-items:center;gap:6px}
.mv{color:var(--ink);flex:1;font-weight:600}
.mv.price{font-weight:800;color:var(--navy)}
.pfwrap{display:flex;gap:9px;overflow-x:auto;margin:11px 0 0;padding-bottom:3px}
.pf{width:132px;height:164px;object-fit:cover;border-radius:14px;flex:none;border:1px solid var(--line)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;text-align:center;text-decoration:none;font-weight:850;border-radius:14px;padding:14px;font-size:15px;margin-top:10px;border:none;cursor:pointer;font-family:inherit}
.btn.pri{background:var(--blue);color:#fff;box-shadow:0 10px 22px rgba(10,132,255,.28)}
.btn.ghost{background:var(--soft);color:var(--blue)}
.btn.line{background:var(--line-green);color:#fff}
.how ol{margin:8px 0 0;padding-left:20px}
.how li{font-size:12.5px;margin:5px 0;color:var(--ink)}
.foot{color:var(--muted);font-size:12px;margin-top:22px;text-align:center}
.loading,.err{text-align:center;padding:52px 16px;color:var(--muted)}
a.blue{color:var(--blue);font-weight:700}
svg{flex:none}
</style>
</head>
<body>
<div class="wrap">
<a class="logo" href="https://iufit.com">IU<span>FIT</span></a>
<div id="app"><div class="loading">กำลังโหลดโปรไฟล์…</div></div>
<p class="foot">© 2026 IUFIT · <a class="blue" href="https://iufit.com">iufit.com</a></p>
</div>
<script>
var FB='https://iufit-9dea7-default-rtdb.asia-southeast1.firebasedatabase.app';
function qs(n){var m=new RegExp('[?&]'+n+'=([^&]+)').exec(location.search);return m?decodeURIComponent(m[1]):'';}
function esc(s){return (''+(s||'')).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
var code=(qs('c')||'').toUpperCase().replace(/[^A-Z0-9\-]/g,'');
var app=document.getElementById('app');
function arr(v){ return Object.prototype.toString.call(v)==='[object Array]'?v:[]; }
var IC={
 star:'<svg width="14" height="14" viewBox="0 0 24 24" fill="#E8940E"><path d="M12 2l2.9 6.3 6.9.7-5.1 4.6 1.4 6.8L12 17.8 5.9 20.4l1.4-6.8L2.2 9l6.9-.7z"/></svg>',
 pin:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#6B7890" stroke-width="2"><path d="M12 21s7-6.2 7-11a7 7 0 10-14 0c0 4.8 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>',
 run:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#6B7890" stroke-width="2" stroke-linecap="round"><circle cx="13" cy="5" r="2"/><path d="M5 20l3-5 3 2 2-4 3 3h3"/></svg>',
 cert:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#6B7890" stroke-width="2" stroke-linejoin="round"><circle cx="12" cy="9" r="5"/><path d="M9 13l-2 8 5-3 5 3-2-8"/></svg>',
 coin:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#6B7890" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v10M9.5 9.5h4a1.6 1.6 0 010 3.2h-3a1.6 1.6 0 000 3.2H15" stroke-linecap="round"/></svg>',
 about:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#0A84FF" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01" stroke-linecap="round"/></svg>',
 list:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#0A84FF" stroke-width="2" stroke-linecap="round"><path d="M8 6h12M8 12h12M8 18h12M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg>',
 rocket:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#0A84FF" stroke-width="2" stroke-linejoin="round"><path d="M5 15c-1.5 1.5-2 5-2 5s3.5-.5 5-2M9 11a9 9 0 019-9c0 6-3 9-9 12l-3-3z"/><circle cx="15" cy="9" r="1.4"/></svg>',
 send:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4z"/></svg>',
 chat:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"><path d="M21 12a8 8 0 01-11.5 7.2L3 21l1.8-6.5A8 8 0 1121 12z"/></svg>',
 dl:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#0A84FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 19h16"/></svg>'
};
function render(d){
  var name=d.nm||d.from||'เทรนเนอร์';
  var joinURL='https://iufit.com?join='+encodeURIComponent(code);
  var ava=d.ph?('<img class="ava" src="'+esc(d.ph)+'" alt="">'):('<div class="ava-ph">'+esc((name||'?').slice(0,1))+'</div>');
  var specs=arr(d.specs).length?arr(d.specs):(d.ex||'').split(/[,\/·]/).map(function(x){return x.trim();}).filter(Boolean);
  var chips=specs.map(function(x){return '<span class="chip">'+esc(x)+'</span>';}).join('');
  var subtitle=specs.length?specs.join(' · '):(d.ex||'เทรนเนอร์ / โค้ชออนไลน์');
  // rating (reviews) — computed live from review nodes (stored rating/rc are owner-only under Phase C)
  try{var _rv=d.reviews||{},_s=0,_n=0;for(var _k in _rv){var _v=_rv[_k];if(_v&&+_v.r){_s+=+_v.r;_n++;}}d.rating=_n?Math.round(_s/_n*10)/10:0;d.rc=_n;}catch(_e){}
  var rating=(+d.rc>0)?('<div class="rating">'+IC.star+' '+esc(d.rating||'-')+' <span class="rc">('+esc(d.rc)+' รีวิว)</span></div>'):'';
  // detail rows
  var meta='';
  if(arr(d.prov).length) meta+='<div class="mrow"><span class="mk">'+IC.pin+'พื้นที่</span><span class="mv">'+esc(arr(d.prov).join(', '))+'</span></div>';
  if(arr(d.fmt).length)  meta+='<div class="mrow"><span class="mk">'+IC.run+'รูปแบบ</span><span class="mv">'+esc(arr(d.fmt).join(', '))+'</span></div>';
  if(d.certs)            meta+='<div class="mrow"><span class="mk">'+IC.cert+'ใบเซอร์</span><span class="mv">'+esc(d.certs)+'</span></div>';
  if(+d.price>0)         meta+='<div class="mrow"><span class="mk">'+IC.coin+'ราคา</span><span class="mv price">฿'+esc(+d.price)+' / ครั้ง</span></div>';
  var port=arr(d.portfolio).map(function(p){var s=(p&&p.img)||p;return s?'<img class="pf" src="'+esc(s)+'" alt="">':'';}).join('');
  function csStars(n){n=n||5;var s='';for(var i=0;i<5;i++)s+=(i<n?'★':'☆');return s;}
  var CATTH={fat_loss:'ลดไขมัน',muscle_gain:'สร้างกล้าม',recomp:'ปรับสัดส่วน',general:'สุขภาพทั่วไป'};
  var CATBG={fat_loss:['#fbe7de','#993c1d'],muscle_gain:['#e1f0e6','#0f6e56'],recomp:['#e6f1fb','#0c447c'],general:['#f1efe8','#444441']};
  var csm=d.cases||{};var cids=Object.keys(csm).sort(function(a,b){return (csm[b].publishedAt||0)-(csm[a].publishedAt||0);});
  var cases=cids.length?('<div class="card"><div class="sect">'+IC.list+'เคสผลงาน</div>'+cids.map(function(id){var c=csm[id];var cb=CATBG[c.category]||CATBG.general;
    var tiles=arr(c.metrics).map(function(m){var g=(m.key==='fat'||m.key==='waist')?(m.change<0):(c.category==='muscle_gain'?(m.change>0):(m.key==='weight'?m.change<0:m.change>0));return '<div style="flex:1;background:'+(g?'#eaf6f0':'#f4f8fe')+';border-radius:10px;padding:8px 6px;text-align:center"><div style="font-size:9.5px;color:'+(g?'#5a8a76':'#7a8aa6')+'">'+esc(m.label)+'</div><div style="font-size:16px;font-weight:800;color:'+(g?'#0f6e56':'#002766')+'">'+(m.change>0?'+':'')+esc(m.change)+'<span style="font-size:9px;font-weight:400"> '+esc(m.unit)+'</span></div><div style="font-size:8.5px;color:#9aa7bf">'+esc(m.before)+' → '+esc(m.after)+'</div></div>';}).join('');
    var adh=(c.adherence!=null&&c.adherence!=='')?('<div style="font-size:11px;color:#3a4660;margin-top:9px">ทำตามแผน <b style="color:#12A868">'+esc(c.adherence)+'%</b> · สตรีค '+esc(c.streak||0)+' วัน</div>'):'';
    var rev=(c.review&&c.review.t)?('<div style="margin-top:10px;background:#f7faff;border-left:2.5px solid #0a84ff;border-radius:0 10px 10px 0;padding:9px 11px"><div style="font-size:11.5px;color:#26354f;font-style:italic">“'+esc(c.review.t)+'”</div><div style="font-size:9.5px;color:#f5b301;margin-top:4px">'+csStars(c.review.stars)+' <span style="color:#9aa7bf">— ลูกเทรน (ยินยอมให้แสดง)</span></div></div>'):'';
    return '<div style="border:1px solid #e6edf6;border-radius:14px;padding:13px;margin-top:10px"><div style="display:flex;justify-content:space-between;align-items:center"><span style="font-size:11px;font-weight:700;background:'+cb[0]+';color:'+cb[1]+';border-radius:99px;padding:3px 10px">'+esc(CATTH[c.category]||'')+'</span><span style="font-size:10px;color:#12A868;font-weight:700">✓ ข้อมูลจาก IUFIT</span></div><div style="font-size:15px;font-weight:800;color:#002766;margin-top:8px">'+esc(c.title)+'</div><div style="font-size:11px;color:#7a8aa6;margin-top:2px">'+esc(c.durationWeeks)+' สัปดาห์</div><div style="display:flex;gap:7px;margin-top:11px">'+tiles+'</div>'+adh+rev+'<div style="font-size:9px;color:#9aa7bf;margin-top:9px">ผลลัพธ์เฉพาะบุคคล ไม่ใช่การรับประกันว่าผู้อื่นจะได้ผลเหมือนกัน</div></div>';
  }).join('')+'</div>'):'';
  var h=''
   +'<div class="card hero">'+ava
     +'<h1 class="name">'+esc(name)+'</h1>'
     +'<div class="role">'+esc(subtitle)+'</div>'
     +rating
     +(chips?('<div class="chips">'+chips+'</div>'):'')
     +(d.yr?('<div class="yrs">ประสบการณ์ '+esc(d.yr)+' ปี</div>'):'')
   +'</div>'
   +(d.bio?('<div class="card"><div class="sect">'+IC.about+'แนะนำตัว</div><div class="bio">'+esc(d.bio)+'</div></div>'):'')
   +(meta?('<div class="card"><div class="sect">'+IC.list+'รายละเอียด</div>'+meta+'</div>'):'')
   +(port?('<div class="card"><div class="sect">'+IC.list+'ผลงาน</div><div class="pfwrap">'+port+'</div></div>'):'')
   +cases
   +'<a class="btn pri" href="'+joinURL+'">'+IC.send+'เริ่มเทรนกับโค้ชนี้</a>'
   +(d.ct?('<a class="btn line" href="'+ctURL(d.ct)+'" target="_blank" rel="noopener">'+IC.chat+'ติดต่อโค้ช · '+esc(d.ct)+'</a>'):'')
   +'<a class="btn ghost" href="https://iufit.com">'+IC.dl+'เปิด / ดาวน์โหลดแอป IUFIT</a>'
   +'<div class="card how"><div class="sect">'+IC.rocket+'เริ่มยังไง</div><ol>'
   +'<li>กด “เริ่มเทรนกับโค้ชนี้” — เปิดแอป IUFIT</li>'
   +'<li>ยืนยันเข้าร่วมเป็นลูกเทรน (ใช้ฟรี)</li>'
   +'<li>รับตารางอาหาร/ฝึก และส่งการบ้านให้โค้ชได้เลย</li>'
   +'</ol></div>';
  app.innerHTML=h;
  try{document.title=name+' · IUFIT';}catch(e){}
}
function ctURL(c){c=(''+c).trim();if(/^https?:\/\//i.test(c))return c;if(/^@?[\w.\-]+$/.test(c)&&/^@/.test(c))return 'https://line.me/R/ti/p/'+encodeURIComponent(c);if(/^0\d{8,9}$/.test(c))return 'tel:'+c;return 'https://iufit.com';}
if(!code){app.innerHTML='<div class="err">ลิงก์ไม่ถูกต้อง<br><a class="blue" href="https://iufit.com">ไปหน้าแรก IUFIT</a></div>';}
else{
  fetch(FB+'/pub/coach/'+code+'.json').then(function(r){return r.json();}).then(function(d){
    if(!d||typeof d!=='object'){app.innerHTML='<div class="err">ไม่พบโปรไฟล์นี้ หรือโค้ชยังไม่ได้เปิดหน้าสาธารณะ<br><br><a class="blue" href="https://iufit.com">ไปหน้าแรก IUFIT</a></div>';return;}
    render(d);
  }).catch(function(){app.innerHTML='<div class="err">โหลดโปรไฟล์ไม่สำเร็จ ลองใหม่อีกครั้ง</div>';});
}
</script>
</body>
</html>
