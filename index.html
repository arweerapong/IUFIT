<style>
:root{
  --bg:#eaf6fa; --ink:#15394a; --ink2:#5e7f90;
  --coral:#0e9bc7; --coral2:#d6effa;
  --mint:#13b5a2; --mint2:#d7f4ef;
  --sun:#f5a623; --sun2:#fdf0d5;
  --berry:#5b7fd6; --berry2:#e3eafc;
  --red:#e35d5d; --card:#ffffff;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Kanit','Segoe UI',sans-serif;font-size:15px;line-height:1.45}
.app{max-width:520px;margin:0 auto;padding:0 12px 92px}
header{position:sticky;top:0;z-index:20;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 2px 6px;display:flex;align-items:center;gap:10px;border-bottom:2px solid #dcecf4}
header .logo{width:44px;height:44px;flex:none}
header h1{font-size:19px;margin:0;flex:1;line-height:1.2}
header h1 small{display:block;font-size:11px;color:var(--ink2);font-weight:400}
.iconbtn{background:var(--card);border:1.5px solid #b9d8e6;border-radius:12px;width:40px;height:40px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink)}
.iconbtn svg{width:21px;height:21px}
.chip{display:inline-flex;align-items:center;gap:5px;background:#e3f2f9;border:1px solid #b9d8e6;border-radius:999px;padding:3px 11px;font-size:13px;cursor:pointer}
.chip.sel{background:var(--coral);color:#fff}
.chip.warn{background:#fde3e3;border-color:var(--red);color:var(--red)}
.card{background:var(--card);border:1.5px solid #b9d8e6;border-radius:14px;padding:13px 14px;margin:11px 0;box-shadow:0 4px 12px rgba(20,80,110,.13)}
.card.flat{box-shadow:none}
.card h3{margin:0 0 8px;font-size:16px;display:flex;align-items:center;gap:7px}
.card h3 svg{width:20px;height:20px;flex:none}
.btn{font-family:inherit;font-size:14px;font-weight:600;background:var(--card);color:var(--ink);border:1.5px solid #b9d8e6;border-radius:12px;padding:8px 15px;cursor:pointer;box-shadow:0 2px 6px rgba(20,80,110,.12)}
.btn:active{transform:translate(2px,2px);box-shadow:none}
.btn.pri{background:var(--coral);color:#fff}
.btn.mint{background:var(--mint);color:#fff}
.btn.sun{background:var(--sun);color:#1c1405}
.btn.sm{font-size:12.5px;padding:5px 11px}
.btn.ghost{box-shadow:none;border-style:dashed;background:transparent}
.btn:disabled{opacity:.45;pointer-events:none}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}
.muted{color:var(--ink2);font-size:12.5px}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--ink);background:#ffffff;border:1.5px solid #b9d8e6;border-radius:10px;padding:8px 10px;width:100%;outline:none}
textarea{resize:vertical;min-height:60px}
label.fl{display:block;font-size:12.5px;font-weight:600;margin:9px 0 4px;color:var(--ink2)}
/* bottom nav */
nav{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--card);border-top:2px solid var(--ink);display:flex;max-width:520px;margin:0 auto;border-radius:18px 18px 0 0;box-shadow:0 -4px 14px rgba(20,80,110,.16)}
nav button{flex:1;background:none;border:none;font-family:inherit;font-size:10.5px;color:var(--ink2);padding:8px 2px 9px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button svg{width:23px;height:23px}
nav button.on{color:var(--coral);font-weight:700}
nav button.on svg{stroke-width:2.4}
/* meal log */
.mealhead{display:flex;align-items:center;gap:8px;margin:14px 2px 4px}
.mealhead .t{font-weight:700;font-size:15px}
.logitem{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1.5px solid #dcecf4}
.logitem:last-child{border-bottom:none}
.logitem .ic{width:38px;height:38px;flex:none;background:#e3f2f9;border:1px solid #b9d8e6;border-radius:10px;display:flex;align-items:center;justify-content:center}
.logitem .ic svg{width:22px;height:22px}
.bar{height:13px;background:#ddeef6;border:1px solid #b9d8e6;border-radius:8px;overflow:hidden;position:relative}
.bar i{display:block;height:100%;background:var(--mint);border-radius:0 6px 6px 0;transition:width .4s}
.bar.over i{background:var(--sun)}
.nutrow{display:flex;align-items:center;gap:8px;margin:7px 0;font-size:12.5px}
.nutrow .nm{width:74px;flex:none;font-weight:600}
.nutrow .bar{flex:1}
.nutrow .vv{width:96px;flex:none;text-align:right;color:var(--ink2);font-size:11.5px}
/* recipe cards */
.rcard{display:flex;gap:11px;align-items:center;cursor:pointer}
.rcard .ric{width:52px;height:52px;flex:none;background:var(--mint2);border:1.5px solid #b9d8e6;border-radius:12px;display:flex;align-items:center;justify-content:center}
.rcard .ric svg{width:32px;height:32px}
.rcard .nm{font-weight:700;font-size:14.5px}
.tag{display:inline-block;font-size:10.5px;background:var(--berry2);border:1px solid #b9d8e6;border-radius:6px;padding:1px 7px;margin:2px 3px 0 0}
.tag.age{background:var(--sun2)}
.tag.al{background:#fde3e3;color:var(--red);border-color:var(--red)}
/* modal */
.mwrap{position:fixed;inset:0;background:rgba(21,57,74,.45);z-index:50;display:none;align-items:flex-end;justify-content:center}
.mwrap.show{display:flex}
.modal{background:var(--bg);width:100%;max-width:520px;max-height:88vh;overflow-y:auto;border-radius:26px 26px 0 0;border:1.5px solid #b9d8e6;border-bottom:none;padding:16px 16px 28px;animation:up .22s ease;position:relative}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.modal h2{font-size:18px;margin:2px 36px 10px 2px}
.mclose{position:absolute;top:12px;right:14px;width:34px;height:34px;border-radius:50%;border:1.5px solid #b9d8e6;background:#ffffff;font-size:16px;color:var(--ink);cursor:pointer;font-family:inherit;z-index:2}
/* tables */
table.nut{width:100%;border-collapse:collapse;font-size:12.5px}
table.nut td{padding:3px 4px;border-bottom:1px solid #dcecf4}
table.nut td:last-child{text-align:right;font-weight:600}
.steps{padding-left:0;list-style:none;counter-reset:s}
.steps li{counter-increment:s;display:flex;gap:9px;margin:8px 0;font-size:13.5px}
.steps li::before{content:counter(s);flex:none;width:22px;height:22px;background:var(--coral);color:#fff;border:1px solid #b9d8e6;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.inglist{font-size:13.5px}
.inglist .it{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid #dcecf4}
/* plan */
.pday{margin:10px 0}
.pday .dt{font-weight:700;font-size:13.5px;margin-bottom:4px}
.pslot{display:flex;gap:6px;flex-wrap:wrap}
.pslot .ps{flex:1;min-width:45%;background:#ffffff;border:1.7px dashed var(--ink2);border-radius:10px;padding:6px 8px;font-size:12px;cursor:pointer;min-height:44px}
.pslot .ps.has{border-style:solid;border-color:var(--ink);background:var(--mint2)}
.pslot .ps b{display:block;font-size:11px;color:var(--ink2);font-weight:600}
/* stats */
.mchart{display:flex;align-items:flex-end;gap:2px;height:90px;padding:4px 2px;border-bottom:2px solid var(--ink)}
.mchart i{flex:1;background:var(--coral);border-radius:4px 4px 0 0;min-height:2px;opacity:.85}
.mchart i.lo{background:var(--sun)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kpi{background:#e3f2f9;border:1px solid #b9d8e6;border-radius:12px;padding:8px 10px;text-align:center}
.kpi b{font-size:19px;display:block}
.kpi span{font-size:11px;color:var(--ink2)}
/* trial */
.trow{display:flex;align-items:center;gap:9px;padding:8px 0;border-bottom:1.5px solid #dcecf4}
.trow:last-child{border-bottom:none}
.dot{width:12px;height:12px;border-radius:50%;border:1px solid #b9d8e6;flex:none}
.dot.try{background:var(--sun)} .dot.pass{background:var(--mint)} .dot.fail{background:var(--red)}
.empty{text-align:center;color:var(--ink2);padding:22px 8px;font-size:13.5px}
.empty svg{width:54px;height:54px;opacity:.5;display:block;margin:0 auto 8px}
.seg{display:flex;gap:0;border:1.5px solid #b9d8e6;border-radius:14px;overflow:hidden;background:#ffffff}
.seg button{flex:1;border:none;background:none;font-family:inherit;font-size:12.5px;padding:7px 4px;cursor:pointer;color:var(--ink2)}
.seg button.on{background:var(--coral);color:#fff;font-weight:700}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;background:#15394a;color:#fff;padding:9px 18px;border-radius:16px;font-size:13.5px;z-index:99;opacity:0;transition:opacity .25s;pointer-events:none;max-width:88%;text-align:center}
.toast.show{opacity:1}
.ingrow{display:flex;gap:6px;margin:5px 0;align-items:center}
.ingrow select{flex:1}
.ingrow input{width:72px;flex:none}
.ingrow .x{flex:none;width:30px;height:30px;border-radius:50%;border:1.8px solid var(--red);background:#ffffff;color:var(--red);cursor:pointer;font-family:inherit}
.warnbox{background:#fde3e3;border:2px solid var(--red);border-radius:10px;padding:8px 12px;color:var(--red);font-size:13px;margin:8px 0}
.okbox{background:var(--mint2);border:2px solid var(--mint);border-radius:10px;padding:8px 12px;font-size:13px;margin:8px 0}
h4.sec{margin:16px 2px 6px;font-size:14px;color:var(--ink2)}
</style>
