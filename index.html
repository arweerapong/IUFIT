<html lang="th">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<title>IUFIT 💪</title>

<style>
:root{
  --bg:#0e1422; --ink:#e8edf5; --ink2:#8b97ab;
  --coral:#4f8cff; --coral2:#1c2a47;
  --mint:#2dd4bf; --mint2:#11302f;
  --sun:#f5a623; --sun2:#33270f;
  --berry:#818cf8; --berry2:#232a4a;
  --red:#f06262; --card:#161f30;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Kanit','Segoe UI',sans-serif;font-size:15px;line-height:1.45}
.app{max-width:520px;margin:0 auto;padding:0 12px 92px}
header{position:sticky;top:0;z-index:20;background:var(--bg);padding:10px 2px 6px;display:flex;align-items:center;gap:10px;border-bottom:2px solid #223047}
header .logo{width:44px;height:44px;flex:none}
header h1{font-size:19px;margin:0;flex:1;line-height:1.2}
header h1 small{display:block;font-size:11px;color:var(--ink2);font-weight:400}
.iconbtn{background:var(--card);border:1.5px solid #2c3a52;border-radius:12px;width:40px;height:40px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink)}
.iconbtn svg{width:21px;height:21px}
.chip{display:inline-flex;align-items:center;gap:5px;background:#1a2336;border:1px solid #2c3a52;border-radius:999px;padding:3px 11px;font-size:13px;cursor:pointer}
.chip.sel{background:var(--coral);color:#fff}
.chip.warn{background:#3a1b22;border-color:var(--red);color:var(--red)}
.card{background:var(--card);border:1.5px solid #2c3a52;border-radius:14px;padding:13px 14px;margin:11px 0;box-shadow:0 4px 14px rgba(0,0,0,.35)}
.card.flat{box-shadow:none}
.card h3{margin:0 0 8px;font-size:16px;display:flex;align-items:center;gap:7px}
.card h3 svg{width:20px;height:20px;flex:none}
.btn{font-family:inherit;font-size:14px;font-weight:600;background:var(--card);color:var(--ink);border:1.5px solid #2c3a52;border-radius:12px;padding:8px 15px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.btn:active{transform:translate(2px,2px);box-shadow:none}
.btn.pri{background:var(--coral);color:#fff}
.btn.mint{background:var(--mint);color:#fff}
.btn.sun{background:var(--sun);color:#1c1405}
.btn.sm{font-size:12.5px;padding:5px 11px}
.btn.ghost{box-shadow:none;border-style:dashed;background:transparent}
.btn:disabled{opacity:.45;pointer-events:none}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}
.muted{color:var(--ink2);font-size:12.5px}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--ink);background:#101827;border:1.5px solid #2c3a52;border-radius:10px;padding:8px 10px;width:100%;outline:none}
textarea{resize:vertical;min-height:60px}
label.fl{display:block;font-size:12.5px;font-weight:600;margin:9px 0 4px;color:var(--ink2)}
/* bottom nav */
nav{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--card);border-top:2px solid var(--ink);display:flex;max-width:520px;margin:0 auto;border-radius:18px 18px 0 0;box-shadow:0 -4px 16px rgba(0,0,0,.45)}
nav button{flex:1;background:none;border:none;font-family:inherit;font-size:10.5px;color:var(--ink2);padding:8px 2px 9px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button svg{width:23px;height:23px}
nav button.on{color:var(--coral);font-weight:700}
nav button.on svg{stroke-width:2.4}
/* meal log */
.mealhead{display:flex;align-items:center;gap:8px;margin:14px 2px 4px}
.mealhead .t{font-weight:700;font-size:15px}
.logitem{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1.5px solid #223047}
.logitem:last-child{border-bottom:none}
.logitem .ic{width:38px;height:38px;flex:none;background:#1a2336;border:1px solid #2c3a52;border-radius:10px;display:flex;align-items:center;justify-content:center}
.logitem .ic svg{width:22px;height:22px}
.bar{height:13px;background:#0d1320;border:1px solid #2c3a52;border-radius:8px;overflow:hidden;position:relative}
.bar i{display:block;height:100%;background:var(--mint);border-radius:0 6px 6px 0;transition:width .4s}
.bar.over i{background:var(--sun)}
.nutrow{display:flex;align-items:center;gap:8px;margin:7px 0;font-size:12.5px}
.nutrow .nm{width:74px;flex:none;font-weight:600}
.nutrow .bar{flex:1}
.nutrow .vv{width:96px;flex:none;text-align:right;color:var(--ink2);font-size:11.5px}
/* recipe cards */
.rcard{display:flex;gap:11px;align-items:center;cursor:pointer}
.rcard .ric{width:52px;height:52px;flex:none;background:var(--mint2);border:1.5px solid #2c3a52;border-radius:12px;display:flex;align-items:center;justify-content:center}
.rcard .ric svg{width:32px;height:32px}
.rcard .nm{font-weight:700;font-size:14.5px}
.tag{display:inline-block;font-size:10.5px;background:var(--berry2);border:1px solid #324158;border-radius:6px;padding:1px 7px;margin:2px 3px 0 0}
.tag.age{background:var(--sun2)}
.tag.al{background:#3a1b22;color:var(--red);border-color:var(--red)}
/* modal */
.mwrap{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:none;align-items:flex-end;justify-content:center}
.mwrap.show{display:flex}
.modal{background:var(--bg);width:100%;max-width:520px;max-height:88vh;overflow-y:auto;border-radius:26px 26px 0 0;border:1.5px solid #2c3a52;border-bottom:none;padding:16px 16px 28px;animation:up .22s ease;position:relative}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.modal h2{font-size:18px;margin:2px 36px 10px 2px}
.mclose{position:absolute;top:12px;right:14px;width:34px;height:34px;border-radius:50%;border:1.5px solid #2c3a52;background:#101827;font-size:16px;color:var(--ink);cursor:pointer;font-family:inherit;z-index:2}
/* tables */
table.nut{width:100%;border-collapse:collapse;font-size:12.5px}
table.nut td{padding:3px 4px;border-bottom:1px solid #223047}
table.nut td:last-child{text-align:right;font-weight:600}
.steps{padding-left:0;list-style:none;counter-reset:s}
.steps li{counter-increment:s;display:flex;gap:9px;margin:8px 0;font-size:13.5px}
.steps li::before{content:counter(s);flex:none;width:22px;height:22px;background:var(--coral);color:#fff;border:1px solid #2c3a52;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.inglist{font-size:13.5px}
.inglist .it{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid #223047}
/* plan */
.pday{margin:10px 0}
.pday .dt{font-weight:700;font-size:13.5px;margin-bottom:4px}
.pslot{display:flex;gap:6px;flex-wrap:wrap}
.pslot .ps{flex:1;min-width:45%;background:#101827;border:1.7px dashed var(--ink2);border-radius:10px;padding:6px 8px;font-size:12px;cursor:pointer;min-height:44px}
.pslot .ps.has{border-style:solid;border-color:var(--ink);background:var(--mint2)}
.pslot .ps b{display:block;font-size:11px;color:var(--ink2);font-weight:600}
/* stats */
.mchart{display:flex;align-items:flex-end;gap:2px;height:90px;padding:4px 2px;border-bottom:2px solid var(--ink)}
.mchart i{flex:1;background:var(--coral);border-radius:4px 4px 0 0;min-height:2px;opacity:.85}
.mchart i.lo{background:var(--sun)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kpi{background:#1a2336;border:1px solid #2c3a52;border-radius:12px;padding:8px 10px;text-align:center}
.kpi b{font-size:19px;display:block}
.kpi span{font-size:11px;color:var(--ink2)}
/* trial */
.trow{display:flex;align-items:center;gap:9px;padding:8px 0;border-bottom:1.5px solid #223047}
.trow:last-child{border-bottom:none}
.dot{width:12px;height:12px;border-radius:50%;border:1px solid #2c3a52;flex:none}
.dot.try{background:var(--sun)} .dot.pass{background:var(--mint)} .dot.fail{background:var(--red)}
.empty{text-align:center;color:var(--ink2);padding:22px 8px;font-size:13.5px}
.empty svg{width:54px;height:54px;opacity:.5;display:block;margin:0 auto 8px}
.seg{display:flex;gap:0;border:1.5px solid #2c3a52;border-radius:14px;overflow:hidden;background:#101827}
.seg button{flex:1;border:none;background:none;font-family:inherit;font-size:12.5px;padding:7px 4px;cursor:pointer;color:var(--ink2)}
.seg button.on{background:var(--coral);color:#fff;font-weight:700}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;background:#22304b;color:#fff;padding:9px 18px;border-radius:16px;font-size:13.5px;z-index:99;opacity:0;transition:opacity .25s;pointer-events:none;max-width:88%;text-align:center}
.toast.show{opacity:1}
.ingrow{display:flex;gap:6px;margin:5px 0;align-items:center}
.ingrow select{flex:1}
.ingrow input{width:72px;flex:none}
.ingrow .x{flex:none;width:30px;height:30px;border-radius:50%;border:1.8px solid var(--red);background:#101827;color:var(--red);cursor:pointer;font-family:inherit}
.warnbox{background:#3a1b22;border:2px solid var(--red);border-radius:10px;padding:8px 12px;color:var(--red);font-size:13px;margin:8px 0}
.okbox{background:var(--mint2);border:2px solid var(--mint);border-radius:10px;padding:8px 12px;font-size:13px;margin:8px 0}
h4.sec{margin:16px 2px 6px;font-size:14px;color:var(--ink2)}
</style>
</head>

function target(){const u=user(),w=curW(u),t=bmr(u,w)*(u.act||1.375);
 let k=u.goal==='lose'?Math.max(1200,t-500):u.goal==='gain'?t+300:t;
 const prot=w*(u.goal==='gain'?2:u.goal==='lose'?1.8:1.4),fat=k*0.28/9,carb=Math.max(0,(k-prot*4-fat*9)/4);
 return{kcal:Math.round(k),prot:Math.round(prot),fat:Math.round(fat),carb:Math.round(carb),fib:25,na:2000,tdee:Math.round(t),bmr:Math.round(bmr(u,w))}}
function bmi(w,h){return w/Math.pow(h/100,2)}
function bmiCat(b){if(b<18.5)return['น้ำหนักน้อยกว่าเกณฑ์','var(--sun2)','var(--ink)'];
 if(b<23)return['สมส่วน','var(--mint2)','var(--ink)'];
 if(b<25)return['น้ำหนักเกิน','var(--sun2)','var(--ink)'];
 if(b<30)return['อ้วน (ระดับ 1)','#3a1b22','var(--red)'];
 return['อ้วนมาก (ระดับ 2)','#3a1b22','var(--red)']}
function toast(m){const t=$('#toast');t.textContent=typeof trStr==='function'?trStr(m):m;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),2200)}
function fmt(n,d=0){return Number(n).toLocaleString('th-TH',{maximumFractionDigits:d,minimumFractionDigits:0})}
function svg(id,st){return `<svg viewBox="0 0 32 32" ${st?`style="${st}"`:''}><use href="#${id}"/></svg>`}

function renderFood(){
 const sg=`<div class="seg" style="margin-top:12px">
  <button class="${FOOD_VIEW==='lib'?'on':''}" onclick="FOOD_VIEW='lib';renderFood()">📚 คลังเมนู</button>
  <button class="${FOOD_VIEW==='plan'?'on':''}" onclick="FOOD_VIEW='plan';renderFood()">📅 ตารางอาหาร</button></div>`;
 if(FOOD_VIEW==='plan'){renderMPlan(sg);return}
 const cats=[...new Set(allRecipes().map(r=>r.c))];
 let h=sg+`<div class="row" style="margin-top:9px">
  <div style="flex:1;position:relative">
   <input placeholder="ค้นหาเมนู / วัตถุดิบ..." value="${esc(MENU_Q)}" oninput="MENU_Q=this.value;drawFoodList()" style="padding-left:34px">
   <svg viewBox="0 0 32 32" style="width:17px;height:17px;position:absolute;left:11px;top:11px;color:var(--ink2)"><use href="#i-search"/></svg>
  </div></div>
 <div class="row" style="margin-top:8px">
  <span class="chip ${!MENU_CAT?'sel':''}" onclick="MENU_CAT='';renderFood()">ทั้งหมด</span>
  ${cats.map(c=>`<span class="chip ${MENU_CAT===c?'sel':''}" onclick="MENU_CAT='${c}';renderFood()">${c}</span>`).join('')}</div>
 <div class="row" style="margin-top:9px">
  <button class="btn sun sm" onclick="recipeForm()">＋ เพิ่มเมนูของฉัน</button>
  <button class="btn sm" onclick="ingManager()">🧺 วัตถุดิบ${S.ings.length?' ('+S.ings.length+')':''}</button></div>
 <div id="foodlist"></div>`;
 $('#view').innerHTML=h;drawFoodList()}
function drawFoodList(){const el=$('#foodlist');if(!el)return;
 const made={};S.logs.filter(l=>l.user===S.active&&l.rid).forEach(l=>made[l.rid]=(made[l.rid]||0)+1);
 let list=allRecipes();
 if(MENU_CAT)list=list.filter(r=>r.c===MENU_CAT);
 if(MENU_Q)list=list.filter(r=>r.n.includes(MENU_Q)||r.ings.some(([id])=>ING[id]?.n.includes(MENU_Q)));
 let h='';
 if(!list.length)h=`<div class="empty">${svg('i-search')}ไม่พบเมนูที่ค้นหา</div>`;
 list.forEach(r=>{const n=nutOf(r.ings);
  h+=`<div class="card rcard" onclick="recipeDetail('${r.id}')">
   <div class="ric"><svg viewBox="0 0 32 32"><use href="#${r.ic||'i-bowl'}"/></svg></div>
   <div style="flex:1"><div class="nm">${esc(r.n)} ${r.id[0]==='u'?'<span class="tag" style="background:var(--coral2)">ของฉัน</span>':''}</div>
    <div><span class="tag age">${r.c}</span>${made[r.id]?`<span class="tag" style="background:var(--mint2)">กิน ${made[r.id]} ครั้ง</span>`:''}</div>
    <div class="muted" style="margin-top:2px">${fmt(n[0])} กิโลแคลอรี · P ${fmt(n[1])} · F ${fmt(n[2])} · C ${fmt(n[3])} ก.</div>
   </div></div>`});
 el.innerHTML=h}
function recipeDetail(id){const r=getRecipe(id);if(!r)return;
 const n=nutOf(r.ings),t=target();
 let h=`<h2>${esc(r.n)}</h2><div><span class="tag age">${r.c}</span></div>
  ${r.tip?`<div class="okbox">💡 ${esc(r.tip)}</div>`:''}
  <h4 class="sec">ส่วนประกอบ (1 ที่)</h4><div class="inglist card flat" style="margin:4px 0">`;
 r.ings.forEach(([iid,g])=>{const it=ING[iid];if(it)h+=`<div class="it"><span>${it.n}</span><b>${g} ก.</b></div>`});
 h+=`</div><h4 class="sec">คุณค่าทางโภชนาการ (ต่อที่)</h4><div class="card flat" style="margin:4px 0"><table class="nut">`;
 NUTL.forEach(([k,nm,u],i)=>{h+=`<tr><td>${nm}</td><td>${fmt(n[i],1)} ${u}${i===0?` <span class="muted">(${Math.round(n[0]/t.kcal*100)}% ของเป้า)</span>`:''}</td></tr>`});
 h+=`</table></div>`;
 if(r.steps&&r.steps.length)h+=`<h4 class="sec">วิธีทำ</h4><ol class="steps">${r.steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ol>`;
 h+=`<button class="btn pri" style="width:100%;margin-top:12px" onclick="closeModal();TODAY_DATE=dstr();logFromRecipe('${r.id}')">🍽️ กินมื้อนี้</button>
  ${r.id[0]==='u'?`<div class="row" style="margin-top:8px"><button class="btn sm" onclick="recipeForm('${r.id}')">✏️ แก้ไข</button><button class="btn sm" style="color:var(--red);border-color:var(--red)" onclick="delRecipe('${r.id}')">ลบเมนู</button></div>`:''}`;
 openModal(h)}
function logFromRecipe(rid){const h=new Date().getHours();
 const mk=h<10?'br':h<14?'lu':h<17?'sn':'di';
 logForm(mk);setTimeout(()=>{$('#lg-rec').value=rid;logPickRecipe()},50)}
function delRecipe(id){if(!confirm(trStr('ลบเมนูนี้?')))return;S.recipes=S.recipes.filter(r=>r.id!==id);save();closeModal();renderFood()}
function recipeForm(editId){const ed=editId?getRecipe(editId):null;
 window._rIngs=ed?ed.ings.map(x=>[...x]):[['',0]];
 openModal(`<h2>${ed?'แก้ไขเมนู':'เพิ่มเมนูของฉัน'}</h2>
  <label class="fl">ชื่อเมนู</label><input id="rf-name" value="${ed?esc(ed.n):''}" placeholder="เช่น มื้อ meal prep ของฉัน">
  <label class="fl">หมวด</label>
  <select id="rf-c">${['คลีน/ฟิต','จานเดียว','มื้อเช้า/ว่าง','เครื่องดื่ม','อื่นๆ'].map(c=>`<option ${ed&&ed.c===c?'selected':''}>${c}</option>`).join('')}</select>
  <label class="fl">วัตถุดิบ + กรัม</label><div id="rf-ings"></div>
  <button class="btn sm ghost" onclick="window._rIngs.push(['',0]);drawRIngs()">＋ เพิ่มวัตถุดิบ</button>
  <button class="btn sm ghost" onclick="ingForm()">🆕 สร้างวัตถุดิบใหม่</button>
  <div id="rf-nut" class="muted" style="margin-top:5px"></div>
  <label class="fl">วิธีทำ (ไม่บังคับ, 1 บรรทัดต่อขั้นตอน)</label>
  <textarea id="rf-steps" rows="3">${ed&&ed.steps?esc(ed.steps.join('\n')):''}</textarea>
  <button class="btn pri" style="width:100%;margin-top:13px" onclick="saveRecipe('${editId||''}')">💾 บันทึกเมนู</button>`);
 drawRIngs()}
function drawRIngs(){const el=$('#rf-ings');if(!el)return;
 el.innerHTML=window._rIngs.map((ig,i)=>`<div class="ingrow">
  <select onchange="window._rIngs[${i}][0]=this.value;drawRIngs()">${ingOptions(ig[0])}</select>
  <input type="number" min="0" value="${ig[1]||''}" placeholder="กรัม" oninput="window._rIngs[${i}][1]=+this.value;updRNut()">
  <button class="x" onclick="window._rIngs.splice(${i},1);drawRIngs()">✕</button></div>`).join('');updRNut()}
function updRNut(){const el=$('#rf-nut');if(!el)return;const n=nutOf(window._rIngs.filter(x=>x[0]));
 el.innerHTML=`รวม: <b>${fmt(n[0])} กิโลแคลอรี</b> · P ${fmt(n[1],1)} · F ${fmt(n[2],1)} · C ${fmt(n[3],1)} ก.`}
function saveRecipe(editId){const n=$('#rf-name').value.trim();
 if(!n){toast('ใส่ชื่อเมนูก่อนนะ');return}
 const ings=window._rIngs.filter(x=>x[0]&&x[1]>0);
 if(!ings.length){toast('เพิ่มวัตถุดิบอย่างน้อย 1 อย่าง');return}
 const data={n,c:$('#rf-c').value,ic:'i-star',ings,steps:$('#rf-steps').value.split('\n').map(s=>s.trim()).filter(Boolean)};
 if(editId)Object.assign(getRecipe(editId),data);else S.recipes.push({id:'u'+uid(),...data});
 save();closeModal();toast('บันทึกเมนูแล้ว ⭐');renderFood()}

/* ================= หน้า: ร่างกาย (BMI + กราฟ) ================= */
function bodyChart(u){const recs=bodyRecs(u);if(recs.length<2)return'';
 const W=340,H=200,pl=32,pr=10,pt=10,pb=20;
 const t0=new Date(recs[0].date+'T00:00').getTime(),t1=new Date(recs[recs.length-1].date+'T00:00').getTime();
 const ws=recs.map(r=>r.w);
 const guides=[[18.5,'BMI 18.5'],[23,'BMI 23'],[25,'BMI 25']].map(([b,lb])=>[b*Math.pow(u.h/100,2),lb]);
 let lo=Math.min(...ws,...guides.map(g=>g[0]).filter(v=>v>Math.min(...ws)-8&&v<Math.max(...ws)+8))-2;
 let hi=Math.max(...ws)+2;lo=Math.floor(lo);hi=Math.ceil(hi);if(hi-lo<4){lo-=2;hi+=2}
 const X=t=>pl+(t1===t0?0.5:(t-t0)/(t1-t0))*(W-pl-pr),Y=v=>pt+(1-(v-lo)/(hi-lo))*(H-pt-pb);
 let s=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;display:block">`;
 for(let v=lo;v<=hi;v+=Math.max(1,Math.round((hi-lo)/5)))s+=`<line x1="${pl}" y1="${Y(v)}" x2="${W-pr}" y2="${Y(v)}" stroke="#223047"/><text x="${pl-4}" y="${Y(v)+3}" font-size="8" fill="#8b97ab" text-anchor="end">${v}</text>`;
 guides.forEach(([w,lb])=>{if(w>lo&&w<hi)s+=`<line x1="${pl}" y1="${Y(w)}" x2="${W-pr}" y2="${Y(w)}" stroke="#3a4a63" stroke-dasharray="4 3"/><text x="${W-pr}" y="${Y(w)-2}" font-size="7.5" fill="#5a6a85" text-anchor="end">${lb}</text>`});
 s+=`<polyline points="${recs.map(r=>X(new Date(r.date+'T00:00').getTime()).toFixed(1)+','+Y(r.w).toFixed(1)).join(' ')}" fill="none" stroke="var(--coral)" stroke-width="2"/>`;
 recs.forEach(r=>s+=`<circle cx="${X(new Date(r.date+'T00:00').getTime()).toFixed(1)}" cy="${Y(r.w).toFixed(1)}" r="3.2" fill="var(--coral)" stroke="#fff" stroke-width="1.3"/>`);
 s+=`<text x="${pl}" y="${H-6}" font-size="8" fill="#8b97ab">${thDate(recs[0].date)}</text><text x="${W-pr}" y="${H-6}" font-size="8" fill="#8b97ab" text-anchor="end">${thDate(recs[recs.length-1].date)}</text>`;
 return s+'</svg>'}
function renderBody(){const u=user(),recs=bodyRecs(u),t=target();
 const w=curW(u),b=bmi(w,u.h),[cat,bg,cl]=bmiCat(b);
 const idLo=(18.5*Math.pow(u.h/100,2)).toFixed(1),idHi=(22.9*Math.pow(u.h/100,2)).toFixed(1);
 const first=recs[0];
 let h=`<div style="margin-top:10px"><button class="btn pri" style="width:100%" onclick="bodyForm()">＋ บันทึกน้ำหนัก/สัดส่วน</button></div>`;
 h+=`<div class="card"><h3>${svg('i-grow','width:19px;color:var(--coral)')} ${esc(u.name)} · ${ageY(u)} ปี · ${u.h} ซม.</h3>
  <div class="kpis">
   <div class="kpi" style="background:${bg}"><b>${b.toFixed(1)}</b><span>BMI · <b style="color:${cl}">${cat}</b></span></div>
   <div class="kpi"><b>${w} กก.</b><span>น้ำหนักปัจจุบัน${first&&first.w!==w?`<br>${w>first.w?'+':''}${(w-first.w).toFixed(1)} กก. จากเริ่มต้น`:''}</span></div>
   <div class="kpi"><b>${fmt(t.bmr)}</b><span>BMR (กิโลแคลอรี/วัน)</span></div>
   <div class="kpi"><b>${fmt(t.tdee)}</b><span>TDEE เผาทั้งวัน</span></div>
  </div>
  <div class="muted" style="font-size:11.5px;margin-top:7px">น้ำหนักสมส่วนของส่วนสูง ${u.h} ซม. คือ <b>${idLo}–${idHi} กก.</b> (BMI 18.5–22.9 เกณฑ์เอเชีย) · เป้าพลังงาน ${fmt(t.kcal)} กิโลแคลอรี/วัน ตามเป้าหมาย "${GOALS[u.goal||'keep']}"</div></div>`;
 if(recs.length>1)h+=`<div class="card"><h3>📉 กราฟน้ำหนัก</h3>${bodyChart(u)}</div>`;
 if(recs.length){h+=`<div class="card"><h3>📒 ประวัติ</h3>`;
  [...recs].reverse().forEach(r=>{const rb=bmi(r.w,u.h);
   h+=`<div class="trow"><div style="flex:1"><b>${thDate(r.date)}</b>
    <div class="muted">⚖️ ${r.w} กก. · BMI ${rb.toFixed(1)}${r.fat?` · ไขมัน ${r.fat}%`:''}${r.waist?` · เอว ${r.waist} ซม.`:''}</div></div>
    <button class="btn sm" onclick="bodyForm('${r.id}')">✏️</button><button class="x" onclick="delBody('${r.id}')">✕</button></div>`});
  h+='</div>'}
 else h+=`<div class="empty">${svg('i-grow')}ยังไม่มีบันทึก ชั่งน้ำหนักแล้วมาจดกัน!</div>`;
 h+=`<p class="muted" style="font-size:10.5px;padding:0 4px">BMI เกณฑ์เอเชีย (WHO Asia-Pacific) · BMR สูตร Mifflin-St Jeor · ค่าประมาณเพื่อติดตามแนวโน้ม ไม่ใช่คำวินิจฉัยทางการแพทย์</p>`;
 $('#view').innerHTML=h}
function bodyForm(editId){const ed=editId?S.body.find(x=>x.id===editId):null;
 openModal(`<h2>${ed?'แก้ไขบันทึก':'บันทึกร่างกาย'}</h2>
  <label class="fl">วันที่</label><input id="bf-date" type="date" value="${ed?ed.date:dstr()}" max="${dstr()}">
  <label class="fl">น้ำหนัก (กก.)</label><input id="bf-w" type="number" step="0.1" min="20" max="250" value="${ed?ed.w:''}" placeholder="เช่น 62.5">
  <label class="fl">เปอร์เซ็นต์ไขมัน (ถ้ามีเครื่องวัด)</label><input id="bf-fat" type="number" step="0.1" min="3" max="60" value="${ed&&ed.fat?ed.fat:''}" placeholder="ไม่บังคับ">
  <label class="fl">รอบเอว (ซม.)</label><input id="bf-waist" type="number" step="0.5" min="40" max="200" value="${ed&&ed.waist?ed.waist:''}" placeholder="ไม่บังคับ">
  <button class="btn pri" style="width:100%;margin-top:13px" onclick="saveBody('${editId||''}')">💾 บันทึก</button>`)}
function saveBody(editId){const date=$('#bf-date').value,w=+$('#bf-w').value;
 if(!date||!w){toast('ใส่วันที่และน้ำหนักก่อนนะ');return}
 const data={date,w,fat:+$('#bf-fat').value||null,waist:+$('#bf-waist').value||null};
 if(editId)Object.assign(S.body.find(x=>x.id===editId),data);
 else S.body.push({id:uid(),user:S.active,...data});
 save();closeModal();toast('บันทึกแล้ว 📉');renderBody()}
function delBody(id){if(!confirm(trStr('ลบบันทึกนี้?')))return;S.body=S.body.filter(x=>x.id!==id);save();renderBody()}

/* ================= หน้า: สรุปรายเดือน ================= */
let STAT_MONTH=dstr().slice(0,7);
function renderStats(){const u=user(),t=target();
 const[y,mo]=STAT_MONTH.split('-').map(Number),dim=new Date(y,mo,0).getDate();
 const logs=S.logs.filter(l=>l.user===u.id&&l.date.startsWith(STAT_MONTH));
 const exs=S.ex.filter(e=>e.user===u.id&&e.date.startsWith(STAT_MONTH));
 const dayK={},dayP={};let sumK=0,sumP=0;
 logs.forEach(l=>{const n=nutOf(l.ings),e=l.eaten??1;
  sumK+=n[0]*e;sumP+=n[1]*e;dayK[l.date]=(dayK[l.date]||0)+n[0]*e;dayP[l.date]=(dayP[l.date]||0)+n[1]*e});
 const days=Object.keys(dayK).length;
 const okDays=Object.values(dayK).filter(k=>k>=t.kcal*0.9&&k<=t.kcal*1.1).length;
 const burn=exs.reduce((s,e)=>s+e.kcal,0);
 const top={};logs.forEach(l=>top[l.name]=(top[l.name]||0)+1);
 const tops=Object.entries(top).sort((a,b)=>b[1]-a[1]).slice(0,5);
 const brecs=bodyRecs(u).filter(r=>r.date.startsWith(STAT_MONTH));
 window._pm=()=>{const d=new Date(y,mo-2,1);STAT_MONTH=dstr(d).slice(0,7);renderStats()};
 window._nm=()=>{const d=new Date(y,mo,1);STAT_MONTH=dstr(d).slice(0,7);renderStats()};
 let h=`<div class="row between" style="margin-top:10px">
  <button class="btn sm ghost" onclick="_pm()">‹</button><b>📊 ${THM[mo-1]} ${y+543}</b>
  <button class="btn sm ghost" onclick="_nm()" ${STAT_MONTH>=dstr().slice(0,7)?'disabled':''}>›</button></div>`;
 h+=`<div class="card"><div class="kpis">
  <div class="kpi"><b>${days}</b><span>วันที่มีบันทึก</span></div>
  <div class="kpi"><b>${days?fmt(sumK/days):0}</b><span>กิโลแคลอรีเฉลี่ย/วัน</span></div>
  <div class="kpi"><b>${days?fmt(sumP/days):0} ก.</b><span>โปรตีนเฉลี่ย/วัน (เป้า ${t.prot})</span></div>
  <div class="kpi"><b>${okDays}</b><span>วันที่เข้าเป้า ±10%</span></div>
  <div class="kpi"><b>${exs.length}</b><span>ครั้งที่ออกกำลังกาย</span></div>
  <div class="kpi"><b>${fmt(burn)}</b><span>กิโลแคลอรีที่เผาเพิ่ม</span></div>
 </div>
 ${brecs.length>1?`<div class="okbox" style="margin-top:9px">⚖️ เดือนนี้น้ำหนัก ${brecs[0].w} → ${brecs[brecs.length-1].w} กก. (${(brecs[brecs.length-1].w-brecs[0].w>0?'+':'')+(brecs[brecs.length-1].w-brecs[0].w).toFixed(1)} กก.)</div>`:''}</div>`;
 h+=`<div class="card"><h3>${svg('i-chart','width:19px;color:var(--coral)')} พลังงานรายวัน <span class="muted" style="font-size:11px;font-weight:400">เป้า ${fmt(t.kcal)}</span></h3><div class="mchart">`;
 const mx=Math.max(t.kcal*1.2,...Object.values(dayK),1);
 for(let d=1;d<=dim;d++){const ds=STAT_MONTH+'-'+String(d).padStart(2,'0'),k=dayK[ds]||0;
  h+=`<i class="${k&&k<t.kcal*0.7?'lo':''}" style="height:${Math.max(2,k/mx*100)}%" onclick="TODAY_DATE='${ds}';go('today')"></i>`}
 h+=`</div><div class="row between muted" style="font-size:10px"><span>1</span><span>${dim} ${THM[mo-1]}</span></div></div>`;
 if(tops.length){h+=`<div class="card"><h3>${svg('i-star','width:19px;color:var(--sun)')} เมนูยอดฮิต</h3>`;
  tops.forEach(([n,c],i)=>{h+=`<div class="row between" style="padding:4px 0;border-bottom:1px solid #223047"><span>${['🥇','🥈','🥉','4.','5.'][i]} ${esc(n)}</span><b>${c} ครั้ง</b></div>`});
  h+='</div>'}
 if(!logs.length)h+=`<div class="empty">${svg('i-chart')}เดือนนี้ยังไม่มีบันทึก</div>`;
 $('#view').innerHTML=h}

let LINK_Q='',LINK_CAT='';
function renderLinks(){
 let h=`<div class="card" style="background:var(--sun2);margin-top:12px"><p style="font-size:12.5px;margin:0">💡 รวม <b>300 ไอเดียเมนูเฮลตี้</b> — แตะ 🔍 ค้นสูตรใน Google หรือ ▶ ดูวิธีทำใน YouTube ได้เลย</p></div>
 <div class="row" style="margin-top:8px"><div style="flex:1;position:relative">
  <input placeholder="ค้นหาเมนู..." value="${esc(LINK_Q)}" oninput="LINK_Q=this.value;drawLinkList()" style="padding-left:34px">
  <svg viewBox="0 0 32 32" style="width:17px;height:17px;position:absolute;left:11px;top:11px;color:var(--ink2)"><use href="#i-search"/></svg></div></div>
 <div class="row" style="margin-top:8px">
  <span class="chip ${!LINK_CAT?'sel':''}" onclick="LINK_CAT='';renderLinks()">ทั้งหมด</span>
  ${LINKS.map(x=>`<span class="chip ${LINK_CAT===x[0]?'sel':''}" onclick="LINK_CAT='${x[0]}';renderLinks()">${x[0]}</span>`).join('')}</div>
 <div id="linklist"></div>`;
 $('#view').innerHTML=h;drawLinkList()}
function drawLinkList(){const el=$('#linklist');if(!el)return;let h='',n=0;
 LINKS.forEach(([cat,items])=>{
  if(LINK_CAT&&cat!==LINK_CAT)return;
  const its=items.filter(x=>!LINK_Q||x.includes(LINK_Q)||trStr(x).toLowerCase().includes(LINK_Q.toLowerCase()));
  if(!its.length)return;
  h+=`<h4 class="sec">${cat} (${its.length})</h4><div class="card" style="margin:4px 0">`;
  its.forEach(x=>{n++;const q=encodeURIComponent(LANG==='en'?trStr(x)+' healthy recipe':'สูตร '+x+' เฮลตี้');
   h+=`<div class="trow"><div style="flex:1;font-size:13.5px">${x}</div>
    <a class="btn sm" style="text-decoration:none" href="https://www.google.com/search?q=${q}" target="_blank" rel="noopener">🔍</a>
    <a class="btn sm mint" style="text-decoration:none" href="https://www.youtube.com/results?search_query=${q}" target="_blank" rel="noopener">▶</a></div>`});
  h+='</div>'});
 if(!n)h=`<div class="empty">${svg('i-search')}ไม่พบเมนูที่ค้นหา</div>`;
 el.innerHTML=h}

function drawWorkoutList(){const el=$('#wolist');if(!el)return;let h='',n=0;
 WORKOUTS.forEach(([cat,items])=>{
  if(WO_CAT&&cat!==WO_CAT)return;
  const follow=cat.includes('เล่นตามคลิป');
  const its=items.filter(x=>{
   if(WO_Q&&!x[0].includes(WO_Q)&&!x[1].includes(WO_Q)&&!trStr(x[0]).toLowerCase().includes(WO_Q.toLowerCase()))return false;
   if(WO_FILT==='bg'&&!x[2])return false;
   if(WO_FILT==='noeq'&&x[1]!=='บอดี้เวท')return false;
   if(WO_FILT==='eq'&&x[1]==='บอดี้เวท')return false;
   return true});
  if(!its.length)return;
  h+=`<h4 class="sec">${cat} (${its.length} ${follow?'คลิป':'ท่า'})</h4><div class="card" style="margin:4px 0">`;
  its.forEach(([nm,eq,bg])=>{n++;
   h+=`<div class="trow"><div style="flex:1;font-size:13.5px">${nm}<br><span class="tag">${eq==='บอดี้เวท'?'🏠 ไม่ใช้อุปกรณ์':eq}</span>${bg?'<span class="tag" style="background:var(--mint2)">🌱 มือใหม่</span>':''}</div>
    <button class="btn sm sun" onclick="woPickDay('${nm}','${eq}')">＋</button>
    <a class="btn sm mint" style="text-decoration:none" href="${woURL(nm,follow)}" target="_blank" rel="noopener">▶</a></div>`});
  h+='</div>'});
 if(!n)h=`<div class="empty">${svg('i-search')}ไม่พบท่าที่ค้นหา</div>`;
 el.innerHTML=h+`<p class="muted" style="font-size:11px;padding:0 4px">มือใหม่เริ่มจากท่า 🌱 และน้ำหนักเบา เน้นฟอร์มถูกต้องก่อนเพิ่มความหนัก ถ้ามีอาการบาดเจ็บควรปรึกษาผู้เชี่ยวชาญ</p>`}

 const todayWd=(new Date().getDay()+6)%7;
 let h=`<div class="row" style="margin:8px 0 2px"><button class="btn mint sm" onclick="sharePlan()">📤 แชร์ตารางให้ลูกเทรน</button><button class="btn sm" onclick="importPlanForm()">📥 รับตารางจากโค้ช</button></div>
 <p class="muted" style="margin:4px 2px;font-size:12.5px">จัดตารางประจำสัปดาห์ — เพิ่มท่าจากคลัง (ปุ่ม ＋) หรือกด "เพิ่มท่า" ในแต่ละวัน · แตะป้ายเซ็ตเพื่อแก้จำนวน</p>`;
 WDAYS.forEach((d,i)=>{const items=p[i]||[];
  h+=`<div class="card pday" ${i===todayWd?'style="border-color:var(--coral);box-shadow:3px 3px 0 var(--coral2)"':''}>
   <div class="row between"><span class="dt">${d}${i===todayWd?' <span class="tag" style="background:var(--coral2)">วันนี้</span>':''} ${items.length?`<span class="muted" style="font-weight:400">· ${items.length} ท่า</span>`:''}</span>

  if(!items.length)h+=`<div class="muted" style="font-size:12px;padding:4px 2px">วันพัก 😴</div>`;
  items.forEach((it,j)=>{h+=`<div class="trow"><div style="flex:1;font-size:13px">${esc(it.n)} <span class="tag">${it.eq==='บอดี้เวท'?'🏠':esc(it.eq)}</span></div>
   <span class="tag age" style="cursor:pointer;font-size:11.5px" onclick="editWSets(${i},${j})">${esc(it.s)} ✏️</span>

   <button class="x" onclick="delWPlan(${i},${j})">✕</button></div>`});
  h+='</div>'});
 return h}

 <div class="row">${WDAYS.map((d,i)=>`<button class="btn sm" onclick="addToWPlan(${i},'${nm}','${eq}')">${d}</button>`).join('')}</div>`)}
function addToWPlan(d,nm,eq){const u=user();S.wplan=S.wplan||{};S.wplan[u.id]=S.wplan[u.id]||{};
 (S.wplan[u.id][d]=S.wplan[u.id][d]||[]).push({n:nm,eq,s:'3×10'});

  items.forEach(([nm,eq])=>{h+=`<button class="btn sm" style="margin:2px" onclick="addToWPlanQ(${day},'${nm}','${eq}')">${nm}</button>`});

  <button class="btn mint sm" onclick="sharePlanT('m')">📤 แชร์ตารางอาหาร</button>

function mpPick(day,mk){let h=`<h2>เลือกเมนู ${MEALS[mk]} · ${WDAYS[day]}</h2>

  h+=`<div class="card flat rcard" style="margin:7px 0" onclick="mpSet(${day},'${mk}','${r.id}')">

function mpSet(day,mk,rid){const u=user();S.mplan=S.mplan||{};S.mplan[u.id]=S.mplan[u.id]||{};
 S.mplan[u.id][day]=S.mplan[u.id][day]||{};
 if(!rid)delete S.mplan[u.id][day][mk];
 else{const r=getRecipe(rid),nv=nutOf(r.ings);
  S.mplan[u.id][day][mk]={rid,n:r.n,k:Math.round(nv[0]),pr:Math.round(nv[1])}}
 save();closeModal();renderFood()}

 const s=(((S.mplan||{})[u.id]||{})[wd]||{})[mk];if(!s)return;
 const r=s.rid&&getRecipe(s.rid);
 S.logs.push({id:uid(),user:S.active,date:TODAY_DATE,meal:mk,name:s.n,rid:r?r.id:null,ings:r?r.ings.map(x=>[...x]):[],eaten:1,note:''});

/* ===== แชร์ตาราง (เทรนเนอร์ → ลูกเทรน) — ใช้ได้ทั้งตารางฝึก (w) และตารางอาหาร (m) ===== */
function encodeShare(t){const u=user();const p=t==='m'?((S.mplan||{})[u.id]||{}):((S.wplan||{})[u.id]||{});
 return btoa(unescape(encodeURIComponent(JSON.stringify({v:1,t,from:u.name,p})))).replace(/\+/g,'-').replace(/\//g,'_')}
function decodePlan(code){try{
 code=String(code||'').trim();const m=code.match(/plan=([A-Za-z0-9\-_=]+)/);if(m)code=m[1];
 code=code.replace(/-/g,'+').replace(/_/g,'/');
 const d=JSON.parse(decodeURIComponent(escape(atob(code))));
 return d&&d.p?d:null}catch(e){return null}}
function sharePlanT(t){const u=user();const p=t==='m'?((S.mplan||{})[u.id]||{}):((S.wplan||{})[u.id]||{});
 const has=t==='m'?Object.values(p).some(d=>d&&Object.keys(d).length):Object.values(p).some(a=>a&&a.length);
 if(!has){toast('ตารางยังว่าง เพิ่มก่อนนะ');return}
 const code=encodeShare(t);

let SN={};
function openSnake(){go('game')}
function renderGame(){const e=LANG==='en';
 $('#view').innerHTML=`<div class="card" style="margin-top:12px"><h3>🐍 ${e?'Snake':'เกมงู'}${S.snakeHi?' · 🏆 '+S.snakeHi:''}</h3>
 <div class="row between" style="margin:2px 0 6px"><span class="muted" style="font-size:12px">${e?'Pass the time during cardio or rest sets':'เล่นเพลินๆ ระหว่างคาร์ดิโอหรือพักเซ็ต'}</span><b id="sn-score" style="font-size:16px">0</b></div>
 <canvas id="snake-cv" width="320" height="320" style="width:100%;max-width:360px;display:block;margin:0 auto;background:#0d1626;border:1.5px solid #2c3a52;border-radius:12px;touch-action:none"></canvas>
 <div class="row" style="justify-content:center;margin-top:9px;gap:8px;align-items:center">
  <button class="btn" style="width:56px;font-size:17px" onclick="snDir(-1,0)">◀</button>
  <div style="display:flex;flex-direction:column;gap:8px">
   <button class="btn" style="width:56px;font-size:17px" onclick="snDir(0,-1)">▲</button>
   <button class="btn" style="width:56px;font-size:17px" onclick="snDir(0,1)">▼</button></div>
  <button class="btn" style="width:56px;font-size:17px" onclick="snDir(1,0)">▶</button>
  <button class="btn mint" style="margin-left:8px" onclick="snStart()">🔄 ${e?'Restart':'เริ่มใหม่'}</button></div>
 <p class="muted" style="font-size:11px;text-align:center;margin:7px 0 0">${e?'Swipe on the board or use arrows · eat clean food, avoid walls and your tail · speeds up every 5 points!':'ปัดบนกระดานหรือกดปุ่มลูกศร · เก็บอาหารคลีน เลี่ยงกำแพงกับหางตัวเอง · ทุก 5 แต้มงูจะเร็วขึ้น!'}</p></div>`;
 snStart()}
function snStart(){const cv=document.getElementById('snake-cv');if(!cv)return;
 SN={g:16,z:20,dir:[1,0],next:[1,0],snake:[[8,8],[7,8],[6,8]],food:null,score:0,dead:false,speed:170};
 snFood();clearInterval(window._snT);window._snT=setInterval(snTick,SN.speed);
 const sc=document.getElementById('sn-score');if(sc)sc.textContent='0';
 cv.ontouchstart=ev=>{SN.tx=ev.touches[0].clientX;SN.ty=ev.touches[0].clientY;ev.preventDefault()};
 cv.ontouchend=ev=>{const dx=ev.changedTouches[0].clientX-SN.tx,dy=ev.changedTouches[0].clientY-SN.ty;
  if(Math.abs(dx)<12&&Math.abs(dy)<12)return;
  if(Math.abs(dx)>Math.abs(dy))snDir(dx>0?1:-1,0);else snDir(0,dy>0?1:-1);ev.preventDefault()};
 if(!window._snKey){window._snKey=true;
  window.addEventListener('keydown',ev=>{if(!document.getElementById('snake-cv'))return;
   const m={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]}[ev.key];
   if(m){snDir(m[0],m[1]);ev.preventDefault()}})}
 snDraw()}
function snDir(x,y){if(!SN.snake||SN.dead)return;
 if(SN.dir[0]===-x&&SN.dir[1]===-y)return;SN.next=[x,y]}
function snFood(){do{SN.food=[Math.floor(Math.random()*SN.g),Math.floor(Math.random()*SN.g)]}
 while(SN.snake.some(s=>s[0]===SN.food[0]&&s[1]===SN.food[1]))}
function snTick(){const cv=document.getElementById('snake-cv');
 if(!cv){clearInterval(window._snT);return}
 if(SN.dead)return;
 SN.dir=SN.next;
 const h=[SN.snake[0][0]+SN.dir[0],SN.snake[0][1]+SN.dir[1]];
 if(h[0]<0||h[1]<0||h[0]>=SN.g||h[1]>=SN.g||SN.snake.some(s=>s[0]===h[0]&&s[1]===h[1])){snOver();return}
 SN.snake.unshift(h);
 if(h[0]===SN.food[0]&&h[1]===SN.food[1]){SN.score++;
  const sc=document.getElementById('sn-score');if(sc)sc.textContent=SN.score;
  snFood();
  if(SN.score%5===0&&SN.speed>70){SN.speed-=14;clearInterval(window._snT);window._snT=setInterval(snTick,SN.speed)}}
 else SN.snake.pop();
 snDraw()}
function snDraw(){const cv=document.getElementById('snake-cv');if(!cv||!cv.getContext)return;
 const c=cv.getContext('2d'),z=SN.z;
 c.fillStyle='#0d1626';c.fillRect(0,0,320,320);
 c.fillStyle='#13203a';
 for(let i=0;i<SN.g;i++)for(let j=0;j<SN.g;j++)if((i+j)%2===0)c.fillRect(i*z,j*z,z,z);
 c.fillStyle='#ff7a59';c.beginPath();c.arc(SN.food[0]*z+z/2,SN.food[1]*z+z/2,z/2-3,0,7);c.fill();
 c.fillStyle='#2dd4bf';c.fillRect(SN.food[0]*z+z/2-1,SN.food[1]*z+2,2,4);
 SN.snake.forEach((s,i)=>{c.fillStyle=i===0?'#2f6fe0':'#4f8cff';
  c.fillRect(s[0]*z+1.5,s[1]*z+1.5,z-3,z-3)});
 const hd=SN.snake[0];c.fillStyle='#fff';
 c.fillRect(hd[0]*z+5,hd[1]*z+5,3,3);c.fillRect(hd[0]*z+12,hd[1]*z+5,3,3)}
function snOver(){SN.dead=true;clearInterval(window._snT);
 S.snakeHi=Math.max(S.snakeHi||0,SN.score);save();
 const e=LANG==='en';
 const cv=document.getElementById('snake-cv');
 if(cv&&cv.getContext){const c=cv.getContext('2d');
  c.fillStyle='rgba(0,0,0,.65)';c.fillRect(0,0,320,320);
  c.fillStyle='#fff';c.textAlign='center';c.font='bold 24px sans-serif';
  c.fillText(e?'Game over!':'จบเกม!',160,140);
  c.font='15px sans-serif';
  c.fillText((e?'Score ':'ได้ ')+SN.score+(e?' · Best ':' แต้ม · สถิติ ')+(S.snakeHi||0),160,172)}
 const sc=document.getElementById('sn-score');if(sc)sc.textContent=SN.score+' · 🏆 '+(S.snakeHi||0)}

function openSettings(){let h=`<h2>⚙️ ตั้งค่า</h2><h4 class="sec">โปรไฟล์</h4>`;
 S.users.forEach(u=>{h+=`<div class="card flat row between" style="margin:6px 0">

  <div><button class="btn sm" onclick="userForm('${u.id}')">✏️</button>
  <button class="btn sm" style="color:var(--red);border-color:var(--red)" onclick="delUser('${u.id}')">ลบ</button></div></div>`});

function userForm(editId){const ed=editId?S.users.find(u=>u.id===editId):null;
 openModal(`<h2>${ed?'แก้ไขโปรไฟล์':'สร้างโปรไฟล์'}</h2>
 <label class="fl">ชื่อ</label><input id="uf-name" value="${ed?esc(ed.name):''}" placeholder="เช่น ไอยู">
 <label class="fl">เพศ</label><div class="seg" id="uf-sex">
  <button data-v="m" class="${!ed||ed.sex==='m'?'on':''}" onclick="segSel(this)">👨 ชาย</button>
  <button data-v="f" class="${ed&&ed.sex==='f'?'on':''}" onclick="segSel(this)">👩 หญิง</button></div>
 <div class="row"><div style="flex:1"><label class="fl">วันเกิด</label><input id="uf-bd" type="date" value="${ed?ed.bd:''}" max="${dstr()}"></div>
 <div style="flex:1"><label class="fl">ส่วนสูง (ซม.)</label><input id="uf-h" type="number" min="100" max="230" value="${ed?ed.h:''}" placeholder="165"></div></div>
 ${ed?'':'<label class="fl">น้ำหนักปัจจุบัน (กก.)</label><input id="uf-w" type="number" step="0.1" min="20" max="250" placeholder="60">'}
 <label class="fl">กิจกรรมในชีวิตประจำวัน</label>
 <select id="uf-act">${ACTS.map(([v,n])=>`<option value="${v}" ${ed&&ed.act===v?'selected':''}>${n}</option>`).join('')}</select>
 <label class="fl">เป้าหมาย</label>
 <select id="uf-goal">${Object.entries(GOALS).map(([k,n])=>`<option value="${k}" ${ed&&ed.goal===k?'selected':''}>${n}</option>`).join('')}</select>
 <button class="btn pri" style="width:100%;margin-top:13px" onclick="saveUser('${editId||''}')">💾 บันทึก</button>`)}
function saveUser(editId){const name=$('#uf-name').value.trim(),bd=$('#uf-bd').value,h=+$('#uf-h').value;
 if(!name||!bd||!h){toast('กรอกชื่อ วันเกิด และส่วนสูงก่อนนะ');return}
 const sex=$('#uf-sex .on')?.dataset.v||'m',act=+$('#uf-act').value,goal=$('#uf-goal').value;
 if(editId)Object.assign(S.users.find(u=>u.id===editId),{name,bd,h,sex,act,goal});
 else{const id=uid(),w=+($('#uf-w')?.value)||60;
  S.users.push({id,name,bd,h,sex,act,goal,w0:w});S.active=id;
  S.body.push({id:uid(),user:id,date:dstr(),w})}
 save();closeModal();toast('บันทึกแล้ว 💪');renderAll()}
function delUser(id){if(!confirm(trStr('ลบโปรไฟล์นี้ รวมบันทึกทั้งหมด?')))return;
 S.users=S.users.filter(u=>u.id!==id);S.logs=S.logs.filter(l=>l.user!==id);
 S.body=S.body.filter(b=>b.user!==id);S.ex=S.ex.filter(e=>e.user!==id);
 if(S.active===id)S.active=S.users[0]?.id||null;
 save();closeModal();renderAll()}
function exportData(){const b=new Blob([JSON.stringify(S,null,1)],{type:'application/json'});
 const a=document.createElement('a');a.href=URL.createObjectURL(b);
 a.download='IUFIT-สำรอง-'+dstr()+'.json';a.click();toast('ดาวน์โหลดไฟล์สำรองแล้ว')}
function importData(inp){const f=inp.files[0];if(!f)return;
 const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);
  if(!d.users)throw 0;S=d;['logs','recipes','ings','body','ex'].forEach(k=>S[k]=S[k]||[]);S.water=S.water||{};S.wplan=S.wplan||{};S.mplan=S.mplan||{};mergeIngs();
  save();closeModal();toast('กู้คืนสำเร็จ ✓');renderAll()}
  catch(e){toast('ไฟล์ไม่ถูกต้อง')}};r.readAsText(f)}

/* — เครื่องมือแปล — */
function trStr(s){if(LANG!=='en'||!s||!/[฀-๿]/.test(s))return s;
 if(!EN_KEYS)EN_KEYS=Object.keys(EN).sort((a,b)=>b.length-a.length);
 for(const k of EN_KEYS){if(s.includes(k))s=s.split(k).join(EN[k])}
 return s}
function trEl(n){if(LANG!=='en'||!n)return;
 if(n.nodeType===3){const v=trStr(n.nodeValue);if(v!==n.nodeValue)n.nodeValue=v;return}
 if(n.nodeType!==1)return;
 const w=document.createTreeWalker(n,NodeFilter.SHOW_TEXT),arr=[];
 while(w.nextNode())arr.push(w.currentNode);
 arr.forEach(t=>{const v=trStr(t.nodeValue);if(v!==t.nodeValue)t.nodeValue=v});
 if(n.querySelectorAll)n.querySelectorAll('input,textarea').forEach(i=>{if(i.placeholder)i.placeholder=trStr(i.placeholder)});
 if((n.tagName==='INPUT'||n.tagName==='TEXTAREA')&&n.placeholder)n.placeholder=trStr(n.placeholder)}
function toggleLang(){S.lang=(LANG==='th'?'en':'th');save();location.reload()}
if(typeof MutationObserver!=='undefined'){
 new MutationObserver(ms=>{if(LANG!=='en')return;ms.forEach(m=>m.addedNodes&&m.addedNodes.forEach(n=>trEl(n)))})
 .observe(document.body,{childList:true,subtree:true})}

if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0){navigator.serviceWorker.register('./sw.js')}
