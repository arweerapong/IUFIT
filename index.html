    <!-- ── CONTENT SECURITY POLICY ────────────────────────────────────────────────────
         ⚠️ ตัวนี้ **หายไปตอนพอร์ตมา Vue** — แอปจริง (IUFIT-app-deploy/index.html L7) มี
         CSP อยู่ แต่ index.html ของบิลด์นี้ไม่มีเลย = ถอยหลังด้านความปลอดภัยทั้งบิลด์
         ไม่ใช่แค่เรื่องวิดีโอ · ที่นี่ยก CSP ของแอปจริงมาเป็นฐาน แล้วปรับตาม "สิ่งที่บิลด์
         Vue ใช้จริง" (ตรวจจากโค้ดใน src/ ไม่ได้เดา) — ดูสรุปการเปลี่ยนแปลงท้ายบล็อกนี้

         ต่างจากของแอปจริงตรงไหน และทำไม:
           + script-src  https://cdnjs.cloudflare.com
               บิลด์นี้โหลด Chart.js (BodyChart.vue) และ html2canvas (lib/exportCard.ts)
               จาก cdnjs แบบ dynamic <script> · แอปจริงไม่ได้ใช้สองตัวนี้จึงไม่มีในลิสต์
               ⚠️ ถ้าไม่ใส่ = กราฟร่างกายและการ์ดผลลัพธ์พังทันที
           + script-src  https://www.youtube.com https://s.ytimg.com
               IFrame Player API (www.youtube.com/iframe_api → โหลด widgetapi จาก s.ytimg)
               จำเป็นเพราะเราต้องรู้ให้ได้ว่าคลิปถูกเจ้าของปิดการฝังไว้ (error 101/150)
               ไม่งั้นผู้ใช้จะเจอจอดำเงียบ ๆ
           + frame-src   https://www.youtube-nocookie.com https://www.youtube.com
               ⚠️ **จุดที่พังแน่ถ้าลืม** — ไม่มี frame-src จะตกไปใช้ default-src 'self'
               ⇒ iframe ของ YouTube ถูกบล็อก 100% (แอปจริงก็ขาดบรรทัดนี้อยู่เหมือนกัน)
           + img-src     https://i.ytimg.com https://i9.ytimg.com
               ภาพปกคลิปที่ตัวเล่นดึงมาโชว์ก่อนกดเล่น
           - script-src  ถอด https://static.line-scdn.net / https://*.line-scdn.net
           - connect-src ถอด line.me / line-scdn / generativelanguage / openfoodfacts
           - form-action ถอด https://access.line.me
               ทั้งหมดนี้ **บิลด์ Vue ไม่ได้เรียกเลย** (grep แล้วไม่มี LIFF/SDK ของ LINE ·
               AI ยิงผ่าน worker ไม่ได้ยิง Gemini ตรง · ไม่มีการค้น OpenFoodFacts)
               ลิงก์ไป line.me ที่ยังมีอยู่เป็น <a href> ธรรมดา ซึ่ง CSP ไม่คุมการนำทาง
               ⇒ ปุ่ม "ต่ออายุผ่าน LINE" / ส่ง log เข้า LINE OA ยังทำงานปกติ
           = คง 'unsafe-eval' ไว้ตามแอปจริง
               ยังไม่พบว่ามีใครใช้ eval/new Function ในบิลด์นี้ แต่ตัดออกแล้วถ้ามีไลบรารี
               ตัวไหนแอบใช้ = ขาวทั้งหน้าโดยไม่มีสัญญาณเตือน ⇒ ปล่อยไว้ก่อน แล้วค่อยลอง
               ตัดออกทีหลังพร้อมเทสต์เต็มรอบ (เจ้าของตัดสินใจ)
           = คง 'unsafe-inline' ของ style-src
               Vue ฉีด <style> ของ SFC เข้ามาตอนรัน และมี :style binding เยอะมาก
               ⇒ ตัดออก = ทั้งแอปไม่มีสไตล์

         ⚠️ CSP ผ่าน <meta> รองรับเกือบทุก directive ยกเว้น frame-ancestors / report-uri
         (เบราว์เซอร์จะเมินสองตัวนี้ตอนอยู่ใน meta) — คงไว้เพื่อให้ตรงกับแอปจริง แต่ถ้า
         อยากกัน clickjacking จริงจังต้องส่งเป็น HTTP header ที่ฝั่งโฮสต์ -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://www.youtube.com https://s.ytimg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https://*.workers.dev https://i.ytimg.com https://i9.ytimg.com; media-src 'self' blob: https://*.workers.dev; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://*.workers.dev https://*.firebasedatabase.app https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; frame-src https://www.youtube-nocookie.com https://www.youtube.com; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'"
    />
