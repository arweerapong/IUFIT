<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI credits · IUFIT</title>
<meta name="description" content="IUFIT AI credit packs — scan food photos and analyse with AI">
<link rel="stylesheet" href="billing.css?v=v108">
</head>
<body>
<div class="wrap">
<div style="display:flex;justify-content:space-between;align-items:center">
  <a class="logo" href="https://iufit.com">IU<span>FIT</span></a>
  <span id="langtog" style="font-size:12px;font-weight:800;color:var(--muted);cursor:pointer"></span>
</div>
<div class="nav"><a class="on" id="n-pr" href="pricing.html"></a><a id="n-bl" href="billing.html"></a><a id="n-mp" href="my-plan.html"></a></div>

<h1 id="h-title"></h1>
<p class="sub" id="h-sub"></p>
<div id="storeNote" class="bn info hide"><b id="sn-t"></b><span id="sn-m"></span></div>

<div class="grid" id="grid"></div>

<div class="trust-row"><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6z"/><path d="M9 12l2 2 4-4"/></svg><i id="tr-pay"></i></span><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6z"/><path d="M9 12l2 2 4-4"/></svg><i id="tr-ssl"></i></span></div>
<p class="note"><span id="p-note"></span> · <a class="blue" href="terms.html" id="l-terms">Terms</a> · <a class="blue" href="privacy.html" id="l-priv">Privacy</a></p>
<div id="foot"></div>
</div>

<script src="billing-common.js?v=v117"></script>
<script>
var B=window.IUFIT_BILLING;
function T(id,k){var el=document.getElementById(id);if(el)el.innerHTML=B.t(k);}
document.getElementById('langtog').textContent=(B.LANG==='en'?'ไทย':'EN');
document.getElementById('langtog').onclick=function(){B.setLang(B.LANG==='en'?'th':'en');};
T('n-pr','nav_pricing');T('n-bl','nav_billing');T('n-mp','nav_myplan');
T('h-title','cr_title');T('h-sub','cr_sub');
T('tr-pay','trust_pay');T('tr-ssl','trust_ssl');
T('p-note','note_soft');
if(B.IS_STORE){
  document.getElementById('storeNote').classList.remove('hide');
  T('sn-t','store_guard_t');T('sn-m','store_guard_m');
}
var g=document.getElementById('grid');
var h='';
B.CREDIT_PACKS.forEach(function(c){
  h+='<div class="card" style="padding:16px">'
    +'<b style="font-size:16px;color:var(--navy)">'+B.t('cr_title')+' '+c.name+'</b>'
    +'<div class="psub" style="margin-top:4px">'+B.t('cr_scan')+' '+c.scan+' · '+B.t('cr_analyze')+' '+c.analyze+'</div>'
    +'<div style="font-size:20px;font-weight:850;color:var(--blue);margin-top:8px">฿'+B.fmt(c.price)+'</div>'
    +'<div class="psub">'+B.t('cr_once')+'</div>'
    +(B.IS_STORE?'':'<a class="btn pri" style="margin-top:12px" href="billing.html?plan='+c.k+'&lang='+B.LANG+'">'+B.t('nav_billing')+'</a>')
    +'</div>';
});
g.innerHTML=h;
document.getElementById('foot').innerHTML=B.footerHtml();
</script>
</body>
</html>
