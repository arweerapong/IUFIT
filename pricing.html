  <div class="psub" id="ad-e"></div>
</div>

<p class="sub" id="pp-s"></p>
<div class="grid" id="ppgrid"></div>

<div class="trust-row"><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6z"/><path d="M9 12l2 2 4-4"/></svg><i id="tr-pay"></i></span><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6z"/><path d="M9 12l2 2 4-4"/></svg><i id="tr-pp"></i></span><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6z"/><path d="M9 12l2 2 4-4"/></svg><i id="tr-ssl"></i></span></div>
<div class="how">
  <h2 id="hw-t"></h2>
  <ol><li id="hw-1"></li><li id="hw-2"></li><li id="hw-3"></li></ol>
</div>

<h2 class="sec-title" id="why-t"></h2>
<div class="why-grid"><div class="why"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg></div><div><b id="w1t"></b><p id="w1m"></p></div></div><div class="why"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v4M12 17v4M4 12h4M16 12h4M6.5 6.5l2.5 2.5M15 15l2.5 2.5M17.5 6.5L15 9M9 15l-2.5 2.5"/></svg></div><div><b id="w2t"></b><p id="w2m"></p></div></div><div class="why"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3"/><path d="M3 20c0-3 3-5 6-5s6 2 6 5"/><path d="M16.5 5.3a3 3 0 0 1 0 5.4M18.5 20c0-2-1-3.6-2.6-4.4"/></svg></div><div><b id="w3t"></b><p id="w3m"></p></div></div><div class="why"><div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 4v4h4"/><path d="M12 8v4l3 2"/></svg></div><div><b id="w4t"></b><p id="w4m"></p></div></div></div>
<!-- พื้นที่รีวิวจริง: เมื่อมีรีวิวลูกค้าจริง ใส่การ์ด <div class="why">...</div> เพิ่มตรงนี้ได้ -->
<h2 class="sec-title" id="faq-t"></h2>
<details class="faq"><summary id="f1q"></summary><p id="f1a"></p></details>
<details class="faq"><summary id="f2q"></summary><p id="f2a"></p></details>
<details class="faq"><summary id="f3q"></summary><p id="f3a"></p></details>
<details class="faq"><summary id="f4q"></summary><p id="f4a"></p></details>
<details class="faq"><summary id="f5q"></summary><p id="f5a"></p></details>
<p class="note"><span id="p-note"></span> · <a class="blue" href="terms.html" id="l-terms">Terms</a> · <a class="blue" href="privacy.html" id="l-priv">Privacy</a></p>
<div id="foot"></div>
</div>

<script src="billing-common.js?v=v116"></script>
<script>
var B=window.IUFIT_BILLING, YR=false;
function T(id,k){var el=document.getElementById(id);if(el)el.innerHTML=B.t(k);}
document.getElementById('langtog').textContent=(B.LANG==='en'?'ไทย':'EN');
document.getElementById('langtog').onclick=function(){B.setLang(B.LANG==='en'?'th':'en');};
T('n-pr','nav_pricing');T('n-bl','nav_billing');T('n-mp','nav_myplan');
T('h-title','pricing_title');T('h-sub','pricing_sub');T('h-launch','launch');T('pp-t','personal_title');T('pp-s','personal_sub');
T('t-mo','monthly');T('t-yr','yearly');
/* ปุ่มสลับรายปีคงข้อความเดิม — การแจ้งว่ายังไม่เปิดอยู่ที่การ์ดด้านล่างตัวสลับ */
if(!B.YEARLY_OPEN){var tgP=document.getElementById('toggle');
  if(tgP&&tgP.insertAdjacentHTML)tgP.insertAdjacentHTML('afterend',
    '<div class="bn info" style="margin:10px 0 0"><b>'+B.t('yr_soon_t')+'</b><span>'+B.t('yr_soon_m')+'</span></div>');}
T('ad-t','addon_title');T('ad-d','addon_desc');T('ad-p','addon_price');T('ad-e','addon_eg');
T('hw-t','how_title');T('hw-1','how1');T('hw-2','how2');T('hw-3','how3');
T('th-t','trial_hero_t');T('th-m','trial_hero_m');T('th-cta','trial_hero_cta');
T('tr-pay','trust_pay');T('tr-pp','trust_pp');T('tr-ssl','trust_ssl');
T('why-t','why_title');T('w1t','why1_t');T('w1m','why1_m');T('w2t','why2_t');T('w2m','why2_m');T('w3t','why3_t');T('w3m','why3_m');T('w4t','why4_t');T('w4m','why4_m');
T('faq-t','faq_title');T('f1q','faq1_q');T('f1a','faq1_a');T('f2q','faq2_q');T('f2a','faq2_a');T('f3q','faq3_q');T('f3a','faq3_a');T('f4q','faq4_q');T('f4a','faq4_a');T('f5q','faq5_q');T('f5a','faq5_a');
T('p-note','note_soft');
document.getElementById('l-terms').textContent=(B.LANG==='en'?'Terms':'ข้อกำหนด');
document.getElementById('l-priv').textContent=(B.LANG==='en'?'Privacy':'ความเป็นส่วนตัว');
if(B.IS_STORE){document.getElementById('storeNote').classList.remove('hide');T('sn-t','store_note_t');T('sn-m','store_note_m');}
/* รายปียังปิด ⇒ กดแล้วพาไป LINE · `return` ก่อนแตะ YR คือด่านกันยอดเกินเพดาน ห้ามเอาออก */
function setCycle(yr){
  if(yr&&!B.YEARLY_OPEN){try{window.open(B.LINE_URL,'_blank','noopener');}catch(e){}return;}
  YR=yr;document.getElementById('t-mo').className=yr?'':'on';document.getElementById('t-yr').className=yr?'on':'';draw();}
function draw(){
  var cur=B.currentPlanKey(),g=document.getElementById('grid'),h='';
  B.PLANS.forEach(function(p){
    if(p.k==='free'||p.k==='personal_pro')return;
    var isCur=(cur===p.k);
    h+='<div class="card'+(p.hot?' hot':'')+(isCur?' cur':'')+'">';
    if(isCur)h+='<span class="badge cur">'+B.t('current_plan')+'</span>';
    else if(p.badge)h+='<span class="badge">'+B.planBadge(p)+'</span>';
    h+='<div class="pname">'+p.name+'</div><div class="psub">'+B.planSub(p)+'</div>';
    h+='<div class="price">';
    if(p.contact)h+='<span class="now" style="font-size:20px;color:var(--navy)">'+B.t('contact')+'</span>';
    else if(YR)h+=(p.yrWas?'<span class="was">฿'+B.fmt(p.yrWas)+'</span>':'')+'<span class="now">฿'+B.fmt(p.yr)+'</span><span class="unit"> '+B.t('per_yr')+'</span><div class="save">≈ ฿'+B.fmt(Math.round(p.yr/12))+B.t('per_mo')+(p.k==='pro'?(' · '+B.t('launch_price')):'')+'</div>';
    else h+=(p.moWas?'<span class="was">฿'+B.fmt(p.moWas)+'</span>':'')+'<span class="now">฿'+B.fmt(p.mo)+'</span><span class="unit"> '+B.t('per_mo')+'</span>'+(p.k==='pro'?('<div class="save">'+B.t('launch_price')+'</div>'):'');
    h+='</div><div class="feats">';B.planFeats(p).forEach(function(f){h+='✓ '+f+'<br>';});h+='</div>';
    if(B.IS_STORE)h+='<a class="cta ghost" href="'+B.LINE_URL+'" target="_blank" rel="noopener">'+B.t('cta_line')+'</a>';
    else if(p.contact)h+='<a class="cta ghost" href="'+B.LINE_URL+'" target="_blank" rel="noopener">'+B.t('contact')+'</a>';
    else h+='<a class="cta pri" href="billing.html?plan='+p.k+'&cycle='+(YR?'yr':'mo')+'&lang='+B.LANG+'">'+B.t('choose_plan')+'</a>';
    h+='</div>';
  });
  g.innerHTML=h;
}
function drawPersonal(){var p=B.getPlan('personal_pro');if(!p)return;var free=(B.LANG==='en'?'Free':'ฟรี'),start=(B.LANG==='en'?'Start free':'เริ่มใช้ฟรี');var cur=B.currentPlanKey(),isCur=(cur===p.k),h='<div class="card'+(isCur?' cur':'')+'">';if(isCur)h+='<span class="badge cur">'+B.t('current_plan')+'</span>';else if(p.badge)h+='<span class="badge">'+B.planBadge(p)+'</span>';h+='<div class="pname">'+p.name+'</div><div class="psub">'+B.planSub(p)+'</div><div class="price"><span class="now" style="color:var(--green)">'+free+'</span></div><div class="feats">';B.planFeats(p).forEach(function(f){h+='✓ '+f+'<br>';});h+='</div><a class="cta ghost" href="open.html">'+start+'</a></div>';var el=document.getElementById('ppgrid');if(el)el.innerHTML=h;}
draw();drawPersonal();
try{var _f=document.getElementById("foot");if(_f)_f.innerHTML=B.footerHtml();}catch(e){}
</script>
</body>
</html>
